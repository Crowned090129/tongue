# fly.toml — Fly.io deployment config for Tongue
# Deploy with: fly deploy
# Docs: https://fly.io/docs/reference/configuration/

app            = "tongue-app"
primary_region = "iad"   # US East (Ashburn) — closest to most English-speaking users

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT     = "3001"

[http_service]
  internal_port        = 3001
  force_https          = true
  auto_stop_machines   = "off"
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 500
    soft_limit = 300

  # /health answers 503 when the database is unreachable. Fly marks a machine
  # failing this check as unhealthy, and `fly deploy` waits for new machines to
  # pass it before moving on.
  [[http_service.checks]]
    grace_period = "20s"
    interval     = "30s"
    timeout      = "5s"
    method       = "GET"
    path         = "/health"

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
  # Scale up by adding more [[vm]] blocks or via: fly scale count 3

# Uncomment to add a second region (e.g. for Europe):
# [[regions]]
#   code = "lhr"   # London
