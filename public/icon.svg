<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" fill="none">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5F7E"/>
      <stop offset="100%" stop-color="#C0153E"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0F4"/>
      <stop offset="100%" stop-color="#FFD6E0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="52" height="52" rx="14" fill="url(#bg)"/>

  <!-- Tongue shape -->
  <path d="M 17 11
           Q 26 7 35 11
           Q 44 16 43 29
           Q 42 44 26 50
           Q 10 44 9 29
           Q 8 16 17 11 Z"
        fill="url(#tg)"/>

  <!-- Median sulcus -->
  <path d="M 26 17 Q 26 34 26 46"
        stroke="rgba(255,255,255,0.28)" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Highlight -->
  <ellipse cx="20" cy="23" rx="4.5" ry="7"
           fill="rgba(255,255,255,0.28)"
           transform="rotate(-18 20 23)"/>
</svg>
