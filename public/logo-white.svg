<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 52" fill="none">
  <defs>
    <linearGradient id="tgw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8FA3"/>
      <stop offset="100%" stop-color="#FF4B6E"/>
    </linearGradient>
  </defs>

  <!-- Icon box (glass) -->
  <rect width="52" height="52" rx="14" fill="rgba(255,255,255,0.15)"/>
  <rect width="52" height="52" rx="14" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none"/>

  <!-- Tongue shape -->
  <path d="M 17 11
           Q 26 7 35 11
           Q 44 16 43 29
           Q 42 44 26 50
           Q 10 44 9 29
           Q 8 16 17 11 Z"
        fill="url(#tgw)"/>

  <!-- Median sulcus -->
  <path d="M 26 17 Q 26 34 26 46"
        stroke="rgba(255,255,255,0.35)" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Highlight -->
  <ellipse cx="20" cy="23" rx="4.5" ry="7"
           fill="rgba(255,255,255,0.3)"
           transform="rotate(-18 20 23)"/>

  <!-- Wordmark white -->
  <text x="64" y="30" font-family="system-ui,-apple-system,sans-serif"
        font-size="22" font-weight="900" fill="white" letter-spacing="0.5">TONGUE</text>
  <text x="65" y="44" font-family="system-ui,-apple-system,sans-serif"
        font-size="9.5" font-weight="600" fill="rgba(255,255,255,0.6)" letter-spacing="1.5">SPEAK EVERY TONGUE</text>
</svg>
