  <!-- Capacitor: push notification initialisation.
       Runs only when inside the native iOS/Android app (window.Capacitor exists).
       Requests permission once after login, registers token with our backend. -->
  <script>
  (function() {
    // Wait for Capacitor bridge to be ready
    document.addEventListener("deviceready", initNative, false);
    // Also try immediately in case bridge is already loaded
    if (window.Capacitor) initNative();

    function initNative() {
      if (!window.Capacitor?.isNativePlatform()) return;
      const { PushNotifications } = window.Capacitor.Plugins;
      if (!PushNotifications) return;

      // Request push permission + register token (called after user logs in)
      window.__registerPushToken = async function(authToken) {
        try {
          const permResult = await PushNotifications.requestPermissions();
          if (permResult.receive !== "granted") return;

          await PushNotifications.register();

          PushNotifications.addListener("registration", async ({ value: deviceToken }) => {
            const platform = window.Capacitor.getPlatform(); // 'ios' or 'android'
            try {
              await fetch("/api/push/register", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + authToken,
                },
                body: JSON.stringify({ token: deviceToken, platform }),
              });
              console.log("[Push] Token registered for", platform);
            } catch (e) {
              console.warn("[Push] Token registration failed:", e.message);
            }
          });

          PushNotifications.addListener("registrationError", (err) => {
            console.warn("[Push] Registration error:", err.error);
          });

          // Handle tapping a notification while app is in background
          PushNotifications.addListener("pushNotificationActionPerformed", (action) => {
            const screen = action.notification?.data?.screen;
            if (screen === "practice") {
              // Scroll to the Coach tab
              setTimeout(() => {
                const btn = document.querySelector('[data-tab="0"]');
                if (btn) btn.click();
              }, 500);
            }
          });

        } catch (e) {
          console.warn("[Push] Init error:", e.message);
        }
      };

      // Remove token on logout
      window.__unregisterPushToken = async function(authToken) {
        try {
          const { PushNotifications } = window.Capacitor.Plugins;
          const registration = await PushNotifications.getDeliveredNotifications().catch(() => null);
          if (registration?.token) {
            await fetch("/api/push/token", {
              method: "DELETE",
              headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + authToken,
              },
              body: JSON.stringify({ token: registration.token }),
            }).catch(() => {});
          }
        } catch (_) {}
      };
    }
  })();
  </script>

  <div id="root"></div>
  <script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

// ─── SPEECH ──────────────────────────────────────────────────────────────────
let voices = [];
let activeLang = "fr-FR";
let activeVoice = "";

// Safe accessor — works on Safari/iPad where speechSynthesis can be tricky
const synth = () => {
  try { return (typeof window !== "undefined" && window.speechSynthesis) ? window.speechSynthesis : null; }
  catch (e) { return null; }
};

const loadVoices = () => {
  const s = synth();
  if (!s) return;
  try { const v = s.getVoices(); if (v && v.length > 0) voices = v; } catch (e) {}
};

const say = (text) => {
  const s = synth();
  if (!s) return;
  try { s.cancel(); } catch (e) {}

  const speak = () => {
    try {
      const fresh = s.getVoices();
      if (fresh && fresh.length > 0) voices = fresh;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = activeLang;
      u.rate = 0.80;
      u.pitch = 1.0;
      u.volume = 1.0;
      if (activeVoice) {
        const v = voices.find(v => v.name === activeVoice);
        if (v) u.voice = v;
      } else {
        const pfx = activeLang.split("-")[0];
        const v = voices.find(v => v.lang === activeLang) || voices.find(v => v.lang.startsWith(pfx));
        if (v) u.voice = v;
      }
      s.speak(u);
    } catch (e) {}
  };

  try { if (s.speaking) { setTimeout(speak, 200); } else { speak(); } }
  catch (e) { speak(); }
};

// ─── THEME ───────────────────────────────────────────────────────────────────
// ── DESIGN TOKEN BRIDGE ──────────────────────────────────────────────────────
// C reads from CSS custom properties so pasting a new :root{} block from
// Claude Design instantly reskins every inline-style in the app.
function _cv(name) {
  try { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); } catch(e) { return ""; }
}
const C = {
  get bg()         { return _cv("--bg")          || "#FAF7F2"; },
  get card()       { return _cv("--surf")         || "#FFFFFF"; },
  get surf()       { return _cv("--surf")         || "#FFFFFF"; },
  get soft()       { return _cv("--surf2")        || "#F1ECE3"; },

  get bdr()        { return _cv("--line")         || "rgba(23,22,27,.12)"; },
  get line()       { return _cv("--line")         || "rgba(23,22,27,.12)"; },
  get blue()       { return _cv("--accent")       || "#C0153E"; },
  get accent()     { return _cv("--accent")       || "#C0153E"; },
  get accentSoft() { return _cv("--accentSoft")   || "rgba(192,21,62,.1)"; },
  get accentLine() { return _cv("--accentLine")   || "rgba(192,21,62,.18)"; },
  get pink()       { return _cv("--accent-2")     || "#FF5F7E"; },
  get green()      { return _cv("--green")        || "#22A06B"; },
  get red()        { return _cv("--red")          || "#E5484D"; },

  get orange()     { return _cv("--orange")       || "#E8902B"; },
  get amber()      { return _cv("--orange")       || "#E8902B"; },
  get info()       { return _cv("--info")         || "#3B7DD8"; },
  get text()       { return _cv("--text")         || "#17161B"; },
  get mid()        { return _cv("--text")         || "#17161B"; },
  get muted()      { return _cv("--muted")        || "rgba(23,22,27,.55)"; },
  get faint()      { return _cv("--faint")        || "rgba(23,22,27,.4)"; },

};

// ─── LUCIDE ICON HELPER ──────────────────────────────────────────────────────
// Renders a Lucide icon inline. size defaults to 18, color to currentColor.
function Icon({ name, size = 18, color, style: extraStyle }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current) return;
    let cancelled = false, tries = 0;
    const render = () => {
      if (cancelled || !ref.current) return;
      // lucide loads from a CDN; if it isn't ready yet, retry briefly instead of
      // giving up forever (this is why always-mounted icons like the FAB were blank).
      if (!window.lucide) { if (tries++ < 40) setTimeout(render, 75); return; }
      ref.current.innerHTML = "";
      const el = document.createElement("i");
      el.dataset.lucide = name;
      el.style.display = "block";
      ref.current.appendChild(el);
      try { window.lucide.createIcons({ nodes: [el] }); } catch(e) {}
    };
    render();
    return () => { cancelled = true; };
  }, [name, size, color]);
  const s = { display:"inline-flex", alignItems:"center", justifyContent:"center", width:size, height:size, flexShrink:0, color: color || "currentColor", ...extraStyle };
  return <span ref={ref} style={s} />;
}

// Re-run lucide on any component that needs it (call inside useEffect)
function useLucide(deps) {
  React.useEffect(() => {
    if (typeof window !== "undefined" && window.lucide) {
      try { window.lucide.createIcons(); } catch(e) {}
    }
  }, deps || []);
}

// ─── NAVIGATION (view + stack) ────────────────────────────────────────────────
// Simple app-level navigation utilities used by the new IA.
// The App component owns the state; these just build the next state slice.
function makeNavState(view, currentView, currentStack) {
  return { view, stack: [...currentStack, currentView] };
}
function makeBackState(currentStack) {
  const stack = [...currentStack];
  const prev = stack.pop() || "explore";
  return { view: prev, stack };
}

// Native language preference (module-level so askClaude can read it without prop drilling)
let _nativeLang = (() => {
  const SUPPORTED = ["en","fr","es","pt","it","de","zh","ja","ko","ru","ar","hi"];
  try {
    const saved = localStorage.getItem("native_lang");
    if (saved && SUPPORTED.includes(saved)) return saved;
    // Default to the device/browser language when the user hasn't chosen one.
    const dev = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").slice(0,2).toLowerCase();
    return SUPPORTED.includes(dev) ? dev : "en";
  } catch(e) { return "en"; }
})();

  pt: { name: "Portuguese", flag: "🇧🇷" }, it: { name: "Italian",    flag: "🇮🇹" },

// Global translation helper — reads _nativeLang so no prop threading needed
function t(key, vars) {
  const dict = UI_STRINGS[_nativeLang] || UI_STRINGS.en;
  let s = dict[key] || UI_STRINGS.en[key] || key;
  if (vars) Object.keys(vars).forEach(k => { s = s.replace("{" + k + "}", vars[k]); });
  return s;
}

// ─── RESPONSIVE HOOK ─────────────────────────────────────────────────────────
// Returns true when viewport width is ≤ 640 px. Updates on resize.
function useMobile() {
  const [mobile, setMobile] = React.useState(() => {
    try { return window.innerWidth <= 640; } catch(e) { return false; }
  });
  React.useEffect(() => {
    const fn = () => setMobile(window.innerWidth <= 640);
    window.addEventListener("resize", fn, { passive: true });
    return () => window.removeEventListener("resize", fn);
  }, []);
  return mobile;
}

// True on wide screens — drives the two-pane desktop layout with a persistent sidebar.
function useDesktop() {
  const [desktop, setDesktop] = React.useState(() => {
    try { return window.innerWidth >= 900; } catch(e) { return false; }
  });
  React.useEffect(() => {
    const fn = () => setDesktop(window.innerWidth >= 900);
    window.addEventListener("resize", fn, { passive: true });
    return () => window.removeEventListener("resize", fn);
  }, []);
  return desktop;
}

  return (
    <button
      onPointerDown={(e) => { e.stopPropagation(); e.preventDefault(); say(text); }}
      aria-label="Play pronunciation"
      style={{
        background: C.blue, border: "none", borderRadius: 6, cursor: "pointer",
        padding: sm ? "3px 5px" : "5px 7px", color: "#fff", flexShrink: 0,
        display: "inline-flex", alignItems: "center", justifyContent: "center",
      }}>
      <Icon name="volume-2" size={sm ? 12 : 14} color="#fff" />
    </button>
  );
}

const FC_KEY = "fc_cards_v2";

function fcLoad() {
  try { return JSON.parse(localStorage.getItem(FC_KEY) || "[]"); } catch(e) { return []; }
}
function fcSave(cards) {
  try { localStorage.setItem(FC_KEY, JSON.stringify(cards)); } catch(e) {}
}

function fcAdd(card) {
  // card: { lang, front, back, pronunciation, example }
  const cards = fcLoad();
  // Deduplicate by front+lang
  if (cards.find(c => c.lang === card.lang && c.front.toLowerCase() === card.front.toLowerCase())) return false;
  cards.unshift({
    id:          Date.now(),
    lang:        card.lang || "fr",
    front:       card.front || "",
    back:        card.back  || "",
    pronunciation: card.pronunciation || "",
    example:     card.example || "",
    interval:    1,
    repetitions: 0,
    ease:        2.5,
    next_review: Date.now(),
  });
  fcSave(cards);
  return true;
}

function sm2(card, quality) {
  // quality: 0=Again, 1=Hard, 2=Good, 3=Easy
  let { interval, repetitions, ease } = card;
  if (quality === 0) {
    interval = 1; repetitions = 0;
  } else {
    const q5 = [0, 2, 4, 5][quality]; // map 0-3 → SM2 quality 0-5
    ease = Math.max(1.3, ease + 0.1 - (5 - q5) * (0.08 + (5 - q5) * 0.02));
    if (repetitions === 0) interval = 1;
    else if (repetitions === 1) interval = 6;
    else interval = Math.round(interval * ease);
    if (quality === 3) interval = Math.round(interval * 1.6); // Easy bonus
    repetitions++;
  }
  const next_review = Date.now() + interval * 86400000;
  return { ...card, interval, repetitions, ease, next_review };
}

function SaveToFlashcardsBtn({ card }) {
  const [saved, setSaved] = useState(false);
  const handle = () => {
    const ok = fcAdd(card);
    setSaved(ok ? true : "dup");

  if (saved === "dup") return <div style={{ textAlign:"center", color:C.muted, fontSize:12, padding:"4px 0" }}>{t("already_saved")}</div>;
  return (

      fontWeight:700, fontSize:13, cursor:"pointer", fontFamily:"inherit",
    }}>
      {saved ? t("saved_flashcard") : t("save_flashcard")}
    </button>
  );
}

let _authToken = "";
let _authExpiry = null;
let _userEmail = "";
let _userPlan = "";
try {
  _authToken = localStorage.getItem("auth_token") || "";
  _authExpiry = localStorage.getItem("auth_expiry") || null;
  _userEmail = localStorage.getItem("auth_email") || "";
  _userPlan = localStorage.getItem("auth_plan") || "";
} catch(e) {}

const getToken = () => _authToken;
const isLoggedIn = () => !!(
  _authToken && _authExpiry && new Date(_authExpiry) > new Date()
);
const saveSession = (token, expiresAt, email, plan) => {
  _authToken = token; _authExpiry = expiresAt;
  _userEmail = email || ""; _userPlan = plan || "";
  try {
    localStorage.setItem("auth_token", token);
    localStorage.setItem("auth_expiry", expiresAt);
    if (email) localStorage.setItem("auth_email", email);
    if (plan) localStorage.setItem("auth_plan", plan);
  } catch(e) {}
  // Register push notification token if running in the native app
  if (window.__registerPushToken) {
    setTimeout(() => window.__registerPushToken(token), 1000);
  }
};
const logout = () => {
  // Unregister push token before clearing session
  if (window.__unregisterPushToken && _authToken) {
    window.__unregisterPushToken(_authToken).catch(() => {});
  }
  _authToken = ""; _authExpiry = null; _userEmail = ""; _userPlan = "";
  try { ["auth_token","auth_expiry","auth_email","auth_plan"].forEach(k => localStorage.removeItem(k)); } catch(e) {}
};

const getUserPlan = () => _userPlan;

// ── STREAK SYSTEM ─────────────────────────────────────────────────────────────
// Client-side streak tracking (localStorage) + server sync on every new day.
const _streak = {
  get() {
    try {
      return {
        count:   parseInt(localStorage.getItem("streak_count")   || "0"),
        longest: parseInt(localStorage.getItem("streak_longest") || "0"),
        total:   parseInt(localStorage.getItem("streak_total")   || "0"),
        last:    localStorage.getItem("streak_last") || "",
      };
    } catch(e) { return { count:0, longest:0, total:0, last:"" }; }
  },
  log() {
    try {
      const today     = new Date().toDateString();
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      const s = this.get();
      if (s.last === today) return s.count; // Already logged today
      const newCount   = (s.last === yesterday) ? s.count + 1 : 1;
      const newLongest = Math.max(newCount, s.longest);
      localStorage.setItem("streak_count",   String(newCount));
      localStorage.setItem("streak_longest", String(newLongest));
      localStorage.setItem("streak_total",   String(s.total + 1));
      localStorage.setItem("streak_last",    today);
      // Notify App component to refresh streak display
      window.dispatchEvent(new CustomEvent("streak-updated", { detail: { count: newCount } }));
      // Also sync to server (async, non-blocking)
      if (isLoggedIn()) {
        fetch("/api/streaks/log", { method:"POST", headers:{ "Authorization":"Bearer "+getToken() } }).catch(()=>{});
      }
      return newCount;
    } catch(e) { return 0; }
  },
};

async function askClaude(prompt, maxTokens, lang, nativeLang) {
  if (!isLoggedIn()) throw new Error("NOT_LOGGED_IN");
  const res = await fetch("/api/claude", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() },
    body: JSON.stringify({ prompt, maxTokens: maxTokens || 1000, language: lang || "fr", nativeLang: nativeLang || _nativeLang || "en" }),
  });
  if (res.status === 401) {
    const errData = await res.json().catch(() => ({}));
    logout();
    if (errData.reason === "renewed") {
      window.dispatchEvent(new CustomEvent("session-renewed"));
      throw new Error("RENEWED");
    }
    throw new Error("UNAUTHORIZED");
  }
  if (res.status === 429) {
    const errData = await res.json().catch(() => ({}));
    if (errData.upgrade) {
      window.dispatchEvent(new CustomEvent("show-upgrade", { detail: { reason: "ai_limit" } }));
      throw new Error("FREE_LIMIT");
    }
    throw new Error("RATE_LIMITED");
  }
  if (!res.ok) throw new Error("API_ERROR:" + res.status);
  const data = await res.json();
  // Log a practice session every time AI is successfully called
  _streak.log();
  return data;
}

// Streaming conversation client. Reads the SSE stream from /api/claude/chat and
// invokes onDelta(text) as words arrive, onDone(meta) at the end, onError(ev).
async function streamChat({ messages, scenario, level, lang, nativeLang }, { onDelta, onDone, onError }) {
  if (!isLoggedIn()) { onError && onError({ type:"auth", message:"Please sign in." }); return; }
  let res;
  try {
    res = await fetch("/api/claude/chat", {
      method: "POST",
      headers: { "Content-Type":"application/json", "Authorization":"Bearer "+getToken() },
      body: JSON.stringify({ messages, scenario, level, language: lang || "fr", nativeLang: nativeLang || _nativeLang || "en" }),
    });
  } catch(e) { onError && onError({ type:"connection", message:"Connection error. Please try again." }); return; }

  if (res.status === 401) {
    const d = await res.json().catch(()=>({})); logout();
    if (d.reason === "renewed") { window.dispatchEvent(new CustomEvent("session-renewed")); onError && onError({ type:"renewed" }); return; }
    onError && onError({ type:"auth", message:"Session expired. Please sign in again." }); return;
  }
  if (res.status === 429) {
    const d = await res.json().catch(()=>({}));
    if (d.upgrade) { window.dispatchEvent(new CustomEvent("show-upgrade", { detail:{ reason:"ai_limit" } })); onError && onError({ type:"limit" }); return; }
    onError && onError({ type:"limit", message: d.error || "Please slow down a moment." }); return;
  }
  if (!res.ok || !res.body) { onError && onError({ type:"api", message:"The tutor hit a snag. Please try again." }); return; }

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "", meta = {};
  try {
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream:true });
      const parts = buffer.split("\n\n");
      buffer = parts.pop() || "";
      for (const part of parts) {
        const line = part.split("\n").find(l => l.startsWith("data:"));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
        if (ev.type === "delta") onDelta && onDelta(ev.text);
        else if (ev.type === "done") meta = ev;
        else if (ev.type === "error") { onError && onError(ev); return; }
      }
    }
    _streak.log();
    onDone && onDone(meta);
  } catch(e) { onError && onError({ type:"connection", message:"Connection lost. Please try again." }); }
}

// Loads Google Identity Services once and resolves when window.google is ready.
// Config (the public client id) comes from /api/config; the button only shows
// when GOOGLE_CLIENT_ID is set on the server.
let _gsiPromise = null;
function loadGsi() {
  if (window.google && window.google.accounts && window.google.accounts.id) return Promise.resolve();
  if (_gsiPromise) return _gsiPromise;
  _gsiPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true; s.defer = true;
    s.onload = () => resolve();
    s.onerror = () => { _gsiPromise = null; reject(new Error("GSI_LOAD_FAILED")); };
    document.head.appendChild(s);
  });
  return _gsiPromise;
}
let _clientConfigPromise = null;
function getClientConfig() {
  if (!_clientConfigPromise) {
    _clientConfigPromise = fetch("/api/config")
      .then(r => r.ok ? r.json() : {})
      .catch(() => ({}));
  }
  return _clientConfigPromise;
}

  const urlParams = new URLSearchParams(window.location.search);

  // Passwordless: email the user a one-tap login link.
  const requestMagicLink = async () => {
    if (!email.includes("@")) { setErr("Enter a valid email address first."); return; }
    setMagicLoading(true); setErr("");
    try {
      const res = await fetch("/api/auth/magic-link/request", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email.trim() }),
      });
      const data = await res.json();
      if (!res.ok) { setErr(data.error || "Could not send the link."); setMagicLoading(false); return; }
      setMagicSent(true);
    } catch(e) { setErr("Connection error. Please try again."); }
    setMagicLoading(false);
  };

  // Called by Google Identity Services with a verified ID token.
  const onGoogleCredential = async (resp) => {
    if (!resp || !resp.credential) return;
    setLoading(true); setErr("");
    try {
      const res = await fetch("/api/auth/google", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ credential: resp.credential }),
      });
      const data = await res.json();
      if (!res.ok) { setErr(data.error || "Google sign-in failed."); setLoading(false); return; }
      saveSession(data.token, data.expiresAt, data.email, data.plan);
      try { if (!localStorage.getItem("_seen_onboard")) localStorage.setItem("_new_login","1"); } catch(e){}
      if (onLogin) onLogin();
    } catch(e) { setErr("Connection error. Please try again."); }
    setLoading(false);
  };

  // Set up the Google button only if the server has a client id configured.
  useEffect(() => {
    let cancelled = false;
    getClientConfig().then(cfg => {
      if (cancelled || !cfg || !cfg.googleClientId) return;
      loadGsi().then(() => {
        if (cancelled || !window.google || !googleBtnRef.current) return;
        try {
          window.google.accounts.id.initialize({
            client_id: cfg.googleClientId,
            callback: onGoogleCredential,
          });
          window.google.accounts.id.renderButton(googleBtnRef.current, {
            theme: "outline", size: "large", width: 334, text: "continue_with", shape: "rectangular",
          });
          setGoogleOn(true);
        } catch(e) { /* button stays hidden on failure */ }
      }).catch(() => {});
    });
    return () => { cancelled = true; };
  }, []);

    if (code.trim().length < 6) { setErr("Please enter your access code."); return; }
    setLoading(true); setErr("");
    try {
      const res = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: code.trim().toUpperCase() }),

    setLoading(false);

        method: "POST",
        headers: { "Content-Type": "application/json" },

      if (onLogin) onLogin();
    } catch(e) { setErr("Connection error. Please try again."); }
    setLoading(false);
  };

    <div style={{ fontFamily:"system-ui,-apple-system,sans-serif", background:"#f1f5f9", minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", padding:"20px" }}>

            </div>
            <input value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&signupFree()}
              placeholder="your@email.com" type="email" autoFocus
              style={{ width:"100%", padding:"12px 14px", borderRadius:10, border:`2px solid ${err?"#dc2626":"#e2e8f0"}`, fontSize:16, marginBottom:10, boxSizing:"border-box" }}
            />
            {err && <div style={{ color:"#dc2626", fontSize:13, marginBottom:10, textAlign:"center" }}>{err}</div>}
            <button onClick={signupFree} disabled={loading||magicLoading} style={{ width:"100%", padding:13, background:"#C0153E", color:"#fff", border:"none", borderRadius:10, fontWeight:700, fontSize:15, cursor:loading?"default":"pointer", marginBottom:10 }}>
              {loading ? "Creating account..." : "Start for free →"}
            </button>
            <button onClick={requestMagicLink} disabled={loading||magicLoading} style={{ width:"100%", padding:0, background:"none", border:"none", color:"#64748b", fontSize:13, fontWeight:600, cursor:magicLoading?"default":"pointer", fontFamily:"inherit", marginBottom:2 }}>
              {magicLoading ? "Sending link…" : "Already have an account? Email me a login link →"}
            </button>
          </>
        )}

        <div style={{ borderTop:"1px solid #f1f5f9", paddingTop:14, textAlign:"center" }}>
          <a href="/subscribe" style={{ display:"inline-block", padding:"9px 20px", background:"#dcfce7", border:"1px solid #86efac", borderRadius:9, color:"#16a34a", fontWeight:700, fontSize:13, textDecoration:"none" }}>
            Upgrade to Premium — from $9/month
          </a>
        </div>
      </div>
    </div>
  );
}

function AICoach({ tLang, rLangs, nativeLang }) {
  const [type, setType]       = useState(null);
  const [ex, setEx]           = useState(null);
  const [answer, setAnswer]   = useState("");
  const [fb, setFb]           = useState(null);
  const [loading, setLoading] = useState(false);
  const [picked, setPicked]   = useState(null);

  const tName    = TARGETS[tLang]?.name || "French";
  const refNames = rLangs.length > 0 ? rLangs.map(l => REFS[l]?.name || l).join(" and ") : "English";
  const synergy  = TARGETS[tLang]?.synergy || [];

  const generate = async (exType) => {
    setLoading(true);
    setEx(null);
    setFb(null);
    setAnswer("");
    setPicked(null);
    setType(exType);

    // "write" exercise doesn't need a Claude call to set up
    if (exType === "write") {
      setEx({ instruction: `Write anything in ${tName} — a sentence, a few lines, or a short paragraph on any topic. Your coach will analyse your grammar, vocabulary, and style, and explain every correction clearly.` });
      setLoading(false);
      return;
    }

    const prompts = {
      word: `You are a ${tName} language coach for speakers of ${refNames}. Return ONLY a valid JSON object with no extra text: {"word":"a useful ${tName} word","pronunciation_guide":"how to say it using simple English phonetics","meaning_en":"English meaning","meaning_ref":"meaning in ${refNames}","example":"${tName} example sentence","example_en":"English translation","memory_tip":"how to remember it","ref_note":"connection or difference vs ${refNames}"}`,
      fill: `You are a ${tName} teacher for ${refNames} speakers. Return ONLY a valid JSON object: {"sentence":"${tName} sentence with [BLANK] where a word is missing","full_translation":"English translation of the complete sentence","answer":"the missing word","hint":"grammatical hint","why":"why this is the correct answer"}`,
      trans: `You are a ${tName} teacher. Give a ${refNames} sentence for the student to translate into ${tName}. Return ONLY a valid JSON object: {"source":"sentence in ${refNames}","answer":"correct ${tName} translation","grammar_focus":"key grammar point","tip":"helpful hint without giving away the answer"}`,
      opinion: `You are a ${tName} conversation coach. Give the student a topic to discuss in ${tName}. Return ONLY a valid JSON object: {"topic":"interesting discussion topic","question":"specific question to answer in ${tName}","starter":"opening phrase in ${tName} to get them going","vocab":[{"word":"","meaning":""}],"target":"3 to 5 sentences"}`,
      quiz: `Create a ${tName} grammar or vocabulary multiple-choice question for a ${refNames} speaker. Return ONLY a valid JSON object: {"question":"","A":"option A","B":"option B","C":"option C","D":"option D","correct":"A","why":"explanation of why the answer is correct","concept":"grammar concept being tested"}`,
      convo: `Create a ${tName} role-play scenario. Return ONLY a valid JSON object: {"situation":"brief description of the scenario","opener":"what the other person says in ${tName}","opener_en":"English translation","guidance":"what kind of response to give","phrases":["useful ${tName} phrase 1","useful ${tName} phrase 2"]}`,
    };

    try {
      const result = await askClaude(prompts[exType], 1000, tLang, nativeLang);
      setEx(result);
    } catch (err) {
      if (err.message !== "FREE_LIMIT") {
        setEx({ error: "Could not generate the exercise. Please check your connection and try again." });
      }
    }
    setLoading(false);
  };

  const submit = async () => {
    if (!answer.trim()) return;
    setLoading(true);
    const context = JSON.stringify(ex);

    let prompt = "";
    if (type === "write" || type === "opinion") {
      prompt = `You are an encouraging ${tName} language coach. The student wrote: "${answer}". Exercise context: ${context}. Evaluate their ${tName}. Return ONLY a valid JSON object: {"corrected":"improved version of their text","score":"A/B/C/D","praise":"specific thing they did well","fixes":[{"wrong":"","right":"","note":""}],"encouragement":"warm motivating message","tip":"one concrete next step"}`;
    } else if (type === "fill" || type === "trans") {
      prompt = `You are a ${tName} teacher. Exercise: ${context}. Student answered: "${answer}". Return ONLY a valid JSON object: {"correct":true,"student_answer":"${answer.replace(/"/g, "'")}","ideal_answer":"","explanation":"clear encouraging explanation","grammar_note":"key rule to remember","ref_connection":"how this relates to ${refNames} if helpful"}`;
    } else if (type === "convo") {
      prompt = `You are a ${tName} conversation coach. Scenario: ${context}. Student said in ${tName}: "${answer.replace(/"/g, "'")}". Continue the conversation and give feedback. Return ONLY a valid JSON object: {"reply":"your reply in ${tName}","reply_en":"English translation","feedback":"assessment of their response","fixes":[{"wrong":"","right":"","note":""}],"next_line":"a follow-up line the student could say to continue"}`;
    }

    try {
      setFb(await askClaude(prompt, 1000, tLang, nativeLang));
    } catch (err) {
      if (err.message !== "FREE_LIMIT") {
        setFb({ error: "Could not evaluate your answer. Please try again." });
      }
    }
    setLoading(false);
  };

  const scoreColor = { A: C.green, B: C.green, C: C.text, D: C.red };

  return (
    <div>
      {/* Synergy panel */}
      {synergy.length > 0 && (
        <Box accent={C.accent + "30"}>
          <div style={{ fontWeight: 800, color: C.accent, fontSize: 13, marginBottom: 8 }}>Your Language Synergy</div>
          <div style={{ color: C.mid, fontSize: 13, marginBottom: 10 }}>
            {tName} is related to these languages. Learning them together multiplies your progress.
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
            {synergy.map(s => TARGETS[s] && (
              <div key={s} style={{ background: C.accent + "10", border: `1px solid ${C.accent}28`, borderRadius: 10, padding: "7px 12px" }}>
                <div style={{ fontWeight: 700, color: C.accent, fontSize: 13 }}>{TARGETS[s].flag} {TARGETS[s].name}</div>
                <div style={{ color: C.muted, fontSize: 11, marginTop: 2 }}>{SYNERGY_DESC[tLang]?.[s] || "Related language"}</div>
              </div>
            ))}
          </div>
          {rLangs.some(l => synergy.includes(l)) && (
            <Info text={`You already speak ${rLangs.filter(l => synergy.includes(l)).map(l => REFS[l]?.name).join(" and ")} — that gives you a head start in ${tName}. Many patterns will feel familiar.`} color={C.green} />
          )}
        </Box>
      )}

      {/* Contextual help */}
      <div style={{ background: C.accent + "08", border: `1px solid ${C.accent}20`, borderRadius: 10, padding: "10px 14px", marginBottom: 14, fontSize: 12, color: C.mid, lineHeight: 1.6 }}>
        <strong style={{ color: C.accent }}>How it works:</strong> Pick an exercise below — your Coach builds a fresh personalised task for {tName}. Type your answer, get instant feedback with grammar notes and corrections. For best results, practise a little every day rather than long sessions.
      </div>

      {/* Quick-start prompts */}
      <div style={{ fontWeight: 700, color: C.muted, fontSize: 10, textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>
        Quick start
      </div>
      <div style={{ display: "flex", gap: 7, flexWrap: "wrap", marginBottom: 14 }}>
        {[
          { label: "Teach me a word", id: "word" },
          { label: "Quiz me", id: "quiz" },
          { label: "Let's role-play", id: "convo" },
          { label: "I'll write freely", id: "write" },
        ].map(q => (
          <button key={q.id} onClick={() => generate(q.id)} style={{
            padding: "7px 14px", borderRadius: 20, border: `1px solid ${C.accent}40`,
            background: C.accent + "10", color: C.accent, fontSize: 12, fontWeight: 700,
            cursor: "pointer",
          }}>{q.label}</button>
        ))}
      </div>

      {/* Exercise type grid */}
      <div style={{ fontWeight: 700, color: C.muted, fontSize: 10, textTransform: "uppercase", letterSpacing: 1, marginBottom: 10 }}>
        Pick an exercise — tap any to start instantly
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
        {EXERCISE_TYPES.map(et => (
          <button key={et.id} onClick={() => generate(et.id)} style={{
            background: type === et.id ? C.accent : C.card,
            border: `2px solid ${type === et.id ? C.accent : C.bdr}`,
            borderRadius: 14, padding: "13px 12px", textAlign: "left",
            cursor: "pointer", boxShadow: C.sh, transition: "transform .1s",
          }}>
            <div style={{ fontSize: 24, marginBottom: 5 }}>{et.icon}</div>
            <div style={{ fontWeight: 800, color: type === et.id ? "#fff" : C.text, fontSize: 13, marginBottom: 3 }}>{t("ex_"+et.id+"_label")}</div>
            <div style={{ color: type === et.id ? "rgba(255,255,255,.8)" : C.muted, fontSize: 11, lineHeight: 1.4 }}>{t("ex_"+et.id+"_desc")}</div>
          </button>
        ))}
      </div>

      {loading && (
        <Box>
          <div style={{ textAlign: "center", padding: "28px 0" }}>
            <div style={{ fontSize: 32, marginBottom: 10 }}></div>
            <div style={{ fontWeight: 700, color: C.text, fontSize: 14, marginBottom: 4 }}>Your coach is preparing a fresh exercise…</div>
            <div style={{ color: C.muted, fontSize: 12 }}>This takes about 3 seconds</div>
          </div>
        </Box>
      )}

      {/* Exercise content */}
      {!loading && ex && !ex.error && (
        <Box accent={C.accent + "30"}>
          {/* NEW WORD */}
          {type === "word" && (
            <div>
              <Tag label="New Word" color={C.accent} />
              <div style={{ margin: "13px 0 6px", display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontWeight: 900, fontSize: 32, color: C.blue }}>{ex.word}</span>
                <PlayBtn text={ex.word || ""} />
              </div>
              {ex.pronunciation_guide && (
                <div style={{ color: C.muted, fontSize: 13, marginBottom: 10 }}>
                  Pronunciation: <strong>{ex.pronunciation_guide}</strong>
                </div>
              )}
              {ex.meaning_en && <Info text={`${ex.meaning_en}${ex.meaning_ref ? " · " + ex.meaning_ref : ""}`} color={C.blue} />}
              {ex.example && (
                <div style={{ background: C.bg, borderRadius: 10, padding: "10px 13px", marginBottom: 10 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                    <span style={{ fontWeight: 700, color: C.blue, fontSize: 15 }}>{ex.example}</span>
                    <PlayBtn text={ex.example} />
                  </div>
                  {ex.example_en && <div style={{ color: C.mid, fontSize: 13 }}>{ex.example_en}</div>}
                </div>
              )}
              {ex.memory_tip && <Info text={"Memory tip: " + ex.memory_tip} color={C.green} />}
              {ex.ref_note && <Info text={ex.ref_note} color={C.muted} />}
              <SaveToFlashcardsBtn card={{ lang: tLang, front: ex.word, back: ex.meaning_en, pronunciation: ex.pronunciation_guide, example: ex.example }} />
              <button onClick={() => generate("word")} style={{ width: "100%", padding: 12, background: C.accent, color: "#fff", border: "none", borderRadius: 9, fontWeight: 700, cursor: "pointer", marginTop: 6 }}>
                Next Word
              </button>
            </div>
          )}

          {/* FILL THE GAP */}
          {type === "fill" && (
            <div>
              <Tag label="Fill the Gap" color={C.blue} />
              <div style={{ margin: "13px 0 5px", fontWeight: 800, fontSize: 18, color: C.text }}>{ex.sentence}</div>
              {ex.full_translation && <div style={{ color: C.muted, fontSize: 13, marginBottom: 12 }}>{ex.full_translation}</div>}
              {ex.hint && !fb && <Info text={"Hint: " + ex.hint} color={C.accent} />}
              {!fb && (
                <>
                  <input
                    value={answer}
                    onChange={e => setAnswer(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && submit()}
                    placeholder="Type the missing word..."
                    style={{ width: "100%", padding: "11px 14px", borderRadius: 9, border: `2px solid ${C.bdr}`, fontSize: 15, marginBottom: 10, boxSizing: "border-box" }}
                  />
                  <button onClick={submit} style={{ width: "100%", padding: 12, background: C.blue, color: "#fff", border: "none", borderRadius: 9, fontWeight: 700, cursor: "pointer" }}>
                    Check Answer
                  </button>
                </>
              )}
            </div>
          )}

          {/* TRANSLATE */}
          {type === "trans" && (
            <div>
              <Tag label="Translate" color={C.green} />
              <div style={{ margin: "13px 0 5px", fontWeight: 800, fontSize: 18, color: C.text }}>{ex.source}</div>
              <div style={{ color: C.muted, fontSize: 12, marginBottom: 10 }}>Translate into {tName}</div>
              {ex.grammar_focus && <Tag label={ex.grammar_focus} color={C.muted} sm />}
              <div style={{ marginBottom: 10 }} />
              {ex.tip && !fb && <Info text={"Tip: " + ex.tip} color={C.accent} />}
              {!fb && (
                <>
                  <textarea
                    value={answer}
                    onChange={e => setAnswer(e.target.value)}
                    placeholder={`Write in ${tName}...`}
                    rows={2}
                    style={{ width: "100%", padding: "11px 14px", borderRadius: 9, border: `2px solid ${C.bdr}`, fontSize: 15, marginBottom: 10, resize: "vertical", boxSizing: "border-box" }}
                  />
                  <button onClick={submit} style={{ width: "100%", padding: 12, background: C.green, color: "#fff", border: "none", borderRadius: 9, fontWeight: 700, cursor: "pointer" }}>
                    Check
                  </button>
                </>
              )}
            </div>
          )}

          {/* OPINION */}
          {type === "opinion" && (
            <div>
              <Tag label="Give Opinion" color={C.muted} />
              {ex.topic && <div style={{ margin: "12px 0 5px", fontWeight: 800, fontSize: 17, color: C.text }}>{ex.topic}</div>}
              {ex.question && <div style={{ color: C.mid, fontSize: 14, marginBottom: 10 }}>{ex.question}</div>}
              {ex.starter && (
                <div style={{ background: C.bg, borderRadius: 9, padding: "9px 12px", marginBottom: 10 }}>
                  <div style={{ color: C.muted, fontSize: 11, marginBottom: 5 }}>Starter phrase:</div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ fontWeight: 700, color: C.blue }}>{ex.starter}</span>
                    <PlayBtn text={ex.starter} />
                  </div>
                </div>
              )}
              {Array.isArray(ex.vocab) && ex.vocab.length > 0 && (
                <div style={{ marginBottom: 10 }}>
                  <div style={{ color: C.muted, fontSize: 11, marginBottom: 6 }}>Useful words:</div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {ex.vocab.map((v, i) => {
                      const word = typeof v === "string" ? v : (v.word || "");
                      const meaning = typeof v === "object" ? (v.meaning || "") : "";
                      return (
                        <div key={i} style={{ background: C.bg, border: `1px solid ${C.bdr}`, borderRadius: 8, padding: "4px 10px", display: "flex", alignItems: "center", gap: 6 }}>
                          <PlayBtn text={word} sm />
                          <span style={{ fontWeight: 700, color: C.blue, fontSize: 13 }}>{word}</span>
                          {meaning && <span style={{ color: C.muted, fontSize: 11 }}>— {meaning}</span>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
              {!fb && (
                <>
                  <textarea
                    value={answer}
                    onChange={e => setAnswer(e.target.value)}
                    placeholder={`Write your opinion in ${tName}...`}
                    rows={4}
                    style={{ width: "100%", padding: "11px 14px", borderRadius: 9, border: `2px solid ${C.bdr}`, fontSize: 15, marginBottom: 10, resize: "vertical", boxSizing: "border-box" }}
                  />
                  <button onClick={submit} style={{ width: "100%", padding: 12, background: C.accent, color: "#fff", border: "none", borderRadius: 9, fontWeight: 700, cursor: "pointer" }}>
                    Get Feedback
                  </button>
                </>
              )}
            </div>
          )}

          {/* FREE WRITING */}
          {type === "write" && (
            <div>
              <Tag label="Free Writing" color={C.muted} />
              <div style={{ margin: "12px 0 10px", color: C.mid, fontSize: 14 }}>{ex.instruction}</div>
              {!fb && (
                <>
                  <textarea
                    value={answer}
                    onChange={e => setAnswer(e.target.value)}
                    placeholder={`Write in ${tName}...`}
                    rows={5}
                    style={{ width: "100%", padding: "11px 14px", borderRadius: 9, border: `2px solid ${C.bdr}`, fontSize: 15, marginBottom: 10, resize: "vertical", boxSizing: "border-box" }}
                  />
                  <button onClick={submit} style={{ width: "100%", padding: 12, background: C.accent, color: "#fff", border: "none", borderRadius: 9, fontWeight: 700, cursor: "pointer" }}>
                    Get Feedback
                  </button>
                </>
              )}
            </div>
          )}

          {/* QUIZ */}
          {type === "quiz" && ex.question && (
            <div>
              <Tag label="Mini Quiz" color={C.red} />
              <div style={{ margin: "13px 0 14px", fontWeight: 800, fontSize: 17, color: C.text }}>{ex.question}</div>
              {["A","B","C","D"].map(letter => {
                const optText = ex[letter];
                if (!optText) return null;
                const isCorrect = letter === ex.correct;
                const isPicked  = picked === letter;
                const done      = picked !== null;
                let bg = C.card, bc = C.bdr, tc = C.text;
                if (done && isCorrect) { bg = C.green + "15"; bc = C.green; tc = C.green; }
                else if (done && isPicked && !isCorrect) { bg = C.red + "15"; bc = C.red; tc = C.red; }
                return (
                  <button
                    key={letter}
                    onClick={() => { if (!picked) setPicked(letter); }}
                    disabled={!!picked}
                    style={{
                      width: "100%", background: bg, border: `2px solid ${bc}`, borderRadius: 10,
                      padding: "11px 14px", marginBottom: 8, textAlign: "left",
                      cursor: picked ? "default" : "pointer",
                      color: tc, fontWeight: (isPicked || isCorrect) && done ? 700 : 400, fontSize: 14,
                    }}>
                    {letter}) {optText}
                  </button>
                );
              })}
              {picked && (
                <>
                  {ex.why && <Info text={ex.why} color={picked === ex.correct ? C.green : C.red} />}
                  {ex.concept && <Info text={"Concept: " + ex.concept} color={C.muted} />}
                  <button onClick={() => generate("quiz")} style={{ width: "100%", padding: 12, background: C.red, color: "#fff", border: "none", borderRadius: 9, fontWeight: 700, cursor: "pointer" }}>
                    Next Question
                  </button>
                </>
              )}
            </div>
          )}

          {/* ROLE PLAY */}
          {type === "convo" && (
            <div>
              <Tag label="Role Play" color={C.muted} />
              {ex.situation && <div style={{ margin: "12px 0 8px", color: C.mid, fontSize: 14 }}>{ex.situation}</div>}
              {ex.opener && (
                <div style={{ background: C.bg, borderRadius: 10, padding: "10px 13px", marginBottom: 12 }}>
                  <div style={{ color: C.muted, fontSize: 11, marginBottom: 5 }}>They say:</div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                    <span style={{ fontWeight: 700, color: C.blue, fontSize: 16 }}>{ex.opener}</span>
                    <PlayBtn text={ex.opener} />
                  </div>
                  {ex.opener_en && <div style={{ color: C.mid, fontSize: 13 }}>{ex.opener_en}</div>}
                </div>
              )}
              {Array.isArray(ex.phrases) && ex.phrases.length > 0 && (
                <div style={{ marginBottom: 10 }}>
                  <div style={{ color: C.muted, fontSize: 11, marginBottom: 6 }}>Useful phrases:</div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {ex.phrases.map((p, i) => typeof p === "string" && (
                      <div key={i} style={{ background: C.bg, border: `1px solid ${C.bdr}`, borderRadius: 8, padding: "4px 10px", display: "flex", alignItems: "center", gap: 6 }}>
                        <PlayBtn text={p} sm />
                        <span style={{ fontWeight: 700, color: C.muted, fontSize: 12 }}>{p}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {ex.guidance && <Info text={ex.guidance} color={C.accent} />}
              {!fb && (
                <>
                  <textarea
                    value={answer}
                    onChange={e => setAnswer(e.target.value)}
                    placeholder={`Respond in ${tName}...`}
                    rows={3}
                    style={{ width: "100%", padding: "11px 14px", borderRadius: 9, border: `2px solid ${C.bdr}`, fontSize: 15, marginBottom: 10, resize: "vertical", boxSizing: "border-box" }}
                  />
                  <button onClick={submit} style={{ width: "100%", padding: 12, background: C.accent, color: "#fff", border: "none", borderRadius: 9, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
                    Send Reply
                  </button>
                </>
              )}
            </div>
          )}
        </Box>
      )}

      {ex && ex.error && <Info text={ex.error} color={C.red} />}

      {/* Feedback */}
      {!loading && fb && !fb.error && (
        <Box accent={C.green + "40"}>
          <div style={{ fontWeight: 800, color: C.green, fontSize: 14, marginBottom: 12 }}>Coach Feedback</div>

          {fb.score && (
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 12 }}>
              <div style={{
                width: 46, height: 46, borderRadius: "50%",
                background: C.surf2,
                border: `2px solid ${scoreColor[fb.score] || C.line}`,
                display: "flex", alignItems: "center", justifyContent: "center",
                fontWeight: 900, fontSize: 20, color: scoreColor[fb.score] || C.text,
              }}>{fb.score}</div>
              {fb.praise && <div style={{ color: C.text, fontSize: 13, flex: 1, lineHeight: 1.45 }}>{fb.praise}</div>}
            </div>
          )}

          {fb.corrected && (
            <div style={{ background: C.bg, border: `1px solid ${C.bdr}`, borderRadius: 10, padding: "10px 13px", marginBottom: 10 }}>
              <div style={{ color: C.muted, fontSize: 11, marginBottom: 5 }}>Improved version:</div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                <span style={{ fontWeight: 700, color: C.blue, fontSize: 14 }}>{fb.corrected}</span>
                <PlayBtn text={fb.corrected} />
              </div>
            </div>
          )}

          {fb.correct !== undefined && (
            <Info text={fb.correct ? "Correct!" : "Not quite — see the explanation below."} color={fb.correct ? C.green : C.red} />
          )}

          {fb.ideal_answer && (
            <div style={{ background: C.bg, borderRadius: 10, padding: "9px 13px", marginBottom: 10 }}>
              <div style={{ color: C.muted, fontSize: 11, marginBottom: 4 }}>Correct answer:</div>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontWeight: 700, color: C.blue, fontSize: 15 }}>{fb.ideal_answer}</span>

              </div>
            </div>
          )}

          {Array.isArray(fb.fixes) && fb.fixes.map((fix, i) => (
            fix.wrong && (
              <div key={i} style={{ background: C.bg, borderRadius: 9, padding: "9px 12px", marginBottom: 7, borderLeft: `3px solid ${C.red}` }}>
                <div style={{ fontSize: 13 }}>
                  <span style={{ color: C.red, textDecoration: "line-through" }}>{fix.wrong}</span>
                  <span style={{ color: C.muted }}> → </span>
                  <span style={{ color: C.green, fontWeight: 700 }}>{fix.right}</span>
                </div>
                {fix.note && <div style={{ color: C.muted, fontSize: 12, marginTop: 3 }}>{fix.note}</div>}
              </div>
            )
          ))}

          {fb.explanation && <Info text={fb.explanation} color={C.blue} />}
          {fb.grammar_note && <Info text={"Grammar: " + fb.grammar_note} color={C.muted} />}
          {fb.ref_connection && <Info text={fb.ref_connection} color={C.muted} />}

          {fb.reply && (
            <div style={{ background: C.bg, borderRadius: 10, padding: "10px 13px", marginBottom: 10 }}>
              <div style={{ color: C.muted, fontSize: 11, marginBottom: 5 }}>They reply:</div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                <span style={{ fontWeight: 700, color: C.blue, fontSize: 15 }}>{fb.reply}</span>
                <PlayBtn text={fb.reply} />
              </div>
              {fb.reply_en && <div style={{ color: C.mid, fontSize: 13 }}>{fb.reply_en}</div>}
            </div>
          )}
          {fb.feedback && <Info text={fb.feedback} color={C.green} />}
          {fb.next_line && <Info text={"What to say next: " + fb.next_line} color={C.muted} />}

          {fb.encouragement && (
            <div style={{ background: C.accent + "10", border: `1px solid ${C.accent}28`, borderRadius: 9, padding: "10px 13px" }}>
              <div style={{ color: C.accent, fontSize: 13, marginBottom: fb.tip ? 6 : 0 }}>{fb.encouragement}</div>
              {fb.tip && <div style={{ color: C.muted, fontSize: 12 }}>Next focus: {fb.tip}</div>}
            </div>
          )}

          <button
            onClick={() => { setFb(null); setAnswer(""); setEx(null); setType(null); }}
            style={{ width: "100%", padding: 12, background: C.accent, color: "#fff", border: "none", borderRadius: 9, fontWeight: 700, cursor: "pointer", marginTop: 10 }}>
            New Exercise
          </button>
        </Box>
      )}

      {fb && fb.error && <Info text={fb.error} color={C.red} />}
    </div>
  );
}

// ─── API CONTENT HOOK ────────────────────────────────────────────────────────
// Fetches cached lesson content for any tab from the backend content store, so
// Drills / Roadmap / Dialogues render from the API instead of hardcoded data.
function useApiContent(tLang, tab) {
  const [content, setContent] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");
  const [tick, setTick] = useState(0);
  useEffect(() => {
    let cancelled = false;
    setLoading(true); setErr(""); setContent(null);
    fetch(`/api/content/${tLang}/${tab}`, { headers: { "Authorization": "Bearer " + getToken() } })
      .then(r => {
        if (!r.ok) throw new Error(r.status === 503 ? "This is still being prepared — check back in a moment." : "Couldn't load this content.");
        return r.json();
      })
      .then(d => { if (!cancelled) setContent(d.content); })
      .catch(e => { if (!cancelled) setErr(e.message); })
      .finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, [tLang, tab, tick]);
  return { content, loading, err, reload: () => setTick(t => t + 1) };
}

// Shared loading / error placeholder for API-backed screens. On failure it shows
// a real, recoverable state with a Try-again button (not a dead-end apology).
function ContentLoader({ loading, err, label, onRetry }) {
  return (
    <div style={{ textAlign:"center", padding:"48px 24px" }}>
      {loading ? (
        <>
          <div style={{ width:26, height:26, margin:"0 auto 14px", border:"3px solid "+C.line, borderTopColor:C.accent, borderRadius:"50%", animation:"spin .7s linear infinite" }}/>
          <div style={{ fontWeight:700, fontSize:15, color:C.text }}>Loading {label}…</div>
        </>
      ) : (
        <>
          <div style={{ width:48, height:48, borderRadius:14, background:C.accentSoft, display:"inline-flex", alignItems:"center", justifyContent:"center", marginBottom:14 }}>
            <Icon name="cloud-off" size={22} color={C.accent}/>
          </div>
          <div style={{ fontWeight:800, fontSize:16, color:C.text, marginBottom:5 }}>{label} isn't ready yet</div>
          <div style={{ color:C.muted, fontSize:13, lineHeight:1.6, maxWidth:300, margin:"0 auto 18px" }}>{err || "This is still being prepared. Please try again in a moment."}</div>
          {onRetry && (
            <button onClick={onRetry} style={{ display:"inline-flex", alignItems:"center", gap:7, padding:"10px 20px", background:C.accent, color:"#fff", border:"none", borderRadius:11, fontWeight:700, fontSize:13.5, cursor:"pointer", fontFamily:"inherit" }}>
              <Icon name="refresh-cw" size={14} color="#fff"/> Try again
            </button>
          )}
        </>
      )}
    </div>
  );
}

// ─── REPORT-AN-ERROR (content accuracy feedback loop) ────────────────────────
function ReportError({ tLang, tabName }) {
  const [state, setState] = useState("idle"); // idle | sending | done
  const submit = async () => {
    if (state !== "idle") return;
    if (!isLoggedIn()) { window.dispatchEvent(new CustomEvent("show-upgrade")); return; }
    setState("sending");
    try {
      const r = await fetch("/api/content/report", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() },
        body: JSON.stringify({ lang: tLang, tab: tabName }),
      });
      setState(r.ok ? "done" : "idle");
    } catch(e) { setState("idle"); }
  };
  return (
    <div style={{display:"flex",justifyContent:"center",marginTop:18,marginBottom:4}}>
      {state === "done" ? (
        <span style={{fontSize:11.5,color:C.green,fontWeight:600}}>✓ Thanks — flagged for review</span>
      ) : (
        <button onClick={submit} disabled={state==="sending"} style={{display:"inline-flex",alignItems:"center",gap:6,background:"none",border:"none",cursor:"pointer",color:C.faint,fontSize:11.5,fontFamily:"inherit",fontWeight:500,padding:"4px 8px"}}>
          <Icon name="flag" size={12} color={C.faint}/> {state==="sending" ? "Sending…" : "Spot an error? Report it"}
        </button>
      )}
    </div>
  );
}

// ─── AI TAB CONTENT (all non-built languages) ────────────────────────────────

      .then(r => {

        return r.json();

// ─── VOCABULARY ───────────────────────────────────────────────────────────────
// Each entry: ["French","English"] — VocabCard handles AI expansion on tap


function VocabCard({ fr, en, tLang, rLangs }) {
  const [open, setOpen] = useState(false);
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const tName    = TARGETS[tLang]?.name || "French";
  const refNames = rLangs.length > 0 ? rLangs.map(l => REFS[l]?.name || l).join(" and ") : "English";
  const displayFr = fr.includes(" — ") ? fr.split(" — ")[1] : fr;

  const expand = async () => {
    if (open) { setOpen(false); return; }
    setOpen(true);
    if (data) return;
    setLoading(true);
    try {
      const prompt = `You are a ${tName} teacher for ${refNames} speakers. Give a rich explanation of: "${displayFr}" (meaning: ${en}). Return ONLY valid JSON: {"pronunciation":"phonetic guide using simple English sounds","register":"formal / informal / neutral — when is this used?","explanation":"clear explanation of meaning and how/when to use it in real life","ref_connection":"how it compares to ${refNames} — same word? cognate? false friend? no equivalent?","examples":[{"fr":"natural ${tName} sentence","en":"English translation","ref":"${refNames} translation"},{"fr":"example 2","en":"English","ref":"ref"},{"fr":"example 3","en":"English","ref":"ref"}],"tip":"one memorable thing about this word","watch_out":"common mistake to avoid with this word"}`;
      if (!isLoggedIn()) { setData({ error: "NO_KEY" }); setLoading(false); return; }
      const result = await askClaude(prompt, 700, tLang);
      setData(result);
    } catch(e) {
      setData({ error: "Could not load. Check your connection and tap to try again." });
    }
    setLoading(false);
  };

  return (
    <div style={{ background: C.card, border: `2px solid ${open ? C.green : C.bdr}`, borderRadius: 11, marginBottom: 8, boxShadow: C.sh, overflow: "hidden" }}>
      <div onClick={expand} style={{ padding: "11px 14px", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, flex: 1, flexWrap: "wrap" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontWeight: 800, color: C.blue, fontSize: 16 }}>{displayFr}</span>
            <PlayBtn text={displayFr} sm />
          </div>
          <span style={{ color: C.mid, fontSize: 13 }}>{en}</span>
        </div>
        <span style={{ color: open ? C.green : C.muted, fontSize: 16, fontWeight: 700, flexShrink: 0 }}>{open ? "−" : "+"}</span>
      </div>

      {open && (
        <div style={{ padding: "0 14px 14px" }}>
          {loading && <div style={{ color: C.muted, fontSize: 13, padding: "8px 0" }}>Loading full explanation...</div>}
          {data && data.error && (
            data.error === "NO_KEY" || data.error === "INVALID_KEY"
              ? <div style={{ background:"#fee2e2", border:"1px solid #fca5a5", borderRadius:8, padding:"10px 12px" }}>
                  <div style={{ fontWeight:700, color:"#dc2626", fontSize:13, marginBottom:4 }}>Session expired</div>
                  <div style={{ color:"#7f1d1d", fontSize:12 }}>Please refresh the page and log in again with your access code.</div>
                </div>
              : <div style={{ color: C.red, fontSize: 13 }}>{data.error}</div>
          )}
          {data && !data.error && (
            <div>
              {(data.pronunciation || data.register) && (
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
                  {data.pronunciation && <div style={{ background: C.surf2, border: `1px solid ${C.line}`, borderRadius: 7, padding: "5px 11px", fontSize: 12, color: C.muted }}><b>Pronunciation:</b> {data.pronunciation}</div>}
                  {data.register && <div style={{ background: C.accent + "12", border: `1px solid ${C.accent}25`, borderRadius: 7, padding: "5px 11px", fontSize: 12, color: C.accent }}><b>Register:</b> {data.register}</div>}
                </div>
              )}
              {data.explanation && (
                <div style={{ background: C.blue + "08", border: `1px solid ${C.blue}20`, borderLeft: `3px solid ${C.blue}`, borderRadius: 7, padding: "9px 12px", marginBottom: 10 }}>
                  <div style={{ fontWeight: 700, color: C.blue, fontSize: 10, textTransform: "uppercase", letterSpacing: 1, marginBottom: 5 }}>How and when to use it</div>
                  <div style={{ color: C.mid, fontSize: 13, lineHeight: 1.55 }}>{data.explanation}</div>
                </div>
              )}
              {data.ref_connection && (
                <div style={{ background: C.surf2, border: `1px solid ${C.line}`, borderLeft: `2px solid ${C.line}`, borderRadius: 7, padding: "9px 12px", marginBottom: 10 }}>
                  <div style={{ fontWeight: 700, color: C.muted, fontSize: 10, textTransform: "uppercase", letterSpacing: 1, marginBottom: 5 }}>Compared to {refNames}</div>
                  <div style={{ color: C.mid, fontSize: 13, lineHeight: 1.55 }}>{data.ref_connection}</div>
                </div>
              )}
              {data.watch_out && (
                <div style={{ background: C.red + "08", border: `1px solid ${C.red}20`, borderLeft: `3px solid ${C.red}`, borderRadius: 7, padding: "9px 12px", marginBottom: 10 }}>

                <div>
                  <div style={{ fontWeight: 700, color: C.muted, fontSize: 10, textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>Real examples — tap to hear</div>

                  <span style={{ fontWeight: 700, color: C.green, fontSize: 11 }}>TIP  </span>
                  <span style={{ color: C.mid, fontSize: 13 }}>{data.tip}</span>

              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── DRILLS ───────────────────────────────────────────────────────────────────

function Drills({ tLang }) {
  const [idx, setIdx]       = useState(0);
  const [show, setShow]     = useState(false);
  const [filter, setFilter] = useState("All");
  const { content, loading, err, reload } = useApiContent(tLang, "drills");

  const types      = ["All","Conjugation","Vocab","Grammar","Numbers","Phrase"];
  const langDrills = content?.drills || [];
  if (loading || err || !langDrills.length) return <ContentLoader loading={loading} err={err} label="Drills" onRetry={reload}/>;
  const f        = filter === "All" ? langDrills : langDrills.filter(d => d.type === filter);
  const filtered = f.length ? f : langDrills;
  const cur      = filtered[idx % filtered.length];
  const typeColor = { Conjugation: C.blue, Vocab: C.muted, Grammar: C.accent, Numbers: C.green, Phrase: C.accent };

  return (
    <div>
      <Info text="Think of your answer before revealing it — the act of trying to recall is where real learning happens. Do 10+ drills per session for best results. Use the filter to focus on your weakest area." color={C.muted} />
      <Tabs items={types} current={types.indexOf(filter)} onChange={i => { setFilter(types[i]); setIdx(0); setShow(false); }} color={C.red} />
      <Box>
        <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}>
          <span style={{ background: C.bg, border: `1px solid ${C.bdr}`, borderRadius: 20, padding: "4px 13px", fontSize: 11, color: C.muted, fontWeight: 700 }}>
            {(idx % filtered.length) + 1} / {filtered.length}
          </span>
          <Tag label={cur.type} color={typeColor[cur.type]} />
        </div>
        <div style={{ fontSize: 18, fontWeight: 800, color: C.text, marginBottom: 18, lineHeight: 1.4 }}>{cur.q}</div>
        {!show ? (
          <>
            <Info text={"Hint: " + cur.hint} color={C.muted} />
            <button onClick={() => setShow(true)} style={{ width: "100%", padding: 14, background: C.blue, color: "#fff", border: "none", borderRadius: 10, fontSize: 15, fontWeight: 800, cursor: "pointer" }}>
              Reveal Answer
            </button>
          </>
        ) : (
          <>
            <div style={{ background: C.green + "15", border: `2px solid ${C.green}`, borderRadius: 11, padding: 16, marginBottom: 14 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 17, fontWeight: 900, color: C.green }}>{cur.a}</span>
                <PlayBtn text={cur.a.includes("—") ? cur.a.split("—")[0].trim() : cur.a} />
              </div>
            </div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
              <button onClick={() => { setShow(false); setIdx(i => (i - 1 + filtered.length) % filtered.length); }}
                style={{ padding: 12, background: C.bg, color: C.muted, border: `2px solid ${C.bdr}`, borderRadius: 10, fontSize: 13, cursor: "pointer", fontWeight: 700 }}>
                Previous
              </button>
              <button onClick={() => { setShow(false); setIdx(i => (i + 1) % filtered.length); }}
                style={{ padding: 12, background: C.blue, color: "#fff", border: "none", borderRadius: 10, fontSize: 13, fontWeight: 800, cursor: "pointer" }}>
                Next
              </button>
            </div>
          </>
        )}
      </Box>
      <div style={{ display: "flex", gap: 5, flexWrap: "wrap" }}>
        {filtered.map((_, i) => (
          <button key={i} onClick={() => { setIdx(i); setShow(false); }} style={{
            width: 29, height: 29, borderRadius: 8, border: `2px solid ${i === idx % filtered.length ? C.blue : C.bdr}`,
            cursor: "pointer", fontSize: 10, fontWeight: 800,
            background: i === idx % filtered.length ? C.blue : C.card,
            color: i === idx % filtered.length ? "#fff" : C.muted,
          }}>{i + 1}</button>
        ))}
      </div>
    </div>
  );
}

// ─── DIALOGUES ────────────────────────────────────────────────────────────────

function Dialogues({ tLang }) {
  const [idx, setIdx] = useState(0);
  const { content, loading, err, reload } = useApiContent(tLang, "dialogues");

  // Adapt the API dialogue shape ({speaker,target,ref}) to this view's ({s,tl,en}).
  const dlData = (content?.dialogues || []).map(dg => ({
    title: dg.title, level: dg.level,
    lines: (dg.lines || []).map(l => ({ s: l.speaker, tl: l.target, en: l.ref })),
  }));
  if (loading || err || !dlData.length) return <ContentLoader loading={loading} err={err} label="Dialogues" onRetry={reload}/>;
  const safeIdx = Math.min(idx, dlData.length - 1);
  const d = dlData[safeIdx];
  return (
    <div>
      <Info text="Method: (1) Read the dialogue with both columns open. (2) Cover English and read again. (3) Try to speak from memory. (4) Use to play phrases and shadow the pronunciation. Repeat daily until it feels automatic." color={C.muted} />
      <div style={{ display: "flex", gap: 7, flexWrap: "wrap", marginBottom: 14 }}>
        {dlData.map((d2, i) => (
          <button key={i} onClick={() => setIdx(i)} style={{
            padding: "6px 13px", borderRadius: 20,
            border: `2px solid ${safeIdx === i ? C.accent : C.bdr}`,
            cursor: "pointer", fontSize: 11, fontWeight: 700,
            background: safeIdx === i ? C.accent : C.card, color: safeIdx === i ? "#fff" : C.muted,
          }}>{d2.title}</button>
        ))}
      </div>
      <Box accent={C.accent + "30"}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontWeight: 800, color: C.accent, fontSize: 16 }}>{d.title}</div>
          <Tag label={d.level} color={d.level === "Beginner" ? C.green : C.muted} />
        </div>
        {d.lines.map((l, i) => {
          const isA = l.s === "A" || l.s === "You" || l.s === "Vous" || l.s === "あなた" || l.s === "당신" || l.s === "Вы" || l.s === "أنت" || l.s === "Tu" || l.s === "Du" || l.s === "你" || l.s === "आप";
          return (
            <div key={i} style={{ marginBottom: 13, display: "flex", gap: 11 }}>
              <div style={{
                minWidth: 60, flexShrink: 0,
                background: isA ? C.accentSoft : C.surf2,
                borderRadius: 8, padding: "4px 7px", fontSize: 10,
                color: isA ? C.accent : C.text,
                textAlign: "center", height: "fit-content", fontWeight: 700,
              }}>{l.s}</div>
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                  <span style={{ fontWeight: 700, fontSize: 15, color: C.text }}>{l.tl}</span>
                  <PlayBtn text={l.tl} />
                </div>
                <div style={{ fontSize: 13, color: C.mid }}>{l.en}</div>
              </div>
            </div>
          );
        })}
        <button
          onClick={() => say(d.lines.map(l => l.tl).join(". "))}
          style={{ width: "100%", padding: 10, background: C.accent + "15", border: `2px solid ${C.accent}`, borderRadius: 9, color: C.accent, fontWeight: 800, fontSize: 13, cursor: "pointer" }}>
          Play Full Dialogue
        </button>
      </Box>
    </div>
  );
}

// ─── ROADMAP ─────────────────────────────────────────────────────────────────
// ── Language-specific roadmaps ─────────────────────────────────────────────────

function Roadmap({ tLang }) {
  const [done, setDone] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem("roadmap_" + tLang) || "[]")); } catch(e) { return new Set(); }
  });
  const tName = TARGETS[tLang]?.name || "French";
  const { content, loading, err, reload } = useApiContent(tLang, "roadmap");
  const PHASE_COLORS = [C.blue, C.green, C.accent, C.muted, C.red];
  const phaseData = (content?.phases || []).map((p, i) => ({ ...p, color: PHASE_COLORS[i % PHASE_COLORS.length] }));
  if (loading || err || !phaseData.length) return <ContentLoader loading={loading} err={err} label="Roadmap" onRetry={reload}/>;

  const toggle = (id) => {
    setDone(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      try { localStorage.setItem("roadmap_" + tLang, JSON.stringify([...next])); } catch(e) {}
      return next;
    });
  };

  return (
    <div>
      <Info text="Tick off each milestone as you achieve it — your progress is saved in this browser. The timeline estimates assume 15-30 minutes of daily practice. Consistency matters far more than duration." color={C.muted} />
      <Info text={`${done.size} milestone${done.size !== 1 ? "s" : ""} completed — keep going!`} color={C.muted} />
      {phaseData.map((p, pi) => (
        <div key={pi} style={{ marginBottom: 20 }}>
          <div style={{ background: C.surf, border: `1px solid ${C.line}`, borderRadius: 14, padding: "12px 15px", marginBottom: 9 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontSize: 9, color: C.faint, letterSpacing: ".16em", textTransform: "uppercase", fontWeight: 700, marginBottom: 4 }}>Phase {p.phase}</div>
                <div style={{ fontWeight: 700, color: C.text, fontSize: 17, letterSpacing: "-.01em" }}>{p.title}</div>
                <div style={{ color: C.muted, fontSize: 12, fontWeight: 500, marginTop: 2 }}>{p.dur}</div>
              </div>
              <Tag label={p.dur} />
            </div>
            <div style={{ color: C.muted, fontSize: 12.5, marginTop: 9, paddingTop: 9, borderTop: `1px solid ${C.line}`, lineHeight: 1.5 }}>
              Goal: {p.goal}
            </div>
          </div>
          {p.can.map((m, mi) => {
            const id = `${pi}-${mi}`;
            const isDone = done.has(id);
            return (
              <div key={mi} onClick={() => toggle(id)} style={{
                background: isDone ? C.green + "12" : C.surf,
                border: `1px solid ${isDone ? C.green + "45" : C.line}`,
                borderRadius: 10, padding: "9px 13px", marginBottom: 6,
                display: "flex", gap: 11, alignItems: "center", cursor: "pointer",
              }}>
                <div style={{ width: 22, height: 22, borderRadius: "50%", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: 10, background: isDone ? C.green : C.surf2, border: `1.5px solid ${isDone ? C.green : C.line}`, color: isDone ? "#fff" : C.faint }}>
                  {isDone ? "✓" : ""}
                </div>
                <span style={{ color: isDone ? C.text : C.muted, fontSize: 13, fontWeight: isDone ? 600 : 400, lineHeight: 1.45 }}>{m}</span>
              </div>
            );
          })}
          <div style={{ background: C.bg, border: `1px solid ${C.bdr}`, borderRadius: 9, padding: "7px 13px" }}>
            <span style={{ color: C.muted, fontSize: 11, fontWeight: 600 }}>Daily: </span>
            <span style={{ color: C.mid, fontSize: 11 }}>{p.daily}</span>
          </div>
        </div>
      ))}
    </div>
  );
}
