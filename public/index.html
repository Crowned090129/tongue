// ─── VOICE PANEL ─────────────────────────────────────────────────────────────
function VoicePanel({ tLang, onClose }) {
  const [deviceVoices, setDeviceVoices] = useState([]);
  const [selected, setSelected]         = useState(activeVoice);
  const [showAll, setShowAll]           = useState(false);
  const tts   = TARGETS[tLang]?.tts || "fr-FR";
  const pfx   = tts.split("-")[0];
  const tName = TARGETS[tLang]?.name || "French";

  useEffect(() => {
    const load = () => {
      const s = synth();
      if (!s) return;
      try {
        const v = s.getVoices();
        if (v && v.length > 0) setDeviceVoices(v);
      } catch (e) {}
    };
    load();
    // voiceschanged fires on Chrome/Android; Safari populates on first call
    const s = synth();
    if (s && s.addEventListener) {
      s.addEventListener("voiceschanged", load);
      return () => { try { s.removeEventListener("voiceschanged", load); } catch(e){} };
    }
    // Safari fallback: poll until voices appear
    const interval = setInterval(() => { load(); if (deviceVoices.length > 0) clearInterval(interval); }, 200);
    setTimeout(() => clearInterval(interval), 3000);
    return () => clearInterval(interval);
  }, []);

  const langVoices  = deviceVoices.filter(v => v.lang.startsWith(pfx));
  const otherVoices = deviceVoices.filter(v => !v.lang.startsWith(pfx));
  const hasGoodVoice = langVoices.length > 0;

  const selectVoice = (name) => { setSelected(name); activeVoice = name; };

  const TEST_PHRASES = {
    fr:"Bonjour, comment allez-vous aujourd'hui?", es:"Hola, ¿cómo estás hoy?", pt:"Olá, como vai você hoje?",
    it:"Ciao, come stai oggi?", de:"Hallo, wie geht es Ihnen heute?", en:"Hello, how are you today?",
    zh:"你好，你今天怎么样？", ja:"こんにちは、今日はお元気ですか？", ko:"안녕하세요, 오늘 어떻게 지내세요?",
    ru:"Привет, как дела сегодня?", ar:"مرحباً، كيف حالك اليوم؟",
  };
  const testVoice = (name) => {
    const prev = activeVoice;
    activeVoice = name;
    say(TEST_PHRASES[pfx] || TEST_PHRASES[tLang] || "Hello, how are you today?");
    setTimeout(() => { activeVoice = prev; }, 600);
  };

  function VRow({ v }) {
    const isSelected = selected === v.name;
    return (
      <div style={{ background: isSelected ? C.blue+"12" : C.bg, border: `2px solid ${isSelected ? C.blue : C.bdr}`, borderRadius: 10, padding: "10px 13px", marginBottom: 7 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div>
            <div style={{ fontWeight:700, color:isSelected?C.blue:C.text, fontSize:13 }}>{v.name}</div>
            <div style={{ color:C.muted, fontSize:11, marginTop:2 }}>{v.lang}{v.localService?" · On-device":""}{isSelected?" · Currently active":""}</div>
          </div>
          <div style={{ display:"flex", gap:7 }}>
            <button onPointerDown={e=>{e.preventDefault();testVoice(v.name);}} style={{ background:C.muted, border:"none", borderRadius:6, color:"#fff", padding:"4px 10px", fontSize:11, fontWeight:700, cursor:"pointer" }}>Test</button>
            <button onClick={()=>selectVoice(v.name)} style={{ background:isSelected?C.blue:C.card, border:`2px solid ${isSelected?C.blue:C.bdr}`, borderRadius:6, color:isSelected?"#fff":C.mid, padding:"4px 10px", fontSize:11, fontWeight:700, cursor:"pointer" }}>
              {isSelected?"Selected":"Select"}
            </button>
          </div>
        </div>
      </div>
    );
  }

  const [mounted2, setMounted2] = useState(false);
  useEffect(() => { requestAnimationFrame(() => setMounted2(true)); }, []);

  return (
    <div className={`sheet-backdrop${mounted2 ? " open" : ""}`} onClick={onClose} style={{zIndex:100}}>
      <div className="sheet" onClick={e=>e.stopPropagation()} style={{ background:C.card, padding:22, maxWidth:520 }}>
        <div className="sheet-handle"/>
        <div style={{ fontWeight:900, fontSize:17, color:C.text, marginBottom:5, marginTop:14 }}>Voice Settings</div>

        {hasGoodVoice && (
          <div style={{ background:C.green+"12", border:`1px solid ${C.green}30`, borderRadius:10, padding:"10px 13px", marginBottom:14 }}>
            <div style={{ fontWeight:700, color:C.green, fontSize:13 }}>{langVoices.length} {tName} voice{langVoices.length>1?"s":""} found</div>
            <div style={{ color:C.muted, fontSize:12, marginTop:2 }}>Select the one that sounds most natural. Use Test to preview.</div>
          </div>
        )}

        {!hasGoodVoice && (
          <div style={{ background:C.surf2, border:`1px solid ${C.line}`, borderRadius:10, padding:"10px 13px", marginBottom:14 }}>
            <div style={{ fontWeight:700, color:C.muted, fontSize:13 }}>{t("voice_no_match", {lang: tName})}</div>
          </div>
        )}

        <div style={{ fontWeight:700, color:C.mid, fontSize:11, textTransform:"uppercase", letterSpacing:1, marginBottom:9 }}>{t("voice_all_label")}</div>
        {(() => {
          const voiceList = hasGoodVoice ? langVoices : deviceVoices;
          const shown = showAll ? voiceList : voiceList.slice(0, 8);
          return (
            <>
              {shown.map((v,i) => <VRow key={i} v={v} />)}
              {voiceList.length === 0 && (
                <div style={{ color:C.muted, fontSize:13, textAlign:"center", padding:"12px 0" }}>No voices found on this device.</div>
              )}
              {!showAll && voiceList.length > 8 && (
                <button onClick={()=>setShowAll(true)} style={{ background:C.bg, border:`1px solid ${C.bdr}`, borderRadius:8, padding:"7px 14px", fontSize:12, color:C.muted, cursor:"pointer", fontWeight:600, marginBottom:10 }}>
                  Show all {voiceList.length} voices
                </button>
              )}
            </>
          );
        })()}

        <button onClick={onClose} style={{ width:"100%", padding:13, background:C.blue, color:"#fff", border:"none", borderRadius:10, fontWeight:700, cursor:"pointer", marginTop:8 }}>Done</button>
      </div>
    </div>
  );
}


// ─── WORD SPACE ───────────────────────────────────────────────────────────────
function WordSpace({ tLang, rLangs }) {
  const tName    = TARGETS[tLang]?.name || "French";
  const tCode    = TARGETS[tLang]?.tts  || "fr-FR";
  const refNames = rLangs.length > 0 ? rLangs.map(l => REFS[l]?.name || l).join(" and ") : "English";

  const [input,    setInput]    = useState("");
  const [result,   setResult]   = useState(null);
  const [loading,  setLoading]  = useState(false);
  const [saved,    setSaved]    = useState(() => {
    try { return JSON.parse(localStorage.getItem("ws_saved") || "[]"); } catch(e) { return []; }
  });

  // Debounced auto-translate
  useEffect(() => {
    if (!input.trim() || input.trim().length < 2) { setResult(null); return; }
    const timer = setTimeout(() => translate(input.trim()), 700);
    return () => clearTimeout(timer);
  }, [input]);

  const translate = async (text) => {
    setLoading(true);
    try {
      const prompt = `You are a ${tName} language coach for ${refNames} speakers. The user typed: "${text}". This could be in any language. Detect the language, translate to ${tName} if not already in ${tName} (and also to ${refNames} if it was in ${tName}), and provide rich learning content. Return ONLY valid JSON: {"input_lang":"language detected","input_text":"${text}","translation_fr":"translation in ${tName}","translation_ref":"translation in ${refNames}","pronunciation":"phonetic guide for the ${tName} version","literal_breakdown":[{"word":"each ${tName} word","meaning":"what it means"}],"explanation":"grammar and usage explanation — why is it structured this way in ${tName}?","ref_comparison":"how does this compare to ${refNames}? same structure? different?","examples":[{"fr":"example 1 in ${tName}","en":"English","ref":"in ${refNames}"},{"fr":"example 2","en":"English","ref":"ref"},{"fr":"example 3","en":"English","ref":"ref"},{"fr":"example 4","en":"English","ref":"ref"}],"tip":"one key thing to remember about this word or phrase"}`;
      if (!isLoggedIn()) { setResult({ error: "NO_KEY" }); setLoading(false); return; }
      const result = await askClaude(prompt, 900, tLang);
      setResult(result);
    } catch(e) {
      setResult({ error: "Could not translate. Check your connection." });
    }
    setLoading(false);
  };

  const saveEntry = () => {
    if (!result || !result.translation_fr) return;
    const entry = {
      id: Date.now(),
      input: input.trim(),
      fr: result.translation_fr,
      ref: result.translation_ref || "",
      pronunciation: result.pronunciation || "",
      date: new Date().toLocaleDateString(),
    };
    const updated = [entry, ...saved].slice(0, 100);
    setSaved(updated);
    try { localStorage.setItem("ws_saved", JSON.stringify(updated)); } catch(e) {}
  };

  const deleteEntry = (id) => {
    const updated = saved.filter(s => s.id !== id);
    setSaved(updated);
    try { localStorage.setItem("ws_saved", JSON.stringify(updated)); } catch(e) {}
  };

  return (
    <div style={{ padding: "14px 18px 24px" }}>
      <Info text="Start typing — results appear automatically. Use this to look up words you meet in the wild: song lyrics, menus, street signs, messages. Save useful translations to your personal log below." color={C.muted} />

      {/* Big input */}
      <div style={{ background: C.card, border: `2px solid ${C.accent}`, borderRadius: 14, overflow: "hidden", marginBottom: 12, boxShadow: C.sh }}>
        <textarea
          value={input}
          onChange={e => setInput(e.target.value)}
          placeholder={`Type anything — in ${tName} or ${refNames}…`}
          rows={4}
          style={{ width: "100%", padding: "16px", border: "none", outline: "none", fontSize: 18, fontWeight: 500, resize: "none", background: "transparent", boxSizing: "border-box", color: C.text }}
        />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", borderTop: `1px solid ${C.bdr}`, background: C.soft }}>
          <div style={{ color: C.muted, fontSize: 11 }}>{loading ? t("translating") : input.trim().length > 1 ? t("auto_translating") : t("start_typing")}</div>
          <div style={{ display: "flex", gap: 8 }}>
            {input.trim() && <button onClick={() => { setInput(""); setResult(null); }} style={{ background: "none", border: `1px solid ${C.bdr}`, borderRadius: 7, padding: "4px 11px", color: C.muted, fontSize: 12, cursor: "pointer" }}>{t("clear")}</button>}
            {result && result.translation_fr && <button onClick={() => say(result.translation_fr)} style={{ background: C.blue, border: "none", borderRadius: 7, padding: "4px 11px", color: "#fff", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>{t("hear_it")}</button>}
          </div>
        </div>
      </div>

      {/* Translation result */}
      {loading && (
        <div style={{ background: C.card, borderRadius: 12, padding: "20px 16px", textAlign: "center", color: C.muted, boxShadow: C.sh, marginBottom: 12 }}>
          <div style={{ fontSize: 13 }}>{t("translating_content")}</div>
        </div>
      )}

      {!loading && result && !result.error && (
        <div>
          {/* Main translation */}
          <div style={{ background: C.card, border: `2px solid ${C.accent}30`, borderRadius: 14, padding: "16px", marginBottom: 10, boxShadow: C.sh }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
              <div style={{ flex: 1 }}>
                {result.input_lang && <div style={{ color: C.muted, fontSize: 11, marginBottom: 8 }}>Detected: {result.input_lang}</div>}
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 6 }}>
                  <span style={{ fontWeight: 900, color: C.blue, fontSize: 26 }}>{result.translation_fr}</span>
                  <button onPointerDown={e => { e.preventDefault(); say(result.translation_fr); }} style={{ background: C.blue, border: "none", borderRadius: 7, padding: "4px 12px", color: "#fff", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>{t("listen")}</button>
                </div>
                {result.pronunciation && <div style={{ color: C.muted, fontSize: 14, fontStyle: "italic", marginBottom: 6 }}>{result.pronunciation}</div>}
                {result.translation_ref && <div style={{ color: C.muted, fontSize: 14 }}>{refNames}: {result.translation_ref}</div>}
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:6, flexShrink:0 }}>
                <button onClick={saveEntry} style={{ background: C.accent + "15", border: `1px solid ${C.accent}30`, borderRadius: 9, padding: "7px 13px", color: C.accent, fontWeight: 700, fontSize: 12, cursor: "pointer" }}>
                  {t("save_btn")}
                </button>
                <SaveToFlashcardsBtn card={{ lang: tLang, front: result.translation_fr, back: result.translation_ref || input.trim(), pronunciation: result.pronunciation, example: result.examples?.[0]?.fr || "" }} />
              </div>
            </div>

            {/* Word breakdown */}
            {Array.isArray(result.literal_breakdown) && result.literal_breakdown.length > 0 && (
              <div style={{ marginBottom: 12 }}>
                <div style={{ fontWeight: 700, color: C.muted, fontSize: 10, textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>{t("word_by_word")}</div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  {result.literal_breakdown.map((item, i) => (
                    <div key={i} style={{ background: C.bg, border: `1px solid ${C.bdr}`, borderRadius: 9, padding: "7px 11px", textAlign: "center" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 5, marginBottom: 3 }}>
                        <span style={{ fontWeight: 800, color: C.blue, fontSize: 14 }}>{item.word}</span>
                        <PlayBtn text={item.word || ""} sm />
                      </div>
                      <div style={{ color: C.muted, fontSize: 11 }}>{item.meaning}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* Grammar explanation */}
          {result.explanation && (
            <div style={{ background: C.blue + "08", border: `1px solid ${C.blue}20`, borderLeft: `3px solid ${C.blue}`, borderRadius: 9, padding: "12px 14px", marginBottom: 10 }}>
              <div style={{ fontWeight: 700, color: C.blue, fontSize: 10, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>{t("grammar_usage")}</div>
              <div style={{ color: C.mid, fontSize: 13, lineHeight: 1.6 }}>{result.explanation}</div>
            </div>
          )}

          {/* Reference language comparison */}
          {result.ref_comparison && (
            <div style={{ background: C.surf2, border: `1px solid ${C.line}`, borderLeft: `2px solid ${C.line}`, borderRadius: 9, padding: "12px 14px", marginBottom: 10 }}>
              <div style={{ fontWeight: 700, color: C.muted, fontSize: 10, textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>{t("compared_to")} {refNames}</div>
              <div style={{ color: C.mid, fontSize: 13, lineHeight: 1.6 }}>{result.ref_comparison}</div>
            </div>
          )}

          {/* Memory tip */}
          {result.tip && (
            <div style={{ background: C.green + "08", border: `1px solid ${C.green}20`, borderLeft: `3px solid ${C.green}`, borderRadius: 9, padding: "10px 14px", marginBottom: 10 }}>
              <span style={{ fontWeight: 700, color: C.green, fontSize: 11 }}>TIP  </span>
              <span style={{ color: C.mid, fontSize: 13 }}>{result.tip}</span>
            </div>
          )}

          {/* Examples */}
          {Array.isArray(result.examples) && result.examples.length > 0 && (
            <div>
              <div style={{ fontWeight: 700, color: C.muted, fontSize: 10, textTransform: "uppercase", letterSpacing: 1, marginBottom: 9 }}>{t("more_examples")}</div>
              {result.examples.map((ex, i) => ex && ex.fr && (
                <div key={i} style={{ background: C.bg, border: `1px solid ${C.bdr}`, borderRadius: 10, padding: "10px 13px", marginBottom: 8 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 9, marginBottom: 4, flexWrap: "wrap" }}>
                    <span style={{ fontWeight: 800, color: C.blue, fontSize: 15 }}>{ex.fr}</span>
                    <PlayBtn text={ex.fr} />
                  </div>
                  {ex.en && <div style={{ color: C.mid, fontSize: 12, marginBottom: ex.ref ? 3 : 0 }}>{ex.en}</div>}
                  {ex.ref && <div style={{ color: C.muted, fontSize: 12 }}>{ex.ref}</div>}
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {result && result.error && (
        result.error === "NO_KEY" || result.error === "INVALID_KEY"
          ? <div style={{ background:"#fee2e2", border:"1px solid #fca5a5", borderRadius:10, padding:"13px 14px" }}>
              <div style={{ fontWeight:700, color:"#dc2626", fontSize:14, marginBottom:5 }}>{t("session_expired")}</div>
              <div style={{ color:"#7f1d1d", fontSize:13, lineHeight:1.5 }}>
                {t("please_refresh")}
              </div>
            </div>
          : <Info text={result.error} color={C.red} />
      )}

      {/* Saved words */}
      {saved.length > 0 && (
        <div style={{ marginTop: 24 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <div style={{ fontWeight: 800, color: C.mid, fontSize: 14 }}>{t("saved_words")} ({saved.length})</div>
            <div style={{ color: C.muted, fontSize: 11 }}>{t("stays_between")}</div>
          </div>
          {saved.map(entry => (
            <div key={entry.id} style={{ background: C.card, border: `1px solid ${C.bdr}`, borderRadius: 11, padding: "11px 14px", marginBottom: 8, display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, boxShadow: C.sh }}>
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                  <span style={{ fontWeight: 800, color: C.blue, fontSize: 16 }}>{entry.fr}</span>
                  <PlayBtn text={entry.fr} sm />
                </div>
                {entry.pronunciation && <div style={{ color: C.muted, fontSize: 11, marginBottom: 2 }}>{entry.pronunciation}</div>}
                <div style={{ color: C.muted, fontSize: 12 }}>{entry.input}{entry.ref ? " · " + entry.ref : ""}</div>
                <div style={{ color: C.bdr, fontSize: 10, marginTop: 2 }}>{entry.date}</div>
              </div>
              <button onClick={() => { setInput(entry.input || entry.fr); }} style={{ background: C.bg, border: `1px solid ${C.bdr}`, borderRadius: 7, padding: "5px 10px", color: C.muted, fontSize: 11, cursor: "pointer", marginRight: 4 }}>{t("reload")}</button>
              <button onClick={() => deleteEntry(entry.id)} style={{ background: "none", border: "none", color: C.muted, cursor: "pointer", fontSize: 18, padding: "0 4px", lineHeight: 1 }}>×</button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}


// ─── FLASHCARDS ──────────────────────────────────────────────────────────────

  const [importMsg, setImportMsg] = useState("");

  const [practiceAll, setPracticeAll]       = useState(false);
  const [sessionReviewed, setSessionReviewed] = useState(new Set());
  const now      = Date.now();
  const dueCards = practiceAll
    ? cards.filter(c => !sessionReviewed.has(c.id))
    : cards.filter(c => c.next_review <= now);
  const current  = dueCards[0] || null;

  const refreshCards = () => setCards(fcLoad().filter(c => c.lang === tLang));

  const rate = (quality) => {
    if (!current) return;
    const updated = sm2(current, quality);
    const all = fcLoad();
    const idx = all.findIndex(c => c.id === current.id);
    if (idx >= 0) { all[idx] = updated; fcSave(all); }
    if (practiceAll) setSessionReviewed(prev => new Set([...prev, current.id]));
    setFlipped(false);
    refreshCards();
    _streak.log();
    if (onStreakUpdate) onStreakUpdate();
  };

  const deleteCard = (id) => {
    const all = fcLoad().filter(c => c.id !== id);
    fcSave(all);
    refreshCards();
  };

  const addCard = () => {
    setAddErr(""); setAddOk(false);
    if (!addForm.front.trim() || !addForm.back.trim()) { setAddErr(t("word_required")); return; }
    const ok = fcAdd({ lang: tLang, front: addForm.front.trim(), back: addForm.back.trim(), pronunciation: addForm.pronunciation.trim(), example: addForm.example.trim() });
    if (!ok) { setAddErr(t("already_in_fc")); return; }
    refreshCards();
    setAddForm({ front:"", back:"", pronunciation:"", example:"" });
    setAddOk(true);
    setTimeout(() => setAddOk(false), 2000);
  };

  const importFromWordSpace = () => {
    try {
      const ws = JSON.parse(localStorage.getItem("ws_saved") || "[]");
      let added = 0;
      ws.forEach(entry => {
        if (fcAdd({ lang: tLang, front: entry.fr, back: entry.ref || entry.input || "", pronunciation: entry.pronunciation || "", example: "" })) added++;
      });
      refreshCards();
      setImportMsg(added ? `Imported ${added} new ${added === 1 ? "word" : "words"} from Word Space.` : "No new words to import — your saved words are already here.");
      setTimeout(() => setImportMsg(""), 2800);
    } catch(e) { setImportMsg("Couldn't import from Word Space."); setTimeout(() => setImportMsg(""), 2800); }
  };

  const totalCards   = cards.length;
  const learnedCards = cards.filter(c => c.repetitions > 0).length;
  const RATE_BTNS = [
    { q:0, label:t("rate_again"), color:C.red,    desc:t("rate_again_desc") },
    { q:1, label:t("rate_hard"),  color:C.text,  desc:t("rate_hard_desc") },
    { q:2, label:t("rate_good"),  color:C.accent, desc:t("rate_good_desc") },
    { q:3, label:t("rate_easy"),  color:C.green,  desc:t("rate_easy_desc") },
  ];

  return (
    <div>
      <div style={{fontSize:12.5,color:C.muted,fontWeight:600,marginBottom:14}}>{dueCards.length} card{dueCards.length !== 1 ? "s" : ""} due now · spaced repetition (SM-2)</div>
      {cards.length === 0
        ? <Info text="Your flashcard deck is empty. Save words while using the Coach (New Word exercise → Save to Flashcards) or the Vocabulary tab. Then come back here each day to review." color={C.muted} />
        : dueCards.length === 0
          ? <Info text="All caught up! No cards due right now. Come back later or add new words from the Coach." color={C.green} />
          : <Info text="Rate each card honestly — 'Again' brings it back immediately; 'Easy' schedules it days away. The algorithm does the rest. Daily review beats long sessions." color={C.muted} />
      }

      {/* Stats row */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginBottom:14 }}>
        {[
          [t("fc_stat_total"), totalCards, C.blue],
          [t("fc_stat_due"), dueCards.length, dueCards.length > 0 ? C.muted : C.green],
          [t("fc_stat_learned"), learnedCards, C.accent],
        ].map(([label, val, col]) => (
          <div key={label} style={{ background:C.card, borderRadius:10, padding:"10px 12px", textAlign:"center", border:`1px solid ${C.bdr}`, boxShadow:C.sh }}>
            <div style={{ fontWeight:900, fontSize:22, color:col }}>{val}</div>
            <div style={{ color:C.muted, fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:1, marginTop:2 }}>{label}</div>
          </div>
        ))}
      </div>

      {/* View tabs */}
      <div style={{ display:"flex", gap:7, marginBottom:14 }}>
        {[["review",t("fc_tab_review"),""],["browse",t("fc_tab_browse"),""],["add",t("fc_tab_add"),"＋"]].map(([v,label,icon]) => (
          <button key={v} onClick={() => setView(v)} style={{
            padding:"6px 14px", borderRadius:20, border:`1px solid ${view===v?C.accent:C.bdr}`,
            background:view===v?C.muted:C.card, color:view===v?"#fff":C.muted,
            fontSize:11, fontWeight:700, cursor:"pointer",
          }}>{icon} {label}</button>
        ))}
        <button onClick={importFromWordSpace} style={{ padding:"6px 14px", borderRadius:20, border:`1px solid ${C.bdr}`, background:C.card, color:C.muted, fontSize:11, cursor:"pointer", marginLeft:"auto" }}>
          Import Word Space
        </button>
      </div>
      {importMsg && <div style={{ background:C.green+"14", border:`1px solid ${C.green}33`, color:C.green, fontSize:12.5, fontWeight:600, borderRadius:10, padding:"9px 13px", marginBottom:12, display:"flex", alignItems:"center", gap:7 }}><Icon name="check-circle" size={14} color={C.green}/>{importMsg}</div>}

      {/* ── REVIEW VIEW ── */}
      {view === "review" && (
        <div>
          {dueCards.length === 0 ? (
            <div style={{ background:C.card, borderRadius:16, padding:"36px 20px", textAlign:"center", boxShadow:C.sh, border:`1px solid ${C.bdr}` }}>
              <div style={{ marginBottom:12, display:"flex", justifyContent:"center" }}><Icon name="trophy" size={40} color={C.green}/></div>
              <div style={{ fontWeight:900, fontSize:18, color:C.green, marginBottom:8 }}>
                {practiceAll ? t("session_done") : t("all_caught_up")}
              </div>
              <div style={{ color:C.muted, fontSize:13, marginBottom:16 }}>
                {totalCards === 0
                  ? "You have no flashcards yet. Add some using the Coach, Word Space, or the Add Card tab."
                  : practiceAll
                    ? `You went through all ${totalCards} cards. SM-2 scheduling updated.`
                    : `All ${totalCards} cards reviewed for today.`}
              </div>
              {totalCards === 0 ? (
                <button onClick={() => setView("add")} style={{ padding:"11px 24px", background:C.surf2, color:C.text, border:`1px solid ${C.line}`, borderRadius:10, fontWeight:700, cursor:"pointer" }}>
                  {t("add_first_card")}
                </button>
              ) : (
                <div style={{ display:"flex", gap:10, justifyContent:"center", flexWrap:"wrap" }}>
                  <button onClick={() => { setSessionReviewed(new Set()); setFlipped(false); }} style={{ padding:"11px 24px", background:C.blue, color:"#fff", border:"none", borderRadius:10, fontWeight:700, cursor:"pointer" }}>
                    {t("practice_again")}
                  </button>
                  {practiceAll && (
                    <button onClick={() => { setPracticeAll(false); setSessionReviewed(new Set()); setFlipped(false); }} style={{ padding:"11px 24px", background:C.card, color:C.mid, border:`1px solid ${C.bdr}`, borderRadius:10, fontWeight:700, cursor:"pointer" }}>
                      {t("back_schedule")}
                    </button>
                  )}
                </div>
              )}
            </div>
          ) : (
            <div>
              <div style={{ textAlign:"center", color:C.muted, fontSize:12, marginBottom:10 }}>{dueCards.length} {t("remaining_session")}</div>
              {/* Card */}
              <div onClick={() => setFlipped(f => !f)} style={{
                background:C.card, border:`2px solid ${C.muted}`, borderRadius:18,
                padding:"32px 20px", textAlign:"center", marginBottom:14, cursor:"pointer",
                boxShadow:`0 4px 16px ${C.line}`, minHeight:180,
                display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
              }}>
                {!flipped ? (
                  <>
                    <div style={{ fontWeight:900, color:C.blue, fontSize:30, marginBottom:8 }}>{current.front}</div>
                    {current.pronunciation && <div style={{ color:C.muted, fontSize:14, fontStyle:"italic", marginBottom:6 }}>{current.pronunciation}</div>}
                    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14 }}>
                      <PlayBtn text={current.front} />
                    </div>
                    <div style={{ color:C.muted, fontSize:12 }}>{t("tap_reveal")}</div>
                  </>
                ) : (
                  <>
                    <div style={{ fontWeight:900, color:C.blue, fontSize:30, marginBottom:8 }}>{current.front}</div>
                    <div style={{ color:C.mid, fontSize:18, marginBottom:8 }}>= {current.back}</div>
                    {current.example && (
                      <div style={{ background:C.bg, borderRadius:9, padding:"8px 12px", marginBottom:8, maxWidth:"100%" }}>
                        <div style={{ display:"flex", alignItems:"center", gap:6, justifyContent:"center", flexWrap:"wrap" }}>
                          <span style={{ color:C.mid, fontSize:13, fontStyle:"italic" }}>{current.example}</span>
                          {current.example && <PlayBtn text={current.example} sm />}
                        </div>
                      </div>
                    )}
                    <div style={{ color:C.muted, fontSize:11 }}>Next in: {current.interval}d · Interval × {current.ease?.toFixed(1)}</div>
                  </>
                )}
              </div>
              {/* Rate buttons — only show after flip */}
              {flipped && (
                <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:8 }} className="grid-2-xs">
                  {RATE_BTNS.map(b => (
                    <button key={b.q} onClick={() => rate(b.q)} style={{
                      padding:"12px 6px", borderRadius:11, border:`2px solid ${b.color}30`,
                      background:b.color+"12", color:b.color, fontWeight:800, fontSize:13,
                      cursor:"pointer", textAlign:"center", minHeight:56,
                    }}>
                      <div>{b.label}</div>
                      <div style={{ fontSize:10, fontWeight:500, marginTop:2, opacity:.8 }}>{b.desc}</div>
                    </button>
                  ))}
                </div>
              )}
              {!flipped && (
                <button onClick={() => setFlipped(true)} style={{ width:"100%", padding:12, background:C.surf2, color:C.text, border:`1px solid ${C.line}`, borderRadius:11, fontWeight:700, fontSize:14, cursor:"pointer" }}>
                  {t("show_answer")}
                </button>
              )}
            </div>
          )}
        </div>
      )}

      {/* ── BROWSE VIEW ── */}
      {view === "browse" && (
        <div>
          {cards.length === 0 ? (
            <Info text={`No ${tName} flashcards yet. Add cards using the Coach New Word exercise, Word Space, or the Add Card tab.`} color={C.muted} />
          ) : (
            cards.map(c => {
              const isDue = c.next_review <= now;
              const days  = Math.max(0, Math.round((c.next_review - now) / 86400000));
              return (
                <div key={c.id} style={{ background:C.card, border:`1px solid ${isDue?C.muted:C.bdr}`, borderRadius:11, padding:"11px 14px", marginBottom:8, display:"flex", alignItems:"center", gap:10, boxShadow:C.sh }}>
                  <div style={{ flex:1 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:2 }}>
                      <span style={{ fontWeight:800, color:C.blue, fontSize:15 }}>{c.front}</span>
                      <PlayBtn text={c.front} sm />
                      {isDue && <span style={{ background:C.surf2, color:C.muted, fontSize:9, fontWeight:700, padding:"1px 7px", borderRadius:10 }}>DUE</span>}
                    </div>
                    <div style={{ color:C.mid, fontSize:12, marginBottom:2 }}>= {c.back}</div>
                    <div style={{ color:C.muted, fontSize:10 }}>
                      {c.repetitions === 0 ? "New" : `Next review: ${isDue ? "now" : `in ${days}d`} · Rep ${c.repetitions}`}
                    </div>
                  </div>
                  <button onClick={() => deleteCard(c.id)} style={{ background:"none", border:"none", color:C.muted, cursor:"pointer", fontSize:18, padding:"0 4px", lineHeight:1 }}>×</button>
                </div>
              );
            })
          )}
        </div>
      )}

      {/* ── ADD CARD VIEW ── */}
      {view === "add" && (
        <div style={{ background:C.card, borderRadius:14, padding:"18px 16px", boxShadow:C.sh, border:`1px solid ${C.bdr}` }}>
          <div style={{ fontWeight:800, color:C.text, fontSize:15, marginBottom:14 }}>Add a {tName} Flashcard</div>
          {[
            { key:"front",        label:`Word in ${tName} *`,     placeholder:`e.g. bonjour`,       required:true  },
            { key:"back",         label:"Meaning *",              placeholder:`e.g. hello`,          required:true  },
            { key:"pronunciation",label:"Pronunciation",          placeholder:`e.g. bohn-ZHOOR`,     required:false },
            { key:"example",      label:`Example sentence in ${tName}`, placeholder:`e.g. Bonjour tout le monde`, required:false },
          ].map(f => (
            <div key={f.key} style={{ marginBottom:12 }}>
              <div style={{ fontSize:11, fontWeight:700, color:C.mid, marginBottom:4 }}>{f.label}</div>
              <input
                value={addForm[f.key]}
                onChange={e => setAddForm(p => ({...p, [f.key]: e.target.value}))}
                placeholder={f.placeholder}
                style={{ width:"100%", padding:"10px 13px", borderRadius:9, border:`2px solid ${C.bdr}`, fontSize:13, boxSizing:"border-box" }}
              />
            </div>
          ))}
          {addErr && <div style={{ color:C.red, fontSize:13, marginBottom:10 }}>{addErr}</div>}
          {addOk  && <div style={{ color:C.green, fontSize:13, marginBottom:10 }}>{t("card_added")}</div>}
          <button onClick={addCard} style={{ width:"100%", padding:12, background:C.accent, color:"#fff", border:"none", borderRadius:10, fontWeight:700, fontSize:14, cursor:"pointer" }}>
            Add Card
          </button>
        </div>
      )}
    </div>
  );
}

// ─── NEW IA SCREEN COMPONENTS ────────────────────────────────────────────────
// All new-design screens. They receive { L, nav, goBack, dark } props.
// nav(view) pushes current on stack and navigates; goBack() pops the stack.

const GRAD = "linear-gradient(135deg,#FF5F7E,#C0153E)";

// Shared back button used in every sub-screen
function BackBtn({ onClick }) {
  return (
    <button onClick={onClick} style={{
      width:36,height:36,border:`1px solid ${C.line}`,background:C.surf,
      borderRadius:11,display:"flex",alignItems:"center",justifyContent:"center",
      cursor:"pointer",flexShrink:0,
    }}>
      <Icon name="arrow-left" size={16}/>
    </button>
  );
}

// ── WRAPPED SCREEN — generic shell with back-btn header + scrollable body ─────
function WrappedScreen({ title, subtitle, goBack, children, noPad }) {
  useLucide([title]);
  return (
    <div style={{display:"flex",flexDirection:"column",flex:1,minHeight:0}}>
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 18px 10px",borderBottom:`1px solid ${C.line}`,background:C.surf,flexShrink:0}}>
        <BackBtn onClick={goBack}/>
        <div>
          <div style={{fontWeight:700,fontSize:19,color:C.text}}>{title}</div>
          {subtitle && <div style={{fontSize:11,fontWeight:500,color:C.muted,marginTop:1}}>{subtitle}</div>}
        </div>
      </div>
      <div style={{flex:1,minHeight:0,overflowY:"auto",padding:noPad ? 0 : "16px 18px calc(28px + env(safe-area-inset-bottom))"}}>
        {children}
      </div>
    </div>
  );
}

// ── EXPLORE HOME ──────────────────────────────────────────────────────────────
function ExploreHome({ L, nav, factIdx, onNextFact, onOpenSettings, onOpenLang, dark, onToggleDark, streak, isDesktop, userLevel }) {
  useLucide([L.id, factIdx, dark]);
  const fact = L.facts[factIdx % L.facts.length];
  // Show the learner's own stored self-assessment when we have it, else the language's default CEFR band.
  const LEVEL_LABEL = { "beginner-zero":t("lvl_starting"), beginner:t("lvl_beginner"), intermediate:t("lvl_intermediate"), advanced:t("lvl_advanced") };
  const levelText = LEVEL_LABEL[userLevel] || `Level ${L.level}`;

  const HELPERS = [
    {id:"coach",  label:t("nav_coach"),  icon:"sparkles"},
    {id:"cards",  label:t("nav_flashcards"),  icon:"layers"},
    {id:"drills", label:t("nav_drills"), icon:"zap"},
    {id:"review", label:t("nav_review"), icon:"graduation-cap"},
  ];
  // Front door by INTENT (what the learner wants to do), not by tool name.
  const INTENTS = [
    {id:"voice-tutor", icon:"mic",             want:t("intent_speak"),         why:t("intent_speak_why")},
    {id:"coach",       icon:"sparkles",        want:t("intent_corrected"),     why:t("intent_corrected_why")},
    {id:"dialogues",   icon:"messages-square", want:t("intent_conversations"), why:t("intent_conversations_why")},
    {id:"analyzer",    icon:"scan-text",       want:t("intent_understand"),    why:t("intent_understand_why")},
    {id:"wordspace",   icon:"search",          want:t("intent_lookup"),        why:t("intent_lookup_why")},
    {id:"grammar",     icon:"book-open",       want:t("intent_how"),           why:t("intent_how_why")},
    {id:"vocab-full",  icon:"type",            want:t("intent_vocab"),         why:t("intent_vocab_why")},
    {id:"today",       icon:"sun",             want:t("intent_daily"),         why:t("intent_daily_why")},
  ];
  const MORE = [
    {id:"roadmap",    title:t("more_next"),      icon:"map"},
    {id:"structures", title:t("more_patterns"),  icon:"layout-list"},
    {id:"cards",      title:t("more_flashcards"), icon:"layers"},
    {id:"sounds",     title:t("more_sounds"),    icon:"volume-2"},
    {id:"culture",    title:t("more_culture"),   icon:"compass"},
    {id:"drills",     title:t("more_drills"),    icon:"zap"},
  ];

  return (
    <div style={{display:"flex",flexDirection:"column",flex:1,minHeight:0,background:C.bg,fontFamily:"'Space Grotesk',system-ui,sans-serif"}}>
      {/* Header — hidden on desktop, where the sidebar owns brand/language/theme/settings */}
      {!isDesktop && (
      <div style={{padding:"13px 16px 10px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:`1px solid ${C.line}`,background:C.surf,flexShrink:0}}>
        <button onClick={onOpenLang} style={{display:"flex",alignItems:"center",gap:9,background:"none",border:"none",cursor:"pointer",textAlign:"left",padding:0}}>
          <div style={{width:36,height:36,borderRadius:10,background:GRAD,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <Icon name="languages" size={18} color="#fff"/>
          </div>
          <div>
            <div style={{fontWeight:700,fontSize:20,letterSpacing:"-.02em",color:C.text,lineHeight:1.1}}>{L.name}</div>
            <div style={{fontSize:10,fontWeight:600,color:C.accent,display:"flex",alignItems:"center",gap:3}}>{t("home_switch")} <Icon name="chevron-down" size={10} color={C.accent}/></div>
          </div>
        </button>
        <div style={{display:"flex",alignItems:"center",gap:7}}>
          <button onClick={onToggleDark} style={{width:34,height:34,border:`1px solid ${C.line}`,background:C.surf2,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
            <Icon name={dark?"sun":"moon"} size={15}/>
          </button>
          <button onClick={onOpenSettings} style={{width:34,height:34,border:`1px solid ${C.line}`,background:C.surf2,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
            <Icon name="settings" size={15}/>
          </button>
        </div>
      </div>
      )}

      {/* Scrollable body */}
      <div style={{flex:1,overflowY:"auto",padding: isDesktop ? "22px 28px 12px" : "16px 18px 10px"}}>
        {/* Streak + level pills */}
        <div style={{display:"flex",gap:8,marginBottom:13}}>
          <div style={{flex:1,display:"flex",alignItems:"center",gap:6,background:C.surf,border:`1px solid ${C.line}`,borderRadius:999,padding:"7px 12px"}}>
            <Icon name="flame" size={14} color="#E8902B"/>
            <span style={{fontWeight:600,fontSize:12,color:C.text}}>{streak > 0 ? t("streak_days", {n:streak}) : t("home_start_streak")}</span>
          </div>
          <div style={{flex:1,display:"flex",alignItems:"center",gap:6,background:C.surf,border:`1px solid ${C.line}`,borderRadius:999,padding:"7px 12px"}}>
            <Icon name="trophy" size={14} color="#22A06B"/>
            <span style={{fontWeight:600,fontSize:12,color:C.text}}>{levelText}</span>
          </div>
        </div>

        {/* Culture fact */}
        <div style={{borderRadius:16,padding:"13px 15px",background:"linear-gradient(135deg,rgba(255,95,126,.1),rgba(192,21,62,.08))",border:`1px solid ${C.accentLine}`,marginBottom:11}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
            <div style={{display:"flex",alignItems:"center",gap:7}}>
              <Icon name={fact.icon} size={13} color={C.accent}/>
              <span style={{fontSize:9,fontWeight:700,letterSpacing:".14em",textTransform:"uppercase",color:C.accent}}>{t("home_did_you_know")}</span>
            </div>
            <button onClick={onNextFact} style={{display:"flex",alignItems:"center",gap:4,background:"none",border:"none",cursor:"pointer",color:C.muted,fontFamily:"inherit",fontWeight:600,fontSize:11}}>
              <Icon name="refresh-cw" size={11}/>{t("home_new_fact")}
            </button>
          </div>
          <div style={{fontSize:13,fontWeight:500,lineHeight:1.55,color:C.text}}>{fact.text}</div>
        </div>

        {/* Ask anything → Coach */}
        <button onClick={() => nav("coach")} style={{width:"100%",display:"flex",alignItems:"center",gap:11,background:C.surf,border:`1.5px solid ${C.line}`,borderRadius:15,padding:"12px 14px",cursor:"pointer",textAlign:"left",marginBottom:11,fontFamily:"inherit"}}>
          <div style={{width:34,height:34,borderRadius:10,background:GRAD,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <Icon name="sparkles" size={17} color="#fff"/>
          </div>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:14,color:C.text}}>{t("home_ask")}</div>
            <div style={{fontSize:11,fontWeight:500,color:C.muted,marginTop:1}}>{t("home_ask_sub")}</div>
          </div>
          <Icon name="arrow-up-right" size={16} color={C.faint}/>
        </button>

        {/* Continue card — reflects the last thing you actually opened (no fake progress) */}
        {(() => {
          let last = null;
          try { last = JSON.parse(localStorage.getItem("tongue_last") || "null"); } catch(e) {}
          const hasLast = last && last.view && last.label;
          return (
            <button onClick={() => nav(hasLast ? last.view : "grammar")} style={{width:"100%",textAlign:"left",borderRadius:16,padding:"15px 16px",background:GRAD,color:"#fff",cursor:"pointer",border:"none",boxShadow:"0 14px 28px -12px rgba(192,21,62,.45)",marginBottom:18,fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
              <div style={{minWidth:0}}>
                <div style={{fontSize:9,fontWeight:700,letterSpacing:".14em",textTransform:"uppercase",opacity:.85}}>{hasLast ? t("home_resume_label") : t("home_new_here")}</div>
                <div style={{fontWeight:700,fontSize:17,marginTop:5}}>{hasLast ? last.label : t("home_start_essentials")}</div>

  const expand = async (i, c) => {
    if (open === i) { setOpen(null); return; }
    setOpen(i);
    if (deep[i]?.data || deep[i]?.loading) return;
    if (!isLoggedIn()) { window.dispatchEvent(new CustomEvent("show-upgrade")); return; }
    setDeep(d => ({ ...d, [i]: { loading: true } }));
    try {
      const res = await askClaude(
        `You are a ${L.name} culture and etiquette expert teaching a learner. Go deeper on this cultural point: "${c.title} — ${c.body}". Return ONLY JSON: {"detail":"2 short paragraphs explaining the nuance, history, and how it actually plays out day to day","examples":[{"phrase":"a real ${L.name} phrase or micro-situation","gloss":"English meaning"}],"dos":["one thing to do"],"donts":["one thing to avoid"]}`,
        600, L.id, _nativeLang || "en"
      );
      setDeep(d => ({ ...d, [i]: { loading: false, data: res } }));
    } catch (e) {
      setDeep(d => ({ ...d, [i]: { loading: false, err: true } }));
    }
  };

  return (
    <div className="scr-anim" style={{flex:1,overflowY:"auto",padding:"6px 18px 24px",fontFamily:"'Space Grotesk',system-ui,sans-serif"}}>
      <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:14}}>
        <BackBtn onClick={goBack}/>
        <div>
          <div style={{fontWeight:700,fontSize:20,color:C.text}}>Culture &amp; Nuance</div>
          <div style={{fontSize:11,fontWeight:500,color:C.muted}}>Tap any topic to go deeper into how {L.name} really works</div>
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:11}}>
        {L.culture.map((c,i)=>{
          const isOpen = open === i;
          const st = deep[i];
          return (
          <div key={i} style={{background:C.surf,border:`1px solid ${isOpen ? C.accent : C.line}`,borderRadius:15,overflow:"hidden",transition:"border .15s"}}>
            <button onClick={()=>expand(i,c)} style={{width:"100%",background:"none",border:"none",cursor:"pointer",fontFamily:"inherit",textAlign:"left",padding:15,display:"flex",gap:13,alignItems:"flex-start"}}>
              <div style={{width:40,height:40,borderRadius:12,background:isOpen?C.accentSoft:C.surf2,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <Icon name={c.icon} size={19} color={isOpen?C.accent:C.text}/>
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:15,color:C.text}}>{c.title}</div>
                <div style={{fontSize:12.5,fontWeight:500,color:C.muted,lineHeight:1.5,marginTop:3}}>{c.body}</div>
              </div>
              <Icon name={isOpen?"chevron-up":"chevron-down"} size={16} color={C.faint}/>
            </button>
            {isOpen && (
              <div style={{padding:"0 15px 15px",borderTop:`1px solid ${C.line}`}}>
                {st?.loading && <div style={{padding:"14px 0",display:"flex",alignItems:"center",gap:9,color:C.muted,fontSize:12.5}}><div style={{width:16,height:16,border:`2px solid ${C.line}`,borderTopColor:C.accent,borderRadius:"50%",animation:"spin .7s linear infinite"}}/> Going deeper…</div>}
                {st?.err && <div style={{padding:"14px 0",color:C.muted,fontSize:12.5}}>Couldn't load right now — tap again to retry.</div>}
                {st?.data && (
                  <div style={{paddingTop:12}}>
                    <div style={{fontSize:13,color:C.text,lineHeight:1.6,whiteSpace:"pre-line"}}>{st.data.detail}</div>
                    {Array.isArray(st.data.examples) && st.data.examples.length>0 && (
                      <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:7}}>
                        {st.data.examples.map((ex,ei)=>(
                          <div key={ei} style={{background:C.surf2,borderRadius:9,padding:"9px 11px",display:"flex",alignItems:"center",gap:9}}>
                            <div style={{flex:1}}>
                              <div style={{fontWeight:700,fontSize:13.5,color:C.accent}}>{ex.phrase}</div>
                              <div style={{fontSize:11.5,color:C.muted,marginTop:1}}>{ex.gloss}</div>
                            </div>
                            <PlayBtn text={ex.phrase} sm/>
                          </div>
                        ))}
                      </div>
                    )}
                    <div style={{display:"flex",gap:10,marginTop:12,flexWrap:"wrap"}}>
                      {(st.data.dos||[]).map((d,di)=><div key={"do"+di} style={{flex:"1 1 45%",background:C.green+"12",border:`1px solid ${C.green}30`,borderRadius:9,padding:"8px 10px",fontSize:11.5,color:C.text}}><b style={{color:C.green}}>Do</b> · {d}</div>)}
                      {(st.data.donts||[]).map((d,di)=><div key={"dont"+di} style={{flex:"1 1 45%",background:C.red+"12",border:`1px solid ${C.red}30`,borderRadius:9,padding:"8px 10px",fontSize:11.5,color:C.text}}><b style={{color:C.red}}>Avoid</b> · {d}</div>)}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
          );
        })}
      </div>
    </div>
  );
}

// ── NEW ONBOARDING (3-step) ────────────────────────────────────────────────────
function NewOnboarding({ onDone, onSetLang }) {
  useLucide([]);
  const [step, setStep] = useState(0);
  const [selLang, setSelLang] = useState("fr");
  const [selLevel, setSelLevel] = useState(1);

  const FEATURES = [
    {icon:"compass",title:"Explore freely",desc:"Grammar, words, phrases, sounds — every door open from day one"},
    {icon:"sparkles",title:"Coach on tap",desc:"A coworking space for whatever you're curious about"},
    {icon:"layers",title:"Helpers everywhere",desc:"Cards & drills attach to any topic instantly"},
    {icon:"globe",title:"12 languages",desc:"One subscription, all of them — switch anytime"},
  ];
  const LEVELS = [
    {title:"Complete beginner",desc:"Starting from zero"},
    {title:"Basic",desc:"Know a few words"},
    {title:"Intermediate",desc:"Can hold a simple chat"},
    {title:"Advanced",desc:"Refining fluency"},
  ];
  const ALL_LANGS = Object.values(LANGS_DATA);

  const prog = ((step + 1) / 4 * 100) + "%";
  const LEVEL_CODES = ["beginner-zero", "beginner", "intermediate", "advanced"];
  const saveAndFinish = () => {
    onSetLang(selLang);
    if (isLoggedIn()) {
      fetch("/api/auth/onboarding", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() },
        body: JSON.stringify({ level: LEVEL_CODES[selLevel] || "beginner", language: selLang }),
      }).catch(() => {});
    }
    onDone();
  };
  const START_STEPS = [
    { icon:"sparkles",   title:"Talk to your Coach",  desc:"The fastest way in — ask anything or get a bite-size exercise." },
    { icon:"sun",        title:"Do Today's Practice",     desc:"A short daily rep. A little every day beats cramming." },
    { icon:"compass",    title:"Explore when you're ready", desc:"Grammar, vocab, dialogues, flashcards — all in the menu, no rush." },
  ];

  return (
    <div style={{position:"fixed",inset:0,background:C.bg,zIndex:200,display:"flex",flexDirection:"column",padding:"44px 22px 24px",fontFamily:"'Space Grotesk',system-ui,sans-serif"}}>
      <div style={{height:5,background:C.surf2,borderRadius:99,overflow:"hidden",marginBottom:26}}>
        <div style={{height:"100%",width:prog,background:GRAD,borderRadius:99,transition:"width .3s"}}/>
      </div>
      <div style={{flex:1,overflowY:"auto"}}>
        {step === 0 && (
          <>
            <div style={{width:64,height:64,borderRadius:19,background:GRAD,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:20,boxShadow:"0 14px 34px -8px rgba(192,21,62,.5)"}}>
              <Icon name="languages" size={33} color="#fff"/>
            </div>
            <div style={{fontSize:27,fontWeight:700,letterSpacing:"-.02em",color:C.text,lineHeight:1.12}}>Open the whole language</div>
            <div style={{fontSize:14,fontWeight:500,color:C.muted,margin:"8px 0 22px"}}>Tongue lets you explore any language freely — and brings smart helpers to whatever you're curious about. Learn your own way.</div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              {FEATURES.map((f,i)=>(
                <div key={i} style={{display:"flex",gap:12,alignItems:"flex-start"}}>
                  <div style={{width:38,height:38,borderRadius:11,background:C.surf,border:`1px solid ${C.line}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    <Icon name={f.icon} size={19} color={C.accent}/>
                  </div>
                  <div>
                    <div style={{fontWeight:600,fontSize:14,color:C.text}}>{f.title}</div>
                    <div style={{fontSize:12.5,fontWeight:500,color:C.muted}}>{f.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </>
        )}
        {step === 1 && (
          <>
            <div style={{fontSize:24,fontWeight:700,color:C.text,marginBottom:6}}>Which language?</div>
            <div style={{fontSize:13.5,fontWeight:500,color:C.muted,marginBottom:20}}>Pick one to open. You can switch anytime.</div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {ALL_LANGS.slice(0,12).map(l=>(
                <button key={l.id} onClick={() => setSelLang(l.id)} style={{display:"flex",alignItems:"center",gap:12,background:selLang===l.id?C.accentSoft:C.surf,border:`1.5px solid ${selLang===l.id?C.accent:C.line}`,borderRadius:14,padding:"13px 14px",cursor:"pointer",textAlign:"left",fontFamily:"inherit"}}>
                  <span style={{width:34,height:24,borderRadius:5,background:l.flag,flexShrink:0,display:"block"}}/>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:600,fontSize:15,color:C.text}}>{l.name}</div>
                    <div style={{fontSize:11.5,fontWeight:500,color:C.muted}}>{l.native} · {l.speakers}</div>
                  </div>
                  {selLang===l.id && <Icon name="check-circle-2" size={21} color={C.accent}/>}
                </button>
              ))}
            </div>
          </>
        )}
        {step === 2 && (
          <>
            <div style={{fontSize:24,fontWeight:700,color:C.text,marginBottom:6}}>Your level?</div>
            <div style={{fontSize:13.5,fontWeight:500,color:C.muted,marginBottom:20}}>The coach adapts from here.</div>
            <div style={{display:"flex",flexDirection:"column",gap:11}}>
              {LEVELS.map((l,i)=>(
                <button key={i} onClick={() => setSelLevel(i)} style={{display:"flex",alignItems:"center",gap:12,textAlign:"left",background:selLevel===i?C.accentSoft:C.surf,border:`1.5px solid ${selLevel===i?C.accent:C.line}`,borderRadius:14,padding:14,cursor:"pointer",fontFamily:"inherit"}}>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:600,fontSize:14.5,color:C.text}}>{l.title}</div>
                    <div style={{fontSize:12,fontWeight:500,color:C.muted}}>{l.desc}</div>
                  </div>
                  {selLevel===i && <Icon name="check-circle-2" size={22} color={C.accent}/>}
                </button>
              ))}
            </div>
          </>
        )}
        {step === 3 && (
          <>
            <div style={{width:60,height:60,borderRadius:17,background:C.green+"18",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:18}}>
              <Icon name="check-circle-2" size={31} color={C.green}/>
            </div>
            <div style={{fontSize:25,fontWeight:700,letterSpacing:"-.02em",color:C.text,lineHeight:1.15}}>You're all set</div>
            <div style={{fontSize:14,fontWeight:500,color:C.muted,margin:"8px 0 22px"}}>There's a lot here — but you don't need it all at once. Just start with one thing:</div>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {START_STEPS.map((s,i)=>(
                <div key={i} style={{display:"flex",gap:13,alignItems:"flex-start",background:C.surf,border:`1px solid ${C.line}`,borderRadius:14,padding:"14px 15px"}}>
                  <div style={{width:36,height:36,borderRadius:10,background:i===0?C.accentSoft:C.surf2,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    <Icon name={s.icon} size={18} color={i===0?C.accent:C.text}/>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:600,fontSize:14.5,color:C.text}}>{i===0 && <span style={{color:C.accent,fontWeight:700}}>Recommended · </span>}{s.title}</div>
                    <div style={{fontSize:12.5,fontWeight:500,color:C.muted,marginTop:2}}>{s.desc}</div>
                  </div>
                </div>
              ))}
            </div>
          </>
        )}
      </div>
      <div style={{display:"flex",gap:10,marginTop:16}}>
        {step > 0 && (
          <button onClick={() => setStep(s=>s-1)} style={{flexShrink:0,background:C.surf,border:`1px solid ${C.line}`,color:C.text,borderRadius:13,padding:"14px 20px",fontWeight:600,fontSize:14.5,cursor:"pointer",fontFamily:"inherit"}}>Back</button>
        )}
        <button onClick={() => {
          if (step === 3) { saveAndFinish(); }
          else setStep(s=>s+1);
        }} style={{flex:1,background:GRAD,border:"none",color:"#fff",borderRadius:13,padding:14,fontWeight:600,fontSize:15,cursor:"pointer",fontFamily:"inherit"}}>
          {step === 3 ? "Start learning" : "Continue"}
        </button>
      </div>
    </div>
  );
}
