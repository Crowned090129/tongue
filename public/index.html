// ─── VOICE TUTOR ──────────────────────────────────────────────────────────────
// ─── CONVERSATION ──────────────────────────────────────────────────────────────
// A real, streaming, multi-turn conversation. Pick a scenario, then chat by typing
// or speaking; the tutor replies live (SSE), stays in the target language, recasts
// mistakes, and you can hear or translate any line. End any time for a report.
function Conversation({ tLang, rLangs, nativeLang }) {
  const tName   = TARGETS[tLang]?.name || "French";
  const tTts    = TARGETS[tLang]?.tts  || "fr-FR";
  const refName = rLangs[0] ? (REFS?.[rLangs[0]]?.name || TARGETS[rLangs[0]]?.name || "English") : "English";
  const level   = (() => { try { return localStorage.getItem("user_level") || "beginner"; } catch(e){ return "beginner"; } })();
  const hasSR   = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

  const SCENARIOS = [
    { id:"free",       icon:"message-circle",  title:"Free chat",       blurb:"Talk about anything" },
    { id:"cafe",       icon:"coffee",          title:"At a café",       blurb:"Order a drink, chat" },
    { id:"friend",     icon:"users",           title:"Make a friend",   blurb:"Meet someone new" },
    { id:"restaurant", icon:"utensils",        title:"At a restaurant", blurb:"Order from a waiter" },
    { id:"directions", icon:"map-pin",         title:"Ask directions",  blurb:"You're a lost tourist" },
    { id:"market",     icon:"shopping-basket", title:"At the market",   blurb:"Buy food, haggle" },
    { id:"hotel",      icon:"bed-double",      title:"Hotel check-in",  blurb:"Check in, ask around" },
    { id:"interview",  icon:"briefcase",       title:"Job interview",   blurb:"Land your dream job" },
    { id:"doctor",     icon:"stethoscope",     title:"At the doctor",   blurb:"Describe symptoms" },
    { id:"date",       icon:"heart",           title:"First date",      blurb:"A warm, playful chat" },
  ];

  const [phase, setPhase]     = useState("pick");   // pick | chat | review
  const [scenario, setScen]   = useState(null);
  const [msgs, setMsgs]       = useState([]);
  const [input, setInput]     = useState("");
  const [streaming, setStreaming] = useState(false);
  const [voiceOn, setVoiceOn] = useState(false);
  const [listening, setListening] = useState(false);
  const [errMsg, setErrMsg]   = useState("");
  const [summary, setSummary] = useState(null);
  const [summaryLoading, setSummaryLoading] = useState(false);

  const apiRef   = useRef([]);
  const msgsRef  = useRef([]);
  const recRef   = useRef(null);
  const scrollRef = useRef(null);
  const voiceRef = useRef(false);
  const phaseRef = useRef("pick");
  const scenRef  = useRef(null);

  useEffect(() => { voiceRef.current = voiceOn; }, [voiceOn]);
  useEffect(() => { phaseRef.current = phase; }, [phase]);
  useEffect(() => { const el = scrollRef.current; if (el) el.scrollTop = el.scrollHeight; }, [msgs, streaming, listening]);
  useEffect(() => () => { try { recRef.current?.abort(); } catch(e){} try { synth()?.cancel(); } catch(e){} }, []);

  const setBoth = (arr) => { msgsRef.current = arr; setMsgs(arr); };

  const speak = (text) => new Promise(resolve => {
    const s = synth(); if (!s || !text) { resolve(); return; }
    try { s.cancel(); } catch(e){}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = tTts; u.rate = 0.9;
    u.onend = resolve; u.onerror = resolve;
    setTimeout(() => { try { s.speak(u); } catch(e){ resolve(); } }, 60);
  });

  const listenOnce = () => new Promise((resolve, reject) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { reject(new Error("no_sr")); return; }
    const r = new SR();
    r.lang = tTts; r.continuous = false; r.interimResults = false; r.maxAlternatives = 1;
    recRef.current = r;
    r.onresult = e => resolve(e.results[0][0].transcript);
    r.onerror  = e => reject(new Error(e.error));
    try { r.start(); } catch(e){ reject(e); }
  });

  // Stream one tutor turn from the current apiRef into a live-updating bubble.
  const streamTurn = async () => {
    setStreaming(true); setErrMsg("");
    let arr = [...msgsRef.current, { who:"ai", text:"" }];
    setBoth(arr);
    const idx = arr.length - 1;
    let acc = "";
    await streamChat(
      { messages: apiRef.current, scenario: scenRef.current, level, lang: tLang, nativeLang },
      {
        onDelta: (t) => {
          acc += t;
          const next = [...msgsRef.current];
          if (next[idx]) next[idx] = { ...next[idx], text: acc };
          setBoth(next);
        },
        onDone: async () => {
          apiRef.current = [...apiRef.current, { role:"assistant", content: acc }];
          setStreaming(false);
          if (acc && voiceRef.current && phaseRef.current === "chat") {
            await speak(acc);
            if (voiceRef.current && phaseRef.current === "chat") micTurn();
          }
        },
        onError: (e) => {
          setStreaming(false);
          if (!acc) { setBoth(msgsRef.current.slice(0, idx)); }
          if (e.type === "limit" || e.type === "auth" || e.type === "renewed") setErrMsg("");
          else setErrMsg(e.message || "The tutor hit a snag. Please try again.");
          if (voiceRef.current) setVoiceOn(false);
        },
      }
    );
  };

  const startScenario = async (sc) => {
    setScen(sc.id); scenRef.current = sc.id;
    setPhase("chat"); phaseRef.current = "chat";
    setBoth([]); setSummary(null); setErrMsg(""); setInput("");
    apiRef.current = [{ role:"user", content:"(Please begin — greet me and start the scene.)" }];
    await streamTurn();
  };

  const sendText = async (text) => {
    const t = (text != null ? text : input).trim();
    if (!t || streaming) return;
    setInput("");
    setBoth([...msgsRef.current, { who:"you", text: t }]);
    apiRef.current = [...apiRef.current, { role:"user", content: t }];
    await streamTurn();
  };

  const micTurn = async () => {
    if (streaming || listening) return;
    setListening(true); setErrMsg("");
    try {
      const heard = await listenOnce();
      setListening(false);
      if (heard && heard.trim()) await sendText(heard);
      else if (voiceRef.current && phaseRef.current === "chat") micTurn();
    } catch(e) {
      setListening(false); setVoiceOn(false);
      if (e.message === "no_sr") setErrMsg("Voice input needs Chrome or Safari — you can still type.");
      else if (e.message !== "no-speech" && e.message !== "aborted") setErrMsg("Didn't catch that — try again or type.");
    }
  };

  const toggleVoice = () => {
    const next = !voiceOn;
    setVoiceOn(next); voiceRef.current = next;
    if (next) { if (!streaming && !listening) micTurn(); }
    else { try { recRef.current?.abort(); } catch(e){} try { synth()?.cancel(); } catch(e){} setListening(false); }
  };

  const translateMsg = async (idx) => {
    const m = msgsRef.current[idx];
    if (!m || m.translation || m.translating) return;
    setBoth(msgsRef.current.map((x,i) => i===idx ? { ...x, translating:true } : x));
    try {
      const r = await askClaude(`Translate this ${tName} text into ${refName}. Return ONLY JSON: {"t":"the translation"}\n\nText: ${m.text}`, 250, tLang, nativeLang);
      setBoth(msgsRef.current.map((x,i) => i===idx ? { ...x, translation: (r && r.t) || "—", translating:false } : x));
    } catch(e) {
      setBoth(msgsRef.current.map((x,i) => i===idx ? { ...x, translating:false } : x));
    }
  };

  const endConversation = async () => {
    try { recRef.current?.abort(); } catch(e){} try { synth()?.cancel(); } catch(e){}
    setVoiceOn(false); voiceRef.current = false; setListening(false);
    if (msgsRef.current.filter(m => m.who === "you").length === 0) { setPhase("pick"); return; }
    setPhase("review"); phaseRef.current = "review"; setSummaryLoading(true);
    const transcript = msgsRef.current.map(m => `${m.who==="ai"?"Tutor":"You"}: ${m.text}`).join("\n");
    try {
      const fb = await askClaude(`You were a ${tName} conversation tutor. Transcript:\n${transcript}\n\nGive honest, encouraging feedback in ${refName}. Return ONLY JSON: {"score":"A/B/C/D","strong":["point","point"],"fixes":[{"said":"exact quote","better":"correction","why":"brief reason"}],"next":"one thing to practice next"}`, 700, tLang, nativeLang);
      setSummary(fb);
    } catch(e) { setSummary(null); }
    setSummaryLoading(false);
  };

  const reset = () => {
    try { recRef.current?.abort(); } catch(e){} try { synth()?.cancel(); } catch(e){}
    setPhase("pick"); phaseRef.current = "pick";
    setScen(null); scenRef.current = null;
    setBoth([]); setSummary(null); setErrMsg(""); setInput(""); setVoiceOn(false); voiceRef.current = false;
    apiRef.current = [];
  };

  const scoreColor = { A:C.green, B:C.green, C:C.accent, D:C.red };
  const scenMeta = SCENARIOS.find(s => s.id === scenario);

  // ── PICK ──
  if (phase === "pick") {
    return (
      <div style={{padding:"16px 16px 28px",overflowY:"auto",flex:1}}>
        <div style={{marginBottom:16}}>
          <div style={{fontWeight:800,fontSize:18,color:C.text,marginBottom:4}}>Have a real {tName} conversation</div>
          <div style={{color:C.muted,fontSize:13,lineHeight:1.55}}>Pick a situation. Type or speak — your tutor replies live, stays in {tName}, and gently fixes your mistakes as you go.</div>
        </div>
        {errMsg && <div style={{background:C.red+"12",border:`1px solid ${C.red}30`,borderRadius:10,padding:"10px 13px",color:C.red,fontSize:12.5,marginBottom:14}}>{errMsg}</div>}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
          {SCENARIOS.map(sc => (
            <button key={sc.id} onClick={() => startScenario(sc)} style={{display:"flex",flexDirection:"column",gap:8,alignItems:"flex-start",textAlign:"left",background:C.surf,border:`1px solid ${C.line}`,borderRadius:14,padding:"13px 13px",cursor:"pointer",fontFamily:"inherit"}}>
              <div style={{width:36,height:36,borderRadius:10,background:C.accentSoft,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <Icon name={sc.icon} size={18} color={C.accent}/>
              </div>
              <div>
                <div style={{fontWeight:700,fontSize:13.5,color:C.text,lineHeight:1.25}}>{sc.title}</div>
                <div style={{fontSize:11,color:C.muted,marginTop:1}}>{sc.blurb}</div>
              </div>
            </button>
          ))}
        </div>
      </div>
    );
  }

  // ── REVIEW ──
  if (phase === "review") {
    return (
      <div style={{padding:"16px 16px 28px",overflowY:"auto",flex:1}}>
        <div style={{fontWeight:800,fontSize:18,color:C.text,marginBottom:3}}>Conversation complete</div>
        <div style={{color:C.muted,fontSize:12,marginBottom:16}}>{msgsRef.current.length} messages · {scenMeta?.title || tName}</div>
        <div style={{marginBottom:18,display:"flex",flexDirection:"column",gap:8}}>
          {msgsRef.current.map((m,i) => (
            <div key={i} style={{display:"flex",flexDirection:"column",alignItems: m.who==="you"?"flex-end":"flex-start"}}>
              <div style={{maxWidth:"88%",padding:"9px 12px",borderRadius:13,background: m.who==="ai"?C.accentSoft:C.surf2,border:`1px solid ${m.who==="ai"?C.accentLine:C.line}`}}>
                <div style={{fontWeight:600,fontSize:13.5,color: m.who==="ai"?C.accent:C.text}}>{m.text}</div>
              </div>
            </div>
          ))}
        </div>
        {summaryLoading && <div style={{color:C.muted,fontSize:13,textAlign:"center",padding:"10px 0"}}>Reviewing your conversation…</div>}
        {summary && (
          <div style={{background:C.surf,border:`1px solid ${C.line}`,borderRadius:14,padding:16,marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
              <div style={{width:44,height:44,borderRadius:12,background:(scoreColor[summary.score]||C.accent)+"18",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:20,color:scoreColor[summary.score]||C.accent}}>{summary.score||"B"}</div>
              <div><div style={{fontWeight:800,fontSize:15,color:C.text}}>Your performance</div><div style={{fontSize:11,color:C.muted}}>{tName} conversation</div></div>
            </div>
            {summary.strong?.length>0 && (
              <div style={{marginBottom:12}}>
                <div style={{fontWeight:700,fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>What went well</div>
                {summary.strong.map((s,i)=><div key={i} style={{display:"flex",gap:7,alignItems:"flex-start",marginBottom:4}}><Icon name="check" size={14} color={C.green}/><span style={{fontSize:13,color:C.text,lineHeight:1.4}}>{s}</span></div>)}
              </div>
            )}
            {summary.fixes?.length>0 && (
              <div style={{marginBottom:12}}>
                <div style={{fontWeight:700,fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>Corrections</div>
                {summary.fixes.map((f,i)=>(
                  <div key={i} style={{background:C.surf2,border:`1px solid ${C.line}`,borderRadius:9,padding:"9px 11px",marginBottom:7}}>
                    <div style={{display:"flex",gap:6,alignItems:"baseline",marginBottom:3,flexWrap:"wrap"}}>
                      <span style={{fontSize:12,color:C.red,textDecoration:"line-through"}}>{f.said}</span>
                      <Icon name="arrow-right" size={11} color={C.muted}/>
                      <span style={{fontSize:12,color:C.green,fontWeight:700}}>{f.better}</span>
                    </div>
                    <div style={{fontSize:11,color:C.muted}}>{f.why}</div>
                  </div>
                ))}
              </div>
            )}
            {summary.next && (
              <div style={{background:C.accentSoft,border:`1px solid ${C.accentLine}`,borderRadius:9,padding:"9px 11px"}}>
                <div style={{fontWeight:700,fontSize:11,color:C.accent,marginBottom:3,textTransform:"uppercase",letterSpacing:1}}>Practice next</div>
                <div style={{fontSize:12.5,color:C.text}}>{summary.next}</div>
              </div>
            )}
          </div>
        )}
        <button onClick={reset} style={{width:"100%",padding:13,background:GRAD,color:"#fff",border:"none",borderRadius:13,fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>New conversation</button>
      </div>
    );
  }

  // ── CHAT ──
  return (
    <div style={{display:"flex",flexDirection:"column",flex:1,minHeight:0}}>
      {/* Scenario header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",borderBottom:`1px solid ${C.line}`,flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:9,minWidth:0}}>
          <div style={{width:30,height:30,borderRadius:9,background:C.accentSoft,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <Icon name={scenMeta?.icon || "message-circle"} size={15} color={C.accent}/>
          </div>
          <div style={{minWidth:0}}>
            <div style={{fontWeight:700,fontSize:13.5,color:C.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{scenMeta?.title || "Conversation"}</div>
            <div style={{fontSize:10.5,color:C.muted}}>{tName} · tap a line to hear or translate</div>
          </div>
        </div>
        <button onClick={endConversation} style={{padding:"6px 12px",borderRadius:9,border:`1px solid ${C.line}`,background:C.surf2,color:C.text,fontSize:11.5,fontWeight:700,cursor:"pointer",fontFamily:"inherit",flexShrink:0}}>End &amp; review</button>
      </div>

      {/* Messages */}
      <div ref={scrollRef} style={{flex:1,overflowY:"auto",padding:"14px 14px 8px",display:"flex",flexDirection:"column",gap:11,minHeight:0}}>
        {msgs.map((m,i) => (
          <div key={i} style={{display:"flex",flexDirection:"column",alignItems: m.who==="you"?"flex-end":"flex-start",maxWidth:"100%"}}>
            <div style={{maxWidth:"88%",padding:"10px 13px",borderRadius:14,background: m.who==="ai"?C.accentSoft:C.surf2,border:`1px solid ${m.who==="ai"?C.accentLine:C.line}`}}>
              <div style={{fontWeight:600,fontSize:14.5,color: m.who==="ai"?C.accent:C.text,lineHeight:1.5,whiteSpace:"pre-wrap"}}>
                {m.text || (streaming && i===msgs.length-1 ? "…" : "")}
              </div>
              {m.translation && <div style={{fontSize:12,color:C.muted,fontStyle:"italic",marginTop:5,paddingTop:5,borderTop:`1px solid ${C.line}`}}>{m.translation}</div>}
              {m.who==="ai" && m.text && !(streaming && i===msgs.length-1) && (
                <div style={{display:"flex",gap:14,marginTop:7}}>
                  <button onClick={()=>speak(m.text)} style={{display:"flex",alignItems:"center",gap:4,background:"none",border:"none",padding:0,cursor:"pointer",color:C.accent,fontSize:11,fontWeight:600,fontFamily:"inherit"}}><Icon name="volume-2" size={13} color={C.accent}/>Hear</button>
                  <button onClick={()=>translateMsg(i)} disabled={m.translating} style={{display:"flex",alignItems:"center",gap:4,background:"none",border:"none",padding:0,cursor:"pointer",color:C.muted,fontSize:11,fontWeight:600,fontFamily:"inherit"}}><Icon name="languages" size={13} color={C.muted}/>{m.translating?"…":m.translation?"Translated":"Translate"}</button>
                </div>
              )}
            </div>
          </div>
        ))}
        {streaming && msgs.length>0 && msgs[msgs.length-1]?.who!=="ai" && (
          <div style={{display:"flex",alignItems:"center",gap:6,color:C.muted,fontSize:12,paddingLeft:4}}><span style={{width:6,height:6,borderRadius:"50%",background:C.accent,animation:"pulse 1s infinite"}}/>Tutor is typing…</div>
        )}
      </div>

      {/* Errors / listening */}
      {errMsg && <div style={{margin:"0 14px 8px",background:C.red+"12",border:`1px solid ${C.red}30`,borderRadius:10,padding:"8px 12px",color:C.red,fontSize:12}}>{errMsg}</div>}
      {listening && <div style={{margin:"0 14px 8px",display:"flex",alignItems:"center",justifyContent:"center",gap:8,color:C.red,fontSize:12.5,fontWeight:600}}><span style={{width:9,height:9,borderRadius:"50%",background:C.red,boxShadow:`0 0 0 4px ${C.red}25`}}/>Listening — speak in {tName}…</div>}

      {/* Input bar */}
      <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 12px max(12px, env(safe-area-inset-bottom))",borderTop:`1px solid ${C.line}`,background:C.surf,flexShrink:0}}>
        <button onClick={toggleVoice} title={hasSR?"Hands-free voice mode":"Voice needs Chrome or Safari"}
          style={{width:42,height:42,borderRadius:12,flexShrink:0,border:`1px solid ${voiceOn?C.accent:C.line}`,background: voiceOn?C.accent:C.surf2,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",opacity:hasSR?1:.5}}>
          <Icon name="mic" size={18} color={voiceOn?"#fff":C.text}/>
        </button>
        <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); sendText(); } }}
          placeholder={`Reply in ${tName}…`} disabled={streaming}
          style={{flex:1,minWidth:0,padding:"11px 14px",borderRadius:12,border:`1px solid ${C.line}`,background:C.bg,color:C.text,fontSize:15,fontFamily:"inherit",outline:"none"}}/>
        <button onClick={()=>sendText()} disabled={streaming||!input.trim()}
          style={{width:42,height:42,borderRadius:12,flexShrink:0,border:"none",background: (streaming||!input.trim())?C.line:GRAD,display:"flex",alignItems:"center",justifyContent:"center",cursor:(streaming||!input.trim())?"default":"pointer"}}>
          <Icon name="arrow-up" size={18} color="#fff"/>
        </button>
      </div>
    </div>
  );
}

// ─── TEXT ANALYZER ─────────────────────────────────────────────────────────────
function TextAnalyzer({ tLang, rLangs, nativeLang }) {
  const [text,     setText]     = useState("");
  const [analysis, setAnalysis] = useState(null);
  const [loading,  setLoading]  = useState(false);
  const [err,      setErr]      = useState("");
  const [openWord, setOpenWord] = useState(null);

  const tName   = TARGETS[tLang]?.name || "French";
  const refName = rLangs[0] ? (TARGETS[rLangs[0]]?.name || "English") : "English";

  const analyze = async () => {
    if (!text.trim()) return;
    if (!isLoggedIn()) { window.dispatchEvent(new CustomEvent("show-upgrade")); return; }
    setLoading(true); setErr(""); setAnalysis(null);
    try {
      const prompt = `You are a ${tName} language expert. A learner who speaks ${refName} pasted this text:\n\n"${text.slice(0,600)}"\n\nAnalyze it deeply. Return JSON:\n{"language":"${tName} or note if different","translation":"natural ${refName} translation","summary":"what this is in 1 sentence","difficulty":"A1/A2/B1/B2/C1/C2","words":[{"word":"target word or phrase","meaning":"${refName} meaning","grammar":"part of speech and grammatical form explanation","ref":"how this relates to ${refName} — cognate? false friend? no equivalent?"}],"grammar_points":[{"pattern":"grammar structure used","explanation":"what it is and how it works — 2-3 sentences","example":"new example using the same structure"}],"tip":"one cultural or linguistic insight"}`;
      const res = await askClaude(prompt, 900, tLang, nativeLang);
      setAnalysis(res);
    } catch(e) {
      setErr("Could not analyze. Check your connection and try again.");
    }
    setLoading(false);
  };

  const diffColor = { A1:C.green, A2:C.green, B1:C.accent, B2:C.accent, C1:C.red, C2:C.red };
  const diffLabel = { A1:"Beginner", A2:"Elementary", B1:"Intermediate", B2:"Upper-Intermediate", C1:"Advanced", C2:"Mastery" };

  return (
    <div style={{padding:"16px 16px 24px",overflowY:"auto",flex:1}}>
      <div style={{fontWeight:800,fontSize:18,color:C.text,marginBottom:4}}>Analyze any {tName} text</div>
      <div style={{color:C.muted,fontSize:12.5,lineHeight:1.6,marginBottom:16}}>Paste lyrics, a menu, a message, subtitles — anything in {tName}. Get an instant breakdown of the vocabulary and grammar.</div>

      <textarea
        value={text}
        onChange={e => setText(e.target.value)}
        placeholder={`Paste any ${tName} text here…`}
        rows={5}
        style={{width:"100%",padding:"12px 14px",borderRadius:11,border:`2px solid ${text ? C.accent : C.line}`,fontSize:14,background:C.surf,color:C.text,resize:"none",boxSizing:"border-box",fontFamily:"inherit",lineHeight:1.55,outline:"none",transition:"border .15s"}}
      />
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8,marginBottom:16}}>
        <span style={{fontSize:11,color:C.muted}}>{text.length}/600 characters</span>
        <button onClick={analyze} disabled={!text.trim() || loading} style={{padding:"10px 22px",background:text.trim() && !loading ? GRAD : C.surf2,color:text.trim() && !loading ? "#fff" : C.muted,border:"none",borderRadius:10,fontWeight:700,fontSize:13,cursor:text.trim() && !loading ? "pointer":"default",fontFamily:"inherit",transition:"all .15s"}}>
          {loading ? "Analyzing…" : "Analyze →"}
        </button>
      </div>

      {err && <div style={{background:C.red+"12",border:`1px solid ${C.red}30`,borderRadius:9,padding:"10px 14px",color:C.red,fontSize:12.5,marginBottom:16}}>{err}</div>}

      {analysis && (
        <div>
          {/* Header */}
          <div style={{background:C.surf,border:`1px solid ${C.line}`,borderRadius:13,padding:"13px 15px",marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,gap:10}}>
              <div style={{fontWeight:700,fontSize:14,color:C.text,flex:1}}>{analysis.summary}</div>
              {analysis.difficulty && <span style={{background:(diffColor[analysis.difficulty]||C.accent)+"15",color:diffColor[analysis.difficulty]||C.accent,border:`1px solid ${(diffColor[analysis.difficulty]||C.accent)}30`,borderRadius:20,padding:"2px 10px",fontSize:10,fontWeight:700,flexShrink:0}}>{analysis.difficulty} · {diffLabel[analysis.difficulty]||""}</span>}
            </div>
            <div style={{fontStyle:"italic",color:C.muted,fontSize:12.5,lineHeight:1.6,borderTop:`1px solid ${C.line}`,paddingTop:8}}>{analysis.translation}</div>

          {/* Key words */}
          {analysis.words?.length > 0 && (
            <div style={{marginBottom:14}}>
              <div style={{fontWeight:700,fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Key words & phrases</div>
              {analysis.words.map((w,i) => (
                <div key={i} style={{background:C.surf,border:`1px solid ${openWord===i ? C.accent : C.line}`,borderRadius:11,marginBottom:8,overflow:"hidden"}}>
                  <div onClick={() => setOpenWord(openWord===i ? null : i)} style={{padding:"10px 13px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                    <div style={{flex:1}}>
                      <span style={{fontWeight:800,color:C.accent,fontSize:15}}>{w.word}</span>
                      <span style={{color:C.muted,fontSize:12,marginLeft:8}}>{w.meaning}</span>
                    </div>
                    <PlayBtn text={w.word} sm/>
                    <span style={{color:openWord===i?C.accent:C.muted,fontSize:16,fontWeight:700,flexShrink:0}}>{openWord===i?"−":"+"}</span>
                  </div>
                  {openWord===i && (
                    <div style={{padding:"0 13px 12px",borderTop:`1px solid ${C.line}`}}>
                      {w.grammar && <div style={{marginTop:8,fontSize:12.5,color:C.text,lineHeight:1.5}}><span style={{fontWeight:700,color:C.muted,fontSize:10,textTransform:"uppercase",letterSpacing:.8}}>Grammar · </span>{w.grammar}</div>}
                      {w.ref && <div style={{marginTop:6,fontSize:12,color:C.muted,lineHeight:1.5}}><span style={{fontWeight:700,fontSize:10,textTransform:"uppercase",letterSpacing:.8}}>vs {refName} · </span>{w.ref}</div>}
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}

          {/* Grammar points */}
          {analysis.grammar_points?.length > 0 && (
            <div style={{marginBottom:14}}>
              <div style={{fontWeight:700,fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Grammar patterns used</div>

                <div key={i} style={{background:C.surf,border:`1px solid ${C.line}`,borderRadius:11,padding:"11px 13px",marginBottom:8}}>
                  <div style={{fontWeight:800,color:C.accent,fontSize:13,fontFamily:"monospace",marginBottom:5}}>{g.pattern}</div>
                  <div style={{fontSize:12.5,color:C.text,lineHeight:1.55,marginBottom:6}}>{g.explanation}</div>

          {/* Tip */}
          {analysis.tip && (
            <div style={{background:C.surf2,border:`1px solid ${C.line}`,borderLeft:`3px solid ${C.faint}`,borderRadius:9,padding:"10px 13px"}}>

              <div style={{fontSize:12.5,color:C.text,lineHeight:1.55}}>{analysis.tip}</div>

          <button onClick={() => { setAnalysis(null); setText(""); }} style={{width:"100%",marginTop:14,padding:12,background:C.surf2,border:`1px solid ${C.line}`,borderRadius:11,fontWeight:600,fontSize:13,color:C.text,cursor:"pointer",fontFamily:"inherit"}}>

          </button>
        </div>
      )}
    </div>
  );
}

// ─── SHARE CARD MODAL ──────────────────────────────────────────────────────────
function ShareCardModal({ word, meaning, example, lang, onClose }) {
  const canvasRef = useRef(null);
  const tName = TARGETS[lang]?.name || "French";
  const flag  = TARGETS[lang]?.flag  || "";

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = 1080, H = 1080;
    canvas.width = W; canvas.height = H;

    // Background gradient
    const gr = ctx.createLinearGradient(0, 0, W, H);
    gr.addColorStop(0, "#FF5F7E"); gr.addColorStop(1, "#C0153E");
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

    // Noise texture overlay
    for (let i = 0; i < 4000; i++) {
      ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.025})`;
      ctx.fillRect(Math.random() * W, Math.random() * H, 1, 1);
    }

    // Top badge
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    ctx.beginPath(); ctx.roundRect(60, 60, 240, 56, 28); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "bold 26px 'Space Grotesk', system-ui, sans-serif";
    ctx.fillText("Tongue · Speak Every Tongue", 80, 97);

    // Flag
    ctx.font = "90px serif"; ctx.fillText(flag, 60, 260);

    // Language label
    ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = "600 32px 'Space Grotesk', system-ui, sans-serif";
    ctx.fillText(tName.toUpperCase(), 60, 310);

    // Word
    const wordText = (word || "").slice(0, 40);
    ctx.fillStyle = "#fff"; ctx.font = "800 88px 'Space Grotesk', system-ui, sans-serif";
    const words = wordText.split(" ");
    let line = "", y = 440;
    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > 960 && line) {
        ctx.fillText(line, 60, y); line = w; y += 100;
      } else line = test;
    }
    if (line) ctx.fillText(line, 60, y);

    // Meaning
    ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.font = "600 44px 'Space Grotesk', system-ui, sans-serif";
    y += 70; ctx.fillText((meaning || "").slice(0, 50), 60, y);

    // Example sentence
    if (example) {
      ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.font = "400 32px 'Space Grotesk', system-ui, sans-serif";
      y += 70;
      const ex = example.slice(0, 60);
      const exWords = ex.split(" ");
      let exLine = ""; let ey = y;
      for (const w of exWords) {
        const test = exLine ? exLine + " " + w : w;
        if (ctx.measureText(test).width > 960 && exLine) {
          ctx.fillText(exLine, 60, ey); exLine = w; ey += 46;
        } else exLine = test;
      }
      if (exLine) ctx.fillText(exLine, 60, ey);
    }

    // Divider
    ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(60, 920); ctx.lineTo(W-60, 920); ctx.stroke();

    // URL
    ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.font = "500 28px 'Space Grotesk', system-ui, sans-serif";
    ctx.fillText("tonge-app.fly.dev · free to use", 60, 970);
  }, [word, meaning, example, lang]);

  const download = () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const a = document.createElement("a");
    a.download = `tongue-${(word||"word").replace(/\s+/g,"-").slice(0,20)}.png`;
    a.href = canvas.toDataURL("image/png");
    a.click();
  };

  const share = async () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    if (navigator.share && navigator.canShare) {
      canvas.toBlob(async (blob) => {
        if (!blob) { download(); return; }
        const file = new File([blob], "tongue-word.png", { type:"image/png" });
        if (navigator.canShare({ files:[file] })) {
          try { await navigator.share({ files:[file], title:"I learned a new word!", text:`${word} — ${meaning}` }); return; }
          catch(e) {}
        }
        download();
      }, "image/png");
    } else download();
  };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:999,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{background:C.surf,borderRadius:20,padding:"16px 16px 20px",width:"100%",maxWidth:380,maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontWeight:800,fontSize:16,color:C.text}}>Share your progress</div>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:22,color:C.muted,lineHeight:1}}>×</button>
        </div>
        <canvas ref={canvasRef} style={{width:"100%",borderRadius:12,display:"block",marginBottom:14}}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <button onClick={share} style={{padding:"12px 0",background:GRAD,color:"#fff",border:"none",borderRadius:11,fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>
            <Icon name="share-2" size={15} color="#fff"/> Share
          </button>
          <button onClick={download} style={{padding:"12px 0",background:C.surf2,border:`1px solid ${C.line}`,borderRadius:11,fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",color:C.text,display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>
            <Icon name="download" size={15}/> Download
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const mobile = useMobile();
  const isDesktop = useDesktop();
  // ── new IA navigation ──────────────────────────────────────────────────────
  const [view, setView]             = useState("explore");
  const [stack, setStack]           = useState([]);
  const [dark, setDark]             = useState(() => {
    try {
      const saved = localStorage.getItem("_dark") === "1";
      // Apply immediately so first render reads correct CSS vars
      if (saved) document.documentElement.classList.add("dark-theme");
      return saved;
    } catch(e) { return false; }
  });
  const [themeIdx, setThemeIdx]     = useState(0);
  const [factIdx, setFactIdx]       = useState(0);
  // ── auth / plan ────────────────────────────────────────────────────────────
  const [tLang, setTLang]           = useState(() => { try { return localStorage.getItem("target_lang") || "fr"; } catch(e) { return "fr"; } });
  const [nativeLang, setNativeLang] = useState(() => _nativeLang);
  // Explanations/comparisons are given in the learner's own language — keep the
  // reference language in lockstep with nativeLang (was hardcoded to English).
  const [rLangs, setRLangs]         = useState(() => [_nativeLang]);
  const [overlay, setOverlay]       = useState(null); // "lang"|"settings"|"upgrade"|null
  const [loggedIn, setLoggedIn]     = useState(isLoggedIn());
  // If the session lapsed but we remembered the code — or the user arrived via a
  // magic login link (?magic=…) — silently sign them in before showing the gate.
  const [authChecking, setAuthChecking] = useState(() => {
    try {
      if (isLoggedIn()) return false;
      const hasMagic = new URLSearchParams(window.location.search).has("magic");
      return hasMagic || !!localStorage.getItem("tongue_code");
    } catch(e) { return false; }
  });
  const [magicError, setMagicError] = useState("");
  const [renewedBanner, setRenewedBanner] = useState(false);
  const [showOnboarding, setShowOnboarding] = useState(() => {
    try { return localStorage.getItem("_new_login") === "1"; } catch(e) { return false; }
  });
  const [isFree, setIsFree]         = useState(getUserPlan() === "free");
  const [expiryWarning, setExpiryWarning] = useState(() => {
    if (!_authExpiry) return null;
    const days = Math.floor((new Date(_authExpiry) - new Date()) / 86400000);
    return (days >= 0 && days <= 3) ? days : null;
  });
  const [streak, setStreak] = useState(() => _streak.get().count);
  const [userLevel, setUserLevel] = useState(() => { try { return localStorage.getItem("user_level") || ""; } catch(e) { return ""; } });

  // ── event listeners (unchanged) ──────────────────────────────────────────
  useEffect(() => {
    const handler = () => { setLoggedIn(false); setRenewedBanner(true); };
    window.addEventListener("session-renewed", handler);
    return () => window.removeEventListener("session-renewed", handler);
  }, []);

  useEffect(() => {
    const handler = (e) => setStreak(e.detail?.count ?? _streak.get().count);
    window.addEventListener("streak-updated", handler);
    return () => window.removeEventListener("streak-updated", handler);
  }, []);

  useEffect(() => {
    const handler = () => setOverlay("upgrade");
    window.addEventListener("show-upgrade", handler);
    return () => window.removeEventListener("show-upgrade", handler);
  }, []);

  // Magic-link login: arrived via ?magic=TOKEN → exchange it for a session.
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const magic = params.get("magic");
    if (!magic || isLoggedIn()) return;
    let cancelled = false;
    (async () => {
      try {
        const res = await fetch("/api/auth/magic-link/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: magic }),
        });
        const data = await res.json();
        if (res.ok && data.token) {
          saveSession(data.token, data.expiresAt, data.email, data.plan);
          try { if (!localStorage.getItem("_seen_onboard")) localStorage.setItem("_new_login","1"); } catch(e){}
          if (!cancelled) { setShowOnboarding((()=>{try{return localStorage.getItem("_new_login")==="1";}catch(e){return false;}})()); setLoggedIn(true); }
        } else if (!cancelled) {
          setMagicError(data.error || "This login link is invalid or has expired. Please request a new one.");
        }
      } catch(e) { if (!cancelled) setMagicError("Connection error. Please try again."); }
      // Strip ?magic from the URL so a refresh can't replay a spent link.
      try { params.delete("magic"); const q = params.toString(); window.history.replaceState({}, "", window.location.pathname + (q ? "?"+q : "")); } catch(e){}
      if (!cancelled) setAuthChecking(false);
    })();
    return () => { cancelled = true; };
  }, []);

  // Silent auto-login: session lapsed but code remembered → sign back in
  useEffect(() => {
    if (!authChecking) return;
    // A magic link is present → let the magic-link effect own the sign-in.
    if (new URLSearchParams(window.location.search).has("magic")) return;
    let cancelled = false;
    (async () => {
      let savedCode = "";
      try { savedCode = localStorage.getItem("tongue_code") || ""; } catch(e) {}
      if (!savedCode) { if (!cancelled) setAuthChecking(false); return; }
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: savedCode.trim().toUpperCase() }),
        });
        const data = await res.json();
        if (res.ok && data.token) {
          saveSession(data.token, data.expiresAt, data.email, data.plan);
          if (!cancelled) setLoggedIn(true);
        } else {
          // Code no longer valid (renewed/revoked) — drop it and show login.
          try { localStorage.removeItem("tongue_code"); } catch(e) {}
        }
      } catch(e) { /* offline — fall through to the login screen */ }
      if (!cancelled) setAuthChecking(false);
    })();
    return () => { cancelled = true; };
  }, [authChecking]);

  // Validate token on startup
  useEffect(() => {
    if (!isLoggedIn()) return;
    fetch("/api/auth/validate", { headers: { "Authorization": "Bearer " + getToken() } })
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (!d || !d.valid) return;
        if (d.plan && d.plan !== getUserPlan()) {
          try { localStorage.setItem("auth_plan", d.plan); _userPlan = d.plan; } catch(_) {}
          setIsFree(d.plan === "free");
        }
        // Restore the learner's stored profile so level + language follow the account.
        if (d.userLevel) {
          setUserLevel(d.userLevel);
          try { localStorage.setItem("user_level", d.userLevel); } catch(_) {}
        }
        if (d.targetLang && TARGETS[d.targetLang] && d.targetLang !== tLang) {
          setTLang(d.targetLang);
          try { localStorage.setItem("target_lang", d.targetLang); } catch(_) {}
        }
        if (d.needsRelogin) window.dispatchEvent(new CustomEvent("show-upgrade", { detail: { upgraded: true } }));
      })
      .catch(() => {});
  }, []);

  // The bottom nav dock only renders on the mobile home screen; flag it on <body>
  // so the support button lifts above it there and stays low everywhere else.
  useEffect(() => {
    const hasDock = view === "explore" && !isDesktop;
    document.body.classList.toggle("has-bottom-dock", hasDock);
    return () => document.body.classList.remove("has-bottom-dock");
  }, [view, isDesktop]);

  useEffect(() => {
    loadVoices();
    const s = synth();
    if (s && s.addEventListener) {
      s.addEventListener("voiceschanged", loadVoices);
      return () => { try { s.removeEventListener("voiceschanged", loadVoices); } catch(e){} };
    }
    const interval = setInterval(loadVoices, 250);
    setTimeout(() => clearInterval(interval), 3000);
    return () => clearInterval(interval);
  }, []);

  useEffect(() => {
    _nativeLang = nativeLang;
    try { localStorage.setItem("native_lang", nativeLang); } catch(e) {}
    setRLangs([nativeLang]);
  }, [nativeLang]);

  useEffect(() => {
    try { localStorage.setItem("target_lang", tLang); } catch(e) {}
    activeLang  = TARGETS[tLang]?.tts || "fr-FR";
    activeVoice = "";
  }, [tLang]);

  // Persist dark preference (class is applied synchronously in toggleDark below)
  useEffect(() => {
    try { localStorage.setItem("_dark", dark ? "1" : "0"); } catch(e) {}
  }, [dark]);

  // ── navigation helpers ────────────────────────────────────────────────────
  // Views worth resuming, with the label shown on the Home "Continue" card.
  const RESUMABLE = {
    grammar:"Grammar", "grammar-full":"Grammar reference", concept:"Grammar", coach:"Coach",
    "voice-tutor":"Conversation", dialogues:"Dialogues", drills:"Drills", "vocab-full":"Vocabulary",
    structures:"Sentence patterns", sounds:"Sounds", culture:"Culture & nuance", roadmap:"Roadmap",
    wordspace:"Word Space", analyzer:"Text analyzer", cards:"Flashcards", review:"Review", today:"Today's practice",
  };
  const nav = (v) => {
    const ns = makeNavState(v, view, stack);
    setView(ns.view);
    setStack(ns.stack);
    if (RESUMABLE[ns.view]) {
      try { localStorage.setItem("tongue_last", JSON.stringify({ view: ns.view, label: RESUMABLE[ns.view] })); } catch(e){}
    }
  };
  const goBack = () => {
    const bs = makeBackState(stack);
    setView(bs.view);
    setStack(bs.stack);
  };

  // ── language data ─────────────────────────────────────────────────────────
  const L = LANGS_DATA[tLang] || LANGS_DATA.fr;

  if (!loggedIn && authChecking) {
    return (
      <div style={{fontFamily:"system-ui,-apple-system,sans-serif",background:"#f1f5f9",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
        <img src="/icon.svg" alt="Tongue" style={{width:64,height:64}}/>
        <div style={{width:26,height:26,border:"3px solid #e2e8f0",borderTopColor:"#C0153E",borderRadius:"50%",animation:"spin .7s linear infinite"}}/>
        <div style={{color:"#64748b",fontSize:13,fontWeight:600}}>Signing you in…</div>
      </div>
    );
  }
  if (!loggedIn) return <AccessCodeLogin onLogin={() => setLoggedIn(true)} renewedBanner={renewedBanner} magicError={magicError} />;

  if (showOnboarding) {
    return (
      <NewOnboarding
        onSetLang={(code) => { setTLang(code); try { localStorage.setItem("target_lang", code); } catch(e){} }}
        onDone={() => {
          try { localStorage.removeItem("_new_login"); localStorage.setItem("_seen_onboard","1"); } catch(e){}
          setShowOnboarding(false);
        }}
      />
    );
  }

  const toggleDark = () => {
    // Apply class synchronously so the next render reads updated CSS vars
    const next = !dark;
    if (next) document.documentElement.classList.add("dark-theme");
    else document.documentElement.classList.remove("dark-theme");
    setDark(next);
  };
  const setNativeLangAndPersist = (code) => {
    setNativeLang(code); _nativeLang = code;
    try { localStorage.setItem("native_lang", code); } catch(e) {}
  };

  // Shorthand for wrapping old components with a back-btn header
  const wrap = (title, subtitle, content, noPad) => (
    <WrappedScreen title={title} subtitle={subtitle} goBack={goBack} noPad={noPad}>
      {content}
    </WrappedScreen>
  );

  const appBody = (
    <div style={{fontFamily:"'Space Grotesk',system-ui,sans-serif",background:C.bg,color:C.text,maxWidth:520,margin:"0 auto",display:"flex",flexDirection:"column",height:"100dvh",overflow:"hidden"}} className={"app-shell" + (isDesktop ? " app-shell-in-stage" : "")}>

      {/* ── EXPIRY BANNER ── */}
      {expiryWarning !== null && (
        <div style={{background:"#fef9c3",padding:"7px 14px",fontSize:12,color:"#92400e",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexShrink:0}}>
          <span>{expiryWarning === 0 ? t("expires_today") : expiryWarning === 1 ? t("expires_tomorrow") : t("expires_days", {n:expiryWarning})}</span>
          <button onClick={() => setExpiryWarning(null)} style={{background:"none",border:"none",cursor:"pointer",color:"#92400e",fontWeight:900,fontSize:18,flexShrink:0,lineHeight:1}}>×</button>
        </div>
      )}

      {/* ── FREE TIER BANNER ── */}
      {isFree && (
        <div style={{background:GRAD,padding:"6px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexShrink:0}}>
          <span style={{color:"#fff",fontSize:11.5,fontWeight:600}}>{t("free_banner")}</span>
          <a href="/subscribe" style={{display:"inline-block",padding:"4px 11px",background:"#fff",color:"#C0153E",borderRadius:7,fontSize:11,fontWeight:800,textDecoration:"none",flexShrink:0}}>{t("upgrade")}</a>
        </div>
      )}

      {/* ── MAIN SCREEN AREA ── */}
      <div key={view} className="scr-anim" style={{flex:1,minHeight:0,display:"flex",flexDirection:"column",overflow:"hidden"}}>

        {/* ── EXPLORE (home) ── */}
        {view === "explore" && (
          <ExploreHome
            L={L} nav={nav} dark={dark} factIdx={factIdx} streak={streak}
            isDesktop={isDesktop} userLevel={userLevel}
            onNextFact={() => setFactIdx(i => i+1)}
            onOpenSettings={() => setOverlay("settings")}
            onOpenLang={() => setOverlay("lang")}
            onToggleDark={toggleDark}
          />
        )}

        {/* ── AI COACH ── */}
        {view === "coach" && wrap(t("nav_coach"), t("wrap_coach_sub"), <AICoach tLang={tLang} rLangs={rLangs} nativeLang={nativeLang}/>, true)}

        {/* ── GRAMMAR (new index) ── */}
        {view === "grammar" && <GrammarScreen L={L} nav={nav} goBack={goBack}/>}

        {/* ── GRAMMAR FULL (old component, all langs) ── */}
        {view === "grammar-full" && wrap(t("nav_grammar"), t("wrap_grammar_sub"), <Grammar tLang={tLang} rLangs={rLangs}/>)}

        {/* ── CONCEPT DEEP DIVE ── */}
        {view === "concept" && <ConceptScreen L={L} nav={nav} goBack={goBack}/>}

        {/* ── VOCAB THEMES (new IA entry) ── */}
        {view === "vocabThemes" && <VocabThemesScreen L={L} nav={nav} goBack={goBack} onThemePick={setThemeIdx}/>}

        {/* ── VOCAB WORDS (new IA detail) ── */}
        {view === "vocabWords" && <VocabWordsScreen L={L} themeIdx={themeIdx} nav={nav} goBack={goBack}/>}

        {/* ── VOCAB FULL (old component, all langs) ── */}
        {view === "vocab-full" && wrap(t("nav_vocab"), t("wrap_vocab_sub"), <Vocab tLang={tLang} rLangs={rLangs}/>)}

        {/* ── PHRASES (new IA French-rich screen) ── */}
        {view === "phrases" && <PhrasesScreen L={L} nav={nav} goBack={goBack}/>}

        {/* ── DIALOGUES (old component, all langs) ── */}
        {view === "dialogues" && wrap(t("nav_dialogues"), t("wrap_dialogues_sub"), <Dialogues tLang={tLang}/>)}

        {/* ── SOUNDS ── */}
        {view === "sounds" && <SoundsScreen L={L} goBack={goBack}/>}

        {/* ── CULTURE ── */}
        {view === "culture" && <CultureScreen L={L} goBack={goBack}/>}

        {/* ── FLASHCARDS ── */}
        {view === "cards" && wrap(t("nav_flashcards"), t("wrap_flashcards_sub"),
          <Flashcards tLang={tLang} onStreakUpdate={() => setStreak(_streak.get().count)}/>, true)}

        {/* ── DRILLS ── */}
        {view === "drills" && wrap(t("nav_drills"), t("wrap_drills_sub"), <Drills tLang={tLang}/>)}

        {/* ── STRUCTURES ── */}
        {view === "structures" && wrap(t("nav_structures"), t("wrap_structures_sub"), <Structures tLang={tLang} rLangs={rLangs}/>)}

        {/* ── WORD SPACE ── */}
        {view === "wordspace" && wrap(t("nav_wordspace"), t("wrap_wordspace_sub"), <WordSpace tLang={tLang} rLangs={rLangs}/>, true)}

        {/* ── ROADMAP ── */}
        {view === "roadmap" && wrap(t("nav_roadmap"), t("wrap_roadmap_sub"), <Roadmap tLang={tLang}/>)}

        {/* ── VOICE TUTOR ── */}
        {view === "voice-tutor" && wrap(t("nav_conversation"), t("wrap_conversation_sub"), <Conversation tLang={tLang} rLangs={rLangs} nativeLang={nativeLang}/>, true)}

        {/* ── TEXT ANALYZER ── */}
        {view === "analyzer" && wrap(t("nav_analyzer"), t("wrap_analyzer_sub"), <TextAnalyzer tLang={tLang} rLangs={rLangs} nativeLang={nativeLang}/>, true)}

        {/* ── TODAY'S PRACTICE ── */}
        {view === "today" && wrap(t("nav_today"), t("wrap_today_sub"),
          <div>
            <TodaysPractice tLang={tLang} onGoToTab={(i) => {
              // Map old tab indices to new views
              const tabMap = {0:"grammar-full",1:"coach",2:"grammar-full",3:"structures",4:"vocab-full",5:"drills",6:"dialogues",7:"roadmap",8:"wordspace",9:"cards"};
              if (tabMap[i]) nav(tabMap[i]);
            }}/>
            <CheatSheet tLang={tLang} rLangs={rLangs}/>
          </div>
        )}

        {/* ── REVIEW ── */}
        {view === "review" && <ReviewScreen nav={nav} goBack={goBack} tLang={tLang}/>}

      </div>

      {/* ── OVERLAYS ── */}
      {overlay === "lang" && (
        <LangSwitchOverlay
          current={tLang}
          onPick={(code) => {
            setTLang(code); setView("explore"); setStack([]);
            try { localStorage.setItem("target_lang", code); } catch(_) {}
            // Persist to the account so the choice follows the user across devices
            if (isLoggedIn()) {
              fetch("/api/auth/preferences", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() },
                body: JSON.stringify({ language: code }),
              }).catch(() => {});
            }
          }}
          onClose={() => setOverlay(null)}
        />
      )}
      {overlay === "settings" && (
        <SettingsOverlay
          onClose={() => setOverlay(null)}
          onLogout={() => {
            try { logout(); } catch(e) {}
            try { localStorage.removeItem("tongue_code"); } catch(e) {}
            setAuthChecking(false); setLoggedIn(false); setOverlay(null);
          }}
          nativeLang={nativeLang}
          onSetNativeLang={setNativeLangAndPersist}
          isFree={isFree}
          onOpenVoice={() => setOverlay("voice")}
          dark={dark}
          onToggleDark={toggleDark}
        />
      )}
      {overlay === "voice" && <VoicePanel tLang={tLang} onClose={() => setOverlay(null)}/>}
      {overlay === "upgrade" && <UpgradeOverlay onClose={() => setOverlay(null)}/>}

      <SupportChat />
    </div>
  );

  if (isDesktop) {
    return (
      <div className="desktop-stage">
        <DesktopNav
          L={L} view={view} nav={nav} dark={dark}
          onToggleDark={toggleDark}
          onOpenLang={() => setOverlay("lang")}
          onOpenSettings={() => setOverlay("settings")}
          isFree={isFree}
        />
        {appBody}
      </div>
    );
  }
  return appBody;
}

// ─── SUPPORT CHAT ─────────────────────────────────────────────────────────────
function SupportChat() {
  const [open, setOpen]       = useState(false);
  const [msgs, setMsgs]       = useState([
    { role:"bot", text: t("support_greeting") }
  ]);
  const [input, setInput]     = useState("");
  const [loading, setLoading] = useState(false);
  const [dismissed, setDismissed] = useState(() => { try { return sessionStorage.getItem("support_hidden") === "1"; } catch(e) { return false; } });
  const bottomRef             = React.useRef(null);

  useEffect(() => {
    if (open && bottomRef.current) bottomRef.current.scrollIntoView({ behavior:"smooth" });
  }, [msgs, open]);

  // Haptic feedback on supported devices
  const haptic = () => {
    try { if (window.Capacitor?.Plugins?.Haptics) window.Capacitor.Plugins.Haptics.impact({ style:"light" }); } catch(_){}
    try { if (navigator.vibrate) navigator.vibrate(8); } catch(_){}
  };

  const send = async () => {
    const q = input.trim();
    if (!q || loading) return;
    haptic();
    setInput("");
    setMsgs(prev => [...prev, { role:"user", text:q }]);
    setLoading(true);
    try {
      const res  = await fetch("/api/support", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ question:q }),
      });
      const data = await res.json();
      setMsgs(prev => [...prev, { role:"bot", text: data.answer || data.error || "Sorry, I couldn't get an answer right now." }]);
    } catch(_) {
      setMsgs(prev => [...prev, { role:"bot", text:"Connection issue. Please try again." }]);
    }
    setLoading(false);
  };

  return (
    <>
      {/* Floating button (dismissible so it never blocks the flow) */}
      {!dismissed && !open && (
        <div
          className="support-fab"
          onClick={() => { haptic(); setOpen(true); }}
          role="button"
          aria-label="Help"
          title="Help & Support"
        >
          <Icon name="message-circle" size={22} color="#fff" />
          <span
            onClick={(e) => { e.stopPropagation(); setDismissed(true); try { sessionStorage.setItem("support_hidden", "1"); } catch(_) {} }}
            aria-label="Hide"
            style={{ position:"absolute", top:-5, right:-5, width:20, height:20, borderRadius:"50%", background:C.surf, color:C.text, border:`1px solid ${C.line}`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, lineHeight:1, boxShadow:"0 1px 5px rgba(0,0,0,.25)" }}
          >×</span>
        </div>
      )}

      {/* Bottom sheet */}
      <div className={`sheet-backdrop${open ? " open" : ""}`} onClick={() => setOpen(false)}>
        <div className="sheet" onClick={e => e.stopPropagation()} style={{ display:"flex", flexDirection:"column", height:"70vh" }}>
          <div className="sheet-handle"/>
          {/* Header */}
          <div style={{ padding:"14px 18px 10px", borderBottom:"1px solid #f1f5f9", display:"flex", justifyContent:"space-between", alignItems:"center", flexShrink:0 }}>
            <div>
              <div style={{ fontWeight:900, fontSize:15, color:"#0f172a" }}>{t("support_title")}</div>
              <div style={{ fontSize:11, color:"#64748b", marginTop:2 }}>{t("support_subtitle")}</div>
            </div>
            <button onClick={() => setOpen(false)} style={{ background:"#f1f5f9", border:"none", borderRadius:8, width:30, height:30, fontSize:16, color:"#64748b", display:"flex", alignItems:"center", justifyContent:"center" }}>×</button>
          </div>

          {/* Messages */}
          <div style={{ flex:1, overflowY:"auto", padding:"14px 16px", display:"flex", flexDirection:"column", gap:10 }}>
            {msgs.map((m, i) => (
              <div key={i} style={{ display:"flex", justifyContent: m.role==="user" ? "flex-end" : "flex-start" }}>
                <div style={{
                  maxWidth:"82%", padding:"10px 13px", borderRadius: m.role==="user" ? "16px 16px 4px 16px" : "16px 16px 16px 4px",
                  background: m.role==="user" ? "#C0153E" : "#f1f5f9",
                  color: m.role==="user" ? "#fff" : "#0f172a",
                  fontSize:13, lineHeight:1.55,
                }}>
                  {m.text}
                </div>
              </div>
            ))}
            {loading && (
              <div style={{ display:"flex", justifyContent:"flex-start" }}>
                <div style={{ background:"#f1f5f9", borderRadius:"16px 16px 16px 4px", padding:"10px 16px", fontSize:18, color:"#94a3b8" }}>•••</div>
              </div>
            )}
            <div ref={bottomRef}/>
          </div>

          {/* Input */}
          <div style={{ padding:"10px 14px", borderTop:"1px solid #f1f5f9", display:"flex", gap:8, flexShrink:0, paddingBottom:"max(10px,env(safe-area-inset-bottom))" }}>
            <input
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key==="Enter" && send()}
              placeholder={t("support_placeholder")}
              style={{ flex:1, padding:"10px 14px", borderRadius:22, border:"1.5px solid #e2e8f0", fontSize:15, outline:"none", background:"#f8fafc" }}
            />
            <button
              onClick={send}
              disabled={!input.trim() || loading}
              style={{ background:"#C0153E", color:"#fff", border:"none", borderRadius:"50%", width:42, height:42, fontSize:18, flexShrink:0, opacity: (!input.trim()||loading) ? 0.4 : 1, display:"flex", alignItems:"center", justifyContent:"center" }}
            >↑</button>
          </div>
        </div>
      </div>
    </>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
