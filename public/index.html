// ─── VOICE PANEL ─────────────────────────────────────────────────────────────
function VoicePanel({ tLang, onClose }) {
  const [deviceVoices, setDeviceVoices] = useState([]);
  const [selected, setSelected]         = useState(activeVoice);
  const [showAll, setShowAll]           = useState(false);
  const tts   = TARGETS[tLang]?.tts || "fr-FR";
  const pfx   = tts.split("-")[0];
  const tName = TARGETS[tLang]?.name || "French";

  useEffect(() => {
    const load = () => {
      const s = synth();
      if (!s) return;
      try {
        const v = s.getVoices();
        if (v && v.length > 0) setDeviceVoices(v);
      } catch (e) {}
    };
    load();
    // voiceschanged fires on Chrome/Android; Safari populates on first call
    const s = synth();
    if (s && s.addEventListener) {
      s.addEventListener("voiceschanged", load);
      return () => { try { s.removeEventListener("voiceschanged", load); } catch(e){} };
    }
    // Safari fallback: poll until voices appear
    const interval = setInterval(() => { load(); if (deviceVoices.length > 0) clearInterval(interval); }, 200);
    setTimeout(() => clearInterval(interval), 3000);
    return () => clearInterval(interval);
  }, []);

  const langVoices  = deviceVoices.filter(v => v.lang.startsWith(pfx));
  const otherVoices = deviceVoices.filter(v => !v.lang.startsWith(pfx));
  const hasGoodVoice = langVoices.length > 0;

  const selectVoice = (name) => { setSelected(name); activeVoice = name; };

  const TEST_PHRASES = {
    fr:"Bonjour, comment allez-vous aujourd'hui?", es:"Hola, ¿cómo estás hoy?", pt:"Olá, como vai você hoje?",
    it:"Ciao, come stai oggi?", de:"Hallo, wie geht es Ihnen heute?", en:"Hello, how are you today?",
    zh:"你好，你今天怎么样？", ja:"こんにちは、今日はお元気ですか？", ko:"안녕하세요, 오늘 어떻게 지내세요?",
    ru:"Привет, как дела сегодня?", ar:"مرحباً، كيف حالك اليوم؟",
  };
  const testVoice = (name) => {
    const prev = activeVoice;
    activeVoice = name;
    say(TEST_PHRASES[pfx] || TEST_PHRASES[tLang] || "Hello, how are you today?");
    setTimeout(() => { activeVoice = prev; }, 600);
  };

  function VRow({ v }) {
    const isSelected = selected === v.name;
    return (
      <div style={{ background: isSelected ? C.blue+"12" : C.bg, border: `2px solid ${isSelected ? C.blue : C.bdr}`, borderRadius: 10, padding: "10px 13px", marginBottom: 7 }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div>
            <div style={{ fontWeight:700, color:isSelected?C.blue:C.text, fontSize:13 }}>{v.name}</div>
            <div style={{ color:C.muted, fontSize:11, marginTop:2 }}>{v.lang}{v.localService?" · On-device":""}{isSelected?" · Currently active":""}</div>
          </div>
          <div style={{ display:"flex", gap:7 }}>
            <button onPointerDown={e=>{e.preventDefault();testVoice(v.name);}} style={{ background:C.muted, border:"none", borderRadius:6, color:"#fff", padding:"4px 10px", fontSize:11, fontWeight:700, cursor:"pointer" }}>Test</button>
            <button onClick={()=>selectVoice(v.name)} style={{ background:isSelected?C.blue:C.card, border:`2px solid ${isSelected?C.blue:C.bdr}`, borderRadius:6, color:isSelected?"#fff":C.mid, padding:"4px 10px", fontSize:11, fontWeight:700, cursor:"pointer" }}>
              {isSelected?"Selected":"Select"}
            </button>
          </div>
        </div>
      </div>
    );
  }

  const [mounted2, setMounted2] = useState(false);
  useEffect(() => { requestAnimationFrame(() => setMounted2(true)); }, []);

  return (
    <div className={`sheet-backdrop${mounted2 ? " open" : ""}`} onClick={onClose} style={{zIndex:100}}>
      <div className="sheet" onClick={e=>e.stopPropagation()} style={{ background:C.card, padding:22, maxWidth:520 }}>
        <div className="sheet-handle"/>
        <div style={{ fontWeight:900, fontSize:17, color:C.text, marginBottom:5, marginTop:14 }}>Voice Settings</div>

        {hasGoodVoice && (
          <div style={{ background:C.green+"12", border:`1px solid ${C.green}30`, borderRadius:10, padding:"10px 13px", marginBottom:14 }}>
            <div style={{ fontWeight:700, color:C.green, fontSize:13 }}>{langVoices.length} {tName} voice{langVoices.length>1?"s":""} found</div>
            <div style={{ color:C.muted, fontSize:12, marginTop:2 }}>Select the one that sounds most natural. Use Test to preview.</div>
          </div>
        )}

        {!hasGoodVoice && (
          <div style={{ background:C.surf2, border:`1px solid ${C.line}`, borderRadius:10, padding:"10px 13px", marginBottom:14 }}>
            <div style={{ fontWeight:700, color:C.muted, fontSize:13 }}>{t("voice_no_match", {lang: tName})}</div>
          </div>
        )}

        <div style={{ fontWeight:700, color:C.mid, fontSize:11, textTransform:"uppercase", letterSpacing:1, marginBottom:9 }}>{t("voice_all_label")}</div>
        {(() => {
          const voiceList = hasGoodVoice ? langVoices : deviceVoices;
          const shown = showAll ? voiceList : voiceList.slice(0, 8);
          return (

}


// ─── WORD SPACE ───────────────────────────────────────────────────────────────
function WordSpace({ tLang, rLangs }) {
  const tName    = TARGETS[tLang]?.name || "French";
  const tCode    = TARGETS[tLang]?.tts  || "fr-FR";
  const refNames = rLangs.length > 0 ? rLangs.map(l => REFS[l]?.name || l).join(" and ") : "English";

  const [input,    setInput]    = useState("");
  const [result,   setResult]   = useState(null);
  const [loading,  setLoading]  = useState(false);
  const [saved,    setSaved]    = useState(() => {
    try { return JSON.parse(localStorage.getItem("ws_saved") || "[]"); } catch(e) { return []; }
  });

  // Debounced auto-translate
  useEffect(() => {
    if (!input.trim() || input.trim().length < 2) { setResult(null); return; }
    const timer = setTimeout(() => translate(input.trim()), 700);
    return () => clearTimeout(timer);
  }, [input]);

  const translate = async (text) => {
    setLoading(true);
    try {
      const prompt = `You are a ${tName} language coach for ${refNames} speakers. The user typed: "${text}". This could be in any language. Detect the language, translate to ${tName} if not already in ${tName} (and also to ${refNames} if it was in ${tName}), and provide rich learning content. Return ONLY valid JSON: {"input_lang":"language detected","input_text":"${text}","translation_fr":"translation in ${tName}","translation_ref":"translation in ${refNames}","pronunciation":"phonetic guide for the ${tName} version","literal_breakdown":[{"word":"each ${tName} word","meaning":"what it means"}],"explanation":"grammar and usage explanation — why is it structured this way in ${tName}?","ref_comparison":"how does this compare to ${refNames}? same structure? different?","examples":[{"fr":"example 1 in ${tName}","en":"English","ref":"in ${refNames}"},{"fr":"example 2","en":"English","ref":"ref"},{"fr":"example 3","en":"English","ref":"ref"},{"fr":"example 4","en":"English","ref":"ref"}],"tip":"one key thing to remember about this word or phrase"}`;
      if (!isLoggedIn()) { setResult({ error: "NO_KEY" }); setLoading(false); return; }
      const result = await askClaude(prompt, 900, tLang);
      setResult(result);
    } catch(e) {
      setResult({ error: "Could not translate. Check your connection." });
    }
    setLoading(false);
  };

  const saveEntry = () => {
    if (!result || !result.translation_fr) return;
    const entry = {
      id: Date.now(),
      input: input.trim(),
      fr: result.translation_fr,
      ref: result.translation_ref || "",
      pronunciation: result.pronunciation || "",
      date: new Date().toLocaleDateString(),
    };
    const updated = [entry, ...saved].slice(0, 100);
    setSaved(updated);
    try { localStorage.setItem("ws_saved", JSON.stringify(updated)); } catch(e) {}
  };

  const deleteEntry = (id) => {
    const updated = saved.filter(s => s.id !== id);
    setSaved(updated);
    try { localStorage.setItem("ws_saved", JSON.stringify(updated)); } catch(e) {}
  };

  return (
    <div>
      <Heading title="Translator & Word Space" sub="Type anything in any language. Get the translation, pronunciation, grammar breakdown, and real examples instantly." color={C.accent} />
      <Info text="Start typing — results appear automatically. Use this to look up words you encounter in the wild: song lyrics, menus, street signs, messages. Save useful translations to your personal log below." color={C.muted} />

      {/* Big input */}
      <div style={{ background: C.card, border: `2px solid ${C.accent}`, borderRadius: 14, overflow: "hidden", marginBottom: 12, boxShadow: C.sh }}>
        <textarea
          value={input}
          onChange={e => setInput(e.target.value)}
          placeholder={`Type anything — in ${tName}, ${refNames}, or English...`}
          rows={4}
          style={{ width: "100%", padding: "16px", border: "none", outline: "none", fontSize: 18, fontWeight: 500, resize: "none", background: "transparent", boxSizing: "border-box", color: C.text }}
        />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", borderTop: `1px solid ${C.bdr}`, background: C.soft }}>
          <div style={{ color: C.muted, fontSize: 11 }}>{loading ? t("translating") : input.trim().length > 1 ? t("auto_translating") : t("start_typing")}</div>
          <div style={{ display: "flex", gap: 8 }}>
            {input.trim() && <button onClick={() => { setInput(""); setResult(null); }} style={{ background: "none", border: `1px solid ${C.bdr}`, borderRadius: 7, padding: "4px 11px", color: C.muted, fontSize: 12, cursor: "pointer" }}>{t("clear")}</button>}
            {result && result.translation_fr && <button onClick={() => say(result.translation_fr)} style={{ background: C.blue, border: "none", borderRadius: 7, padding: "4px 11px", color: "#fff", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>{t("hear_it")}</button>}
          </div>
        </div>
      </div>

      {/* Translation result */}
      {loading && (
        <div style={{ background: C.card, borderRadius: 12, padding: "20px 16px", textAlign: "center", color: C.muted, boxShadow: C.sh, marginBottom: 12 }}>
          <div style={{ fontSize: 13 }}>{t("translating_content")}</div>
        </div>
      )}

      {!loading && result && !result.error && (
        <div>
          {/* Main translation */}
          <div style={{ background: C.card, border: `2px solid ${C.accent}30`, borderRadius: 14, padding: "16px", marginBottom: 10, boxShadow: C.sh }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
              <div style={{ flex: 1 }}>
                {result.input_lang && <div style={{ color: C.muted, fontSize: 11, marginBottom: 8 }}>Detected: {result.input_lang}</div>}
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", marginBottom: 6 }}>

                </div>
                {result.pronunciation && <div style={{ color: C.muted, fontSize: 14, fontStyle: "italic", marginBottom: 6 }}>{result.pronunciation}</div>}

                  {t("save_btn")}

              </div>
            </div>

            {/* Word breakdown */}
            {Array.isArray(result.literal_breakdown) && result.literal_breakdown.length > 0 && (
              <div style={{ marginBottom: 12 }}>
                <div style={{ fontWeight: 700, color: C.muted, fontSize: 10, textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>{t("word_by_word")}</div>

              <div style={{ color: C.mid, fontSize: 13, lineHeight: 1.6 }}>{result.explanation}</div>

          {/* Reference language comparison */}

// ─── FLASHCARDS ──────────────────────────────────────────────────────────────
function Flashcards({ tLang, onStreakUpdate }) {
  const tName = TARGETS[tLang]?.name || "French";
  const [cards, setCards]     = useState(() => fcLoad().filter(c => c.lang === tLang));
  const [view, setView]       = useState("review"); // "review" | "browse" | "add"
  const [flipped, setFlipped] = useState(false);
  const [addForm, setAddForm] = useState({ front:"", back:"", pronunciation:"", example:"" });
  const [addErr, setAddErr]   = useState("");
  const [addOk, setAddOk]     = useState(false);

  const [practiceAll, setPracticeAll]       = useState(false);
  const [sessionReviewed, setSessionReviewed] = useState(new Set());
  const now      = Date.now();
  const dueCards = practiceAll
    ? cards.filter(c => !sessionReviewed.has(c.id))
    : cards.filter(c => c.next_review <= now);
  const current  = dueCards[0] || null;

  const refreshCards = () => setCards(fcLoad().filter(c => c.lang === tLang));

  const rate = (quality) => {
    if (!current) return;
    const updated = sm2(current, quality);
    const all = fcLoad();
    const idx = all.findIndex(c => c.id === current.id);
    if (idx >= 0) { all[idx] = updated; fcSave(all); }
    if (practiceAll) setSessionReviewed(prev => new Set([...prev, current.id]));
    setFlipped(false);
    refreshCards();
    _streak.log();
    if (onStreakUpdate) onStreakUpdate();
  };

  const deleteCard = (id) => {
    const all = fcLoad().filter(c => c.id !== id);
    fcSave(all);
    refreshCards();
  };

  const addCard = () => {
    setAddErr(""); setAddOk(false);
    if (!addForm.front.trim() || !addForm.back.trim()) { setAddErr(t("word_required")); return; }
    const ok = fcAdd({ lang: tLang, front: addForm.front.trim(), back: addForm.back.trim(), pronunciation: addForm.pronunciation.trim(), example: addForm.example.trim() });
    if (!ok) { setAddErr(t("already_in_fc")); return; }
    refreshCards();
    setAddForm({ front:"", back:"", pronunciation:"", example:"" });
    setAddOk(true);
    setTimeout(() => setAddOk(false), 2000);
  };

  const importFromWordSpace = () => {
    try {
      const ws = JSON.parse(localStorage.getItem("ws_saved") || "[]");
      let added = 0;
      ws.forEach(entry => {
        if (fcAdd({ lang: tLang, front: entry.fr, back: entry.ref || entry.input || "", pronunciation: entry.pronunciation || "", example: "" })) added++;
      });
      refreshCards();
      alert(`Imported ${added} new words from Word Space.`);
    } catch(e) {}
  };

  const totalCards   = cards.length;
  const learnedCards = cards.filter(c => c.repetitions > 0).length;
  const RATE_BTNS = [
    { q:0, label:t("rate_again"), color:C.red,    desc:t("rate_again_desc") },
    { q:1, label:t("rate_hard"),  color:C.text,  desc:t("rate_hard_desc") },
    { q:2, label:t("rate_good"),  color:C.accent, desc:t("rate_good_desc") },
    { q:3, label:t("rate_easy"),  color:C.green,  desc:t("rate_easy_desc") },
  ];

  return (
    <div>
      <Heading title="Flashcards" sub={`Spaced repetition — SM-2 algorithm. ${dueCards.length} card${dueCards.length !== 1 ? "s" : ""} due now.`} color={C.muted} />
      {cards.length === 0
        ? <Info text="Your flashcard deck is empty. Save words while using the AI Coach (New Word exercise → Save to Flashcards) or the Vocabulary tab. Then come back here each day to review." color={C.muted} />
        : dueCards.length === 0
          ? <Info text="All caught up! No cards due right now. Come back later or add new words from the AI Coach." color={C.green} />
          : <Info text="Rate each card honestly — 'Again' brings it back immediately; 'Easy' schedules it days away. The algorithm does the rest. Daily review beats long sessions." color={C.muted} />
      }

      {/* Stats row */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginBottom:14 }}>
        {[
          [t("fc_stat_total"), totalCards, C.blue],
          [t("fc_stat_due"), dueCards.length, dueCards.length > 0 ? C.muted : C.green],
          [t("fc_stat_learned"), learnedCards, C.accent],
        ].map(([label, val, col]) => (
          <div key={label} style={{ background:C.card, borderRadius:10, padding:"10px 12px", textAlign:"center", border:`1px solid ${C.bdr}`, boxShadow:C.sh }}>
            <div style={{ fontWeight:900, fontSize:22, color:col }}>{val}</div>
            <div style={{ color:C.muted, fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:1, marginTop:2 }}>{label}</div>
          </div>
        ))}
      </div>

      {/* View tabs */}
      <div style={{ display:"flex", gap:7, marginBottom:14 }}>
        {[["review",t("fc_tab_review"),""],["browse",t("fc_tab_browse"),""],["add",t("fc_tab_add"),"＋"]].map(([v,label,icon]) => (
          <button key={v} onClick={() => setView(v)} style={{
            padding:"6px 14px", borderRadius:20, border:`1px solid ${view===v?C.accent:C.bdr}`,
            background:view===v?C.muted:C.card, color:view===v?"#fff":C.muted,
            fontSize:11, fontWeight:700, cursor:"pointer",
          }}>{icon} {label}</button>
        ))}
        <button onClick={importFromWordSpace} style={{ padding:"6px 14px", borderRadius:20, border:`1px solid ${C.bdr}`, background:C.card, color:C.muted, fontSize:11, cursor:"pointer", marginLeft:"auto" }}>
          Import Word Space
        </button>
      </div>

      {/* ── REVIEW VIEW ── */}
      {view === "review" && (
        <div>
          {dueCards.length === 0 ? (
            <div style={{ background:C.card, borderRadius:16, padding:"36px 20px", textAlign:"center", boxShadow:C.sh, border:`1px solid ${C.bdr}` }}>
              <div style={{ marginBottom:12, display:"flex", justifyContent:"center" }}><Icon name="trophy" size={40} color={C.green}/></div>
              <div style={{ fontWeight:900, fontSize:18, color:C.green, marginBottom:8 }}>
                {practiceAll ? t("session_done") : t("all_caught_up")}
              </div>
              <div style={{ color:C.muted, fontSize:13, marginBottom:16 }}>
                {totalCards === 0
                  ? "You have no flashcards yet. Add some using the AI Coach, Word Space, or the Add Card tab."
                  : practiceAll
                    ? `You went through all ${totalCards} cards. SM-2 scheduling updated.`
                    : `All ${totalCards} cards reviewed for today.`}
              </div>
              {totalCards === 0 ? (
                <button onClick={() => setView("add")} style={{ padding:"11px 24px", background:C.surf2, color:C.text, border:`1px solid ${C.line}`, borderRadius:10, fontWeight:700, cursor:"pointer" }}>
                  {t("add_first_card")}
                </button>
              ) : (
                <div style={{ display:"flex", gap:10, justifyContent:"center", flexWrap:"wrap" }}>
                  <button onClick={() => { setSessionReviewed(new Set()); setFlipped(false); }} style={{ padding:"11px 24px", background:C.blue, color:"#fff", border:"none", borderRadius:10, fontWeight:700, cursor:"pointer" }}>
                    {t("practice_again")}
                  </button>
                  {practiceAll && (
                    <button onClick={() => { setPracticeAll(false); setSessionReviewed(new Set()); setFlipped(false); }} style={{ padding:"11px 24px", background:C.card, color:C.mid, border:`1px solid ${C.bdr}`, borderRadius:10, fontWeight:700, cursor:"pointer" }}>
                      {t("back_schedule")}
                    </button>
                  )}
                </div>
              )}
            </div>
          ) : (
            <div>
              <div style={{ textAlign:"center", color:C.muted, fontSize:12, marginBottom:10 }}>{dueCards.length} {t("remaining_session")}</div>
              {/* Card */}
              <div onClick={() => setFlipped(f => !f)} style={{
                background:C.card, border:`2px solid ${C.muted}`, borderRadius:18,
                padding:"32px 20px", textAlign:"center", marginBottom:14, cursor:"pointer",
                boxShadow:`0 4px 16px ${C.line}`, minHeight:180,
                display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
              }}>
                {!flipped ? (
                  <>
                    <div style={{ fontWeight:900, color:C.blue, fontSize:30, marginBottom:8 }}>{current.front}</div>
                    {current.pronunciation && <div style={{ color:C.muted, fontSize:14, fontStyle:"italic", marginBottom:6 }}>{current.pronunciation}</div>}
                    <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14 }}>
                      <PlayBtn text={current.front} />
                    </div>
                    <div style={{ color:C.muted, fontSize:12 }}>{t("tap_reveal")}</div>
                  </>
                ) : (
                  <>
                    <div style={{ fontWeight:900, color:C.blue, fontSize:30, marginBottom:8 }}>{current.front}</div>
                    <div style={{ color:C.mid, fontSize:18, marginBottom:8 }}>= {current.back}</div>
                    {current.example && (
                      <div style={{ background:C.bg, borderRadius:9, padding:"8px 12px", marginBottom:8, maxWidth:"100%" }}>
                        <div style={{ display:"flex", alignItems:"center", gap:6, justifyContent:"center", flexWrap:"wrap" }}>
                          <span style={{ color:C.mid, fontSize:13, fontStyle:"italic" }}>{current.example}</span>
                          {current.example && <PlayBtn text={current.example} sm />}
                        </div>
                      </div>
                    )}
                    <div style={{ color:C.muted, fontSize:11 }}>Next in: {current.interval}d · Interval × {current.ease?.toFixed(1)}</div>
                  </>
                )}
              </div>
              {/* Rate buttons — only show after flip */}
              {flipped && (
                <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:8 }} className="grid-2-xs">
                  {RATE_BTNS.map(b => (
                    <button key={b.q} onClick={() => rate(b.q)} style={{
                      padding:"12px 6px", borderRadius:11, border:`2px solid ${b.color}30`,
                      background:b.color+"12", color:b.color, fontWeight:800, fontSize:13,
                      cursor:"pointer", textAlign:"center", minHeight:56,
                    }}>
                      <div>{b.label}</div>
                      <div style={{ fontSize:10, fontWeight:500, marginTop:2, opacity:.8 }}>{b.desc}</div>
                    </button>
                  ))}
                </div>
              )}
              {!flipped && (
                <button onClick={() => setFlipped(true)} style={{ width:"100%", padding:12, background:C.surf2, color:C.text, border:`1px solid ${C.line}`, borderRadius:11, fontWeight:700, fontSize:14, cursor:"pointer" }}>
                  {t("show_answer")}
                </button>
              )}
            </div>
          )}
        </div>
      )}

      {/* ── BROWSE VIEW ── */}
      {view === "browse" && (
        <div>
          {cards.length === 0 ? (
            <Info text={`No ${tName} flashcards yet. Add cards using the AI Coach New Word exercise, Word Space, or the Add Card tab.`} color={C.muted} />
          ) : (
            cards.map(c => {
              const isDue = c.next_review <= now;
              const days  = Math.max(0, Math.round((c.next_review - now) / 86400000));
              return (
                <div key={c.id} style={{ background:C.card, border:`1px solid ${isDue?C.muted:C.bdr}`, borderRadius:11, padding:"11px 14px", marginBottom:8, display:"flex", alignItems:"center", gap:10, boxShadow:C.sh }}>
                  <div style={{ flex:1 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap", marginBottom:2 }}>
                      <span style={{ fontWeight:800, color:C.blue, fontSize:15 }}>{c.front}</span>
                      <PlayBtn text={c.front} sm />
                      {isDue && <span style={{ background:C.surf2, color:C.muted, fontSize:9, fontWeight:700, padding:"1px 7px", borderRadius:10 }}>DUE</span>}
                    </div>
                    <div style={{ color:C.mid, fontSize:12, marginBottom:2 }}>= {c.back}</div>
                    <div style={{ color:C.muted, fontSize:10 }}>
                      {c.repetitions === 0 ? "New" : `Next review: ${isDue ? "now" : `in ${days}d`} · Rep ${c.repetitions}`}
                    </div>
                  </div>
                  <button onClick={() => deleteCard(c.id)} style={{ background:"none", border:"none", color:C.muted, cursor:"pointer", fontSize:18, padding:"0 4px", lineHeight:1 }}>×</button>
                </div>
              );
            })
          )}
        </div>
      )}

      {/* ── ADD CARD VIEW ── */}
      {view === "add" && (
        <div style={{ background:C.card, borderRadius:14, padding:"18px 16px", boxShadow:C.sh, border:`1px solid ${C.bdr}` }}>
          <div style={{ fontWeight:800, color:C.text, fontSize:15, marginBottom:14 }}>Add a {tName} Flashcard</div>
          {[
            { key:"front",        label:`Word in ${tName} *`,     placeholder:`e.g. bonjour`,       required:true  },
            { key:"back",         label:"Meaning *",              placeholder:`e.g. hello`,          required:true  },
            { key:"pronunciation",label:"Pronunciation",          placeholder:`e.g. bohn-ZHOOR`,     required:false },
            { key:"example",      label:`Example sentence in ${tName}`, placeholder:`e.g. Bonjour tout le monde`, required:false },
          ].map(f => (
            <div key={f.key} style={{ marginBottom:12 }}>
              <div style={{ fontSize:11, fontWeight:700, color:C.mid, marginBottom:4 }}>{f.label}</div>
              <input
                value={addForm[f.key]}
                onChange={e => setAddForm(p => ({...p, [f.key]: e.target.value}))}
                placeholder={f.placeholder}
                style={{ width:"100%", padding:"10px 13px", borderRadius:9, border:`2px solid ${C.bdr}`, fontSize:13, boxSizing:"border-box" }}
              />
            </div>
          ))}
          {addErr && <div style={{ color:C.red, fontSize:13, marginBottom:10 }}>{addErr}</div>}
          {addOk  && <div style={{ color:C.green, fontSize:13, marginBottom:10 }}>{t("card_added")}</div>}
          <button onClick={addCard} style={{ width:"100%", padding:12, background:C.accent, color:"#fff", border:"none", borderRadius:10, fontWeight:700, fontSize:14, cursor:"pointer" }}>
            Add Card
          </button>
        </div>
      )}
    </div>
  );
}

// ─── NEW IA SCREEN COMPONENTS ────────────────────────────────────────────────
// All new-design screens. They receive { L, nav, goBack, dark } props.
// nav(view) pushes current on stack and navigates; goBack() pops the stack.

const GRAD = "linear-gradient(135deg,#FF5F7E,#C0153E)";

// Shared back button used in every sub-screen
function BackBtn({ onClick }) {
  return (
    <button onClick={onClick} style={{
      width:36,height:36,border:`1px solid ${C.line}`,background:C.surf,
      borderRadius:11,display:"flex",alignItems:"center",justifyContent:"center",
      cursor:"pointer",flexShrink:0,
    }}>
      <Icon name="arrow-left" size={16}/>
    </button>
  );
}

// ── WRAPPED SCREEN — generic shell with back-btn header + scrollable body ─────
function WrappedScreen({ title, subtitle, goBack, children, noPad }) {
  useLucide([title]);
  return (
    <div style={{display:"flex",flexDirection:"column",flex:1,minHeight:0}}>
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 18px 10px",borderBottom:`1px solid ${C.line}`,background:C.surf,flexShrink:0}}>
        <BackBtn onClick={goBack}/>
        <div>
          <div style={{fontWeight:700,fontSize:19,color:C.text}}>{title}</div>
          {subtitle && <div style={{fontSize:11,fontWeight:500,color:C.muted,marginTop:1}}>{subtitle}</div>}
        </div>
      </div>
      <div style={{flex:1,minHeight:0,overflowY:"auto",padding:noPad ? 0 : "16px 18px calc(28px + env(safe-area-inset-bottom))"}}>
        {children}
      </div>
    </div>
  );
}

// ── EXPLORE HOME ──────────────────────────────────────────────────────────────
function ExploreHome({ L, nav, factIdx, onNextFact, onOpenSettings, onOpenLang, dark, onToggleDark, streak, isDesktop, userLevel }) {
  useLucide([L.id, factIdx, dark]);
  const fact = L.facts[factIdx % L.facts.length];
  // Show the learner's own stored self-assessment when we have it, else the language's default CEFR band.
  const LEVEL_LABEL = { "beginner-zero":"Just starting", beginner:"Beginner", intermediate:"Intermediate", advanced:"Advanced" };
  const levelText = LEVEL_LABEL[userLevel] || `Level ${L.level}`;

  const AREAS = [
    {id:"grammar",     title:"Grammar",            icon:"book-open",       sub:`${L.grammarCount} rules, each explained simply with real examples`},
    {id:"vocab-full",  title:"Vocabulary",          icon:"type",            sub:`Build your word bank by theme — every word voiced`},
    {id:"dialogues",   title:"Phrases & Dialogues", icon:"messages-square", sub:`${L.phraseCount} real scenes: café, airport, meeting someone`},
    {id:"sounds",      title:"Sounds",              icon:"volume-2",        sub:`Master every sound — ${L.soundCount} to hear and copy`},
    {id:"culture",     title:"Culture & Nuance",    icon:"compass",         sub:`The unwritten rules — when to be formal, what not to say`},
  ];
  const TOOLS = [
    {id:"today",        title:"Today's Practice",   icon:"sun"},
    {id:"structures",   title:"Sentence Patterns",  icon:"layout-list"},
    {id:"wordspace",    title:"Word Space",          icon:"search"},
    {id:"roadmap",      title:"Progress & Roadmap",  icon:"map"},
    {id:"voice-tutor",  title:"Talk to Tutor",       icon:"mic"},
    {id:"analyzer",     title:"Analyze Any Text",    icon:"scan-text"},
  ];
  const HELPERS = [
    {id:"coach",  label:"Coach",  icon:"sparkles"},
    {id:"cards",  label:"Cards",  icon:"layers"},
    {id:"drills", label:"Drills", icon:"zap"},
    {id:"review", label:"Review", icon:"graduation-cap"},
  ];

  return (
    <div style={{display:"flex",flexDirection:"column",flex:1,minHeight:0,background:C.bg,fontFamily:"'Space Grotesk',system-ui,sans-serif"}}>
      {/* Header — hidden on desktop, where the sidebar owns brand/language/theme/settings */}
      {!isDesktop && (
      <div style={{padding:"13px 16px 10px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:`1px solid ${C.line}`,background:C.surf,flexShrink:0}}>
        <button onClick={onOpenLang} style={{display:"flex",alignItems:"center",gap:9,background:"none",border:"none",cursor:"pointer",textAlign:"left",padding:0}}>
          <div style={{width:36,height:36,borderRadius:10,background:GRAD,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <Icon name="languages" size={18} color="#fff"/>
          </div>
          <div>
            <div style={{fontWeight:700,fontSize:20,letterSpacing:"-.02em",color:C.text,lineHeight:1.1}}>{L.name}</div>
            <div style={{fontSize:10,fontWeight:600,color:C.accent,display:"flex",alignItems:"center",gap:3}}>Switch <Icon name="chevron-down" size={10} color={C.accent}/></div>
          </div>
        </button>
        <div style={{display:"flex",alignItems:"center",gap:7}}>
          <button onClick={onToggleDark} style={{width:34,height:34,border:`1px solid ${C.line}`,background:C.surf2,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
            <Icon name={dark?"sun":"moon"} size={15}/>
          </button>
          <button onClick={onOpenSettings} style={{width:34,height:34,border:`1px solid ${C.line}`,background:C.surf2,borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
            <Icon name="settings" size={15}/>
          </button>
        </div>
      </div>
      )}

      {/* Scrollable body */}
      <div style={{flex:1,overflowY:"auto",padding: isDesktop ? "22px 28px 12px" : "16px 18px 10px"}}>
        {/* Streak + level pills */}
        <div style={{display:"flex",gap:8,marginBottom:13}}>
          <div style={{flex:1,display:"flex",alignItems:"center",gap:6,background:C.surf,border:`1px solid ${C.line}`,borderRadius:999,padding:"7px 12px"}}>
            <Icon name="flame" size={14} color="#E8902B"/>
            <span style={{fontWeight:600,fontSize:12,color:C.text}}>{streak > 0 ? `${streak}-day streak` : "Start your streak"}</span>
          </div>
          <div style={{flex:1,display:"flex",alignItems:"center",gap:6,background:C.surf,border:`1px solid ${C.line}`,borderRadius:999,padding:"7px 12px"}}>
            <Icon name="trophy" size={14} color="#22A06B"/>
            <span style={{fontWeight:600,fontSize:12,color:C.text}}>{levelText}</span>
          </div>
        </div>

        {/* Culture fact */}
        <div style={{borderRadius:16,padding:"13px 15px",background:"linear-gradient(135deg,rgba(255,95,126,.1),rgba(192,21,62,.08))",border:`1px solid ${C.accentLine}`,marginBottom:11}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
            <div style={{display:"flex",alignItems:"center",gap:7}}>
              <Icon name={fact.icon} size={13} color={C.accent}/>
              <span style={{fontSize:9,fontWeight:700,letterSpacing:".14em",textTransform:"uppercase",color:C.accent}}>{fact.tag}</span>
            </div>
            <button onClick={onNextFact} style={{display:"flex",alignItems:"center",gap:4,background:"none",border:"none",cursor:"pointer",color:C.muted,fontFamily:"inherit",fontWeight:600,fontSize:11}}>
              <Icon name="refresh-cw" size={11}/>New fact
            </button>
          </div>
          <div style={{fontSize:13,fontWeight:500,lineHeight:1.55,color:C.text}}>{fact.text}</div>
        </div>

        {/* Ask anything → Coach */}
        <button onClick={() => nav("coach")} style={{width:"100%",display:"flex",alignItems:"center",gap:11,background:C.surf,border:`1.5px solid ${C.line}`,borderRadius:15,padding:"12px 14px",cursor:"pointer",textAlign:"left",marginBottom:11,fontFamily:"inherit"}}>
          <div style={{width:34,height:34,borderRadius:10,background:GRAD,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
            <Icon name="sparkles" size={17} color="#fff"/>
          </div>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:14,color:C.text}}>Ask anything — AI Coach</div>
            <div style={{fontSize:11,fontWeight:500,color:C.muted,marginTop:1}}>Grammar, vocab, corrections, exercises…</div>
          </div>
          <Icon name="arrow-up-right" size={16} color={C.faint}/>
        </button>

        {/* Continue card */}
        <button onClick={() => nav("grammar")} style={{width:"100%",textAlign:"left",borderRadius:16,padding:"14px 16px",background:GRAD,color:"#fff",cursor:"pointer",border:"none",boxShadow:"0 14px 28px -12px rgba(192,21,62,.45)",marginBottom:18,fontFamily:"inherit"}}>
          <div style={{fontSize:9,fontWeight:700,letterSpacing:".14em",textTransform:"uppercase",opacity:.85}}>Pick up where you left off</div>
          <div style={{fontWeight:700,fontSize:17,margin:"5px 0 11px"}}>{L.resume}</div>
          <div style={{display:"flex",alignItems:"center",gap:11}}>
            <div style={{flex:1,height:4,background:"rgba(255,255,255,.28)",borderRadius:99,overflow:"hidden"}}>
              <div style={{height:"100%",width:L.resumePct,background:"#fff",borderRadius:99}}/>
            </div>
            <span style={{display:"flex",alignItems:"center",gap:5,fontWeight:600,fontSize:12}}>
              <Icon name="play" size={13} color="#fff"/>Resume
            </span>
          </div>
        </button>

        {/* Explore areas */}
        <div style={{fontSize:9,fontWeight:700,letterSpacing:".15em",textTransform:"uppercase",color:C.faint,marginBottom:10}}>Explore the language</div>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:18}}>
          {AREAS.map(a => (
            <button key={a.id} onClick={() => nav(a.id)} style={{display:"flex",alignItems:"center",gap:12,background:C.surf,border:`1px solid ${C.line}`,borderRadius:14,padding:"11px 13px",cursor:"pointer",textAlign:"left",fontFamily:"inherit"}}>
              <div style={{width:38,height:38,borderRadius:11,background:C.surf2,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                <Icon name={a.icon} size={19} color={C.text}/>
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:14,color:C.text}}>{a.title}</div>
                <div style={{fontSize:11,fontWeight:500,color:C.muted}}>{a.sub}</div>
              </div>
              <Icon name="arrow-up-right" size={14} color={C.faint}/>
            </button>
          ))}
        </div>

        {/* Tools section */}
        <div style={{fontSize:9,fontWeight:700,letterSpacing:".15em",textTransform:"uppercase",color:C.faint,marginBottom:10}}>More tools</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,paddingBottom:8}}>
          {TOOLS.map(t => (
            <button key={t.id} onClick={() => nav(t.id)} style={{display:"flex",flexDirection:"column",gap:9,background:C.surf,border:`1px solid ${C.line}`,borderRadius:14,padding:"13px 13px",cursor:"pointer",textAlign:"left",fontFamily:"inherit"}}>
              <div style={{width:34,height:34,borderRadius:9,background:C.surf2,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <Icon name={t.icon} size={17} color={C.text}/>
              </div>
              <div style={{fontWeight:600,fontSize:13,color:C.text,lineHeight:1.25}}>{t.title}</div>
            </button>
          ))}
        </div>
      </div>

      {/* Helper dock — mobile bottom nav; on desktop the sidebar covers these */}
      {!isDesktop && (
        <div style={{borderTop:`1px solid ${C.line}`,background:C.surf,padding:"8px 16px max(14px, env(safe-area-inset-bottom))",flexShrink:0}}>
          <div style={{fontSize:8,fontWeight:700,letterSpacing:".12em",textTransform:"uppercase",color:C.faint,marginBottom:6}}>Helpers — bring to anything</div>

// ─── VOICE TUTOR ──────────────────────────────────────────────────────────────
function VoiceTutor({ tLang, rLangs, nativeLang }) {
  const [phase, setPhase]   = useState("idle"); // idle|thinking|speaking|listening|review
  const [msgs,  setMsgs]    = useState([]);
  const [summary, setSummary] = useState(null);
  const [errMsg, setErrMsg] = useState("");
  const recRef = useRef(null);
  const histRef = useRef([]);

  const tName = TARGETS[tLang]?.name || "French";
  const tTts  = TARGETS[tLang]?.tts  || "fr-FR";
  const refName = rLangs[0] ? (REFS?.[rLangs[0]]?.name || TARGETS[rLangs[0]]?.name || "English") : "English";

  const speakWait = (text) => new Promise(resolve => {
    const s = synth();
    if (!s) { resolve(); return; }
    try { s.cancel(); } catch(e) {}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = tTts; u.rate = 0.85;
    u.onend = resolve; u.onerror = resolve;
    setTimeout(() => { try { s.speak(u); } catch(e) { resolve(); } }, 80);
  });

  const listenOnce = () => new Promise((resolve, reject) => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { reject(new Error("no_sr")); return; }
    const r = new SR();
    r.lang = tTts; r.continuous = false; r.interimResults = false; r.maxAlternatives = 1;
    recRef.current = r;
    r.onresult = e => resolve(e.results[0][0].transcript);
    r.onerror  = e => reject(new Error(e.error));
    try { r.start(); } catch(e) { reject(e); }
  });

  const addMsg = (msg) => {
    histRef.current = [...histRef.current, msg];
    setMsgs([...histRef.current]);
  };

  const start = async () => {
    if (!isLoggedIn()) { window.dispatchEvent(new CustomEvent("show-upgrade")); return; }
    setErrMsg(""); setSummary(null); setMsgs([]); histRef.current = [];
    setPhase("thinking");
    try {
      const g = await askClaude(
        `You are a friendly ${tName} conversation tutor. Open with a warm 1-sentence greeting in ${tName} and ask the learner to introduce themselves. Return JSON: {"text":"${tName} greeting","hint":"English translation"}`,
        120, tLang, nativeLang
      );
      if (!g?.text) throw new Error("no_response");
      addMsg({ who:"ai", text: g.text, hint: g.hint });
      setPhase("speaking"); await speakWait(g.text);

      for (let i = 0; i < 5; i++) {
        setPhase("listening");
        let userText;
        try { userText = await listenOnce(); }
        catch(e) { if (e.message === "no-speech" || e.message === "aborted") break; throw e; }
        addMsg({ who:"you", text: userText });
        setPhase("thinking");

        const hist = histRef.current.map(m => `${m.who === "ai" ? "Tutor" : "You"}: ${m.text}`).join("\n");
        const r = await askClaude(
          `You are a ${tName} tutor. Learner speaks ${refName}.\n\nConversation:\n${hist}\n\nReply ONLY in ${tName}, 1-3 short sentences. If there's a grammar error, weave a gentle correction in naturally. End with a question.\n\nReturn JSON: {"text":"${tName} reply","hint":"English translation of YOUR reply","correction":null}`,
          200, tLang, nativeLang
        );
        if (!r?.text) break;
        addMsg({ who:"ai", text: r.text, hint: r.hint, correction: r.correction || null });
        setPhase("speaking"); await speakWait(r.text);
      }

      setPhase("thinking");
      const hist = histRef.current.map(m => `${m.who === "ai" ? "Tutor" : "You"}: ${m.text}`).join("\n");
      const fb = await askClaude(
        `You were a ${tName} tutor. Transcript:\n${hist}\n\nGive honest helpful feedback in English. Return JSON: {"score":"A/B/C/D","strong":["point1","point2"],"fixes":[{"said":"exact quote","better":"correction","why":"brief reason"}],"next":"one thing to practice"}`,
        350, tLang, nativeLang
      );
      setSummary(fb); setPhase("review");
    } catch(e) {
      setErrMsg(e.message === "no_sr" ? "Speech recognition isn't available on this browser — try Chrome or Safari." : "Something went wrong. Check your connection and try again.");
      setPhase("idle");
    }
    try { synth()?.cancel(); } catch(e) {}
  };

  const stop = () => {
    try { recRef.current?.abort(); } catch(e) {}
    try { synth()?.cancel(); } catch(e) {}
    if (histRef.current.length > 0) setPhase("review");
    else setPhase("idle");
  };

  const scoreColor = { A:C.green, B:C.green, C:C.accent, D:C.red };

  return (
    <div style={{padding:"16px 16px 24px",overflowY:"auto",flex:1}}>
      {/* Phase: idle */}
      {phase === "idle" && (
        <div style={{textAlign:"center",paddingTop:32}}>
          <div style={{fontSize:56,marginBottom:12}}>{TARGETS[tLang]?.flag || ""}</div>
          <div style={{fontWeight:800,fontSize:22,color:C.text,marginBottom:6}}>Talk to your {tName} tutor</div>
          <div style={{color:C.muted,fontSize:13,lineHeight:1.6,marginBottom:28,maxWidth:300,margin:"0 auto 28px"}}>Have a real conversation in {tName}. The AI corrects you naturally — no awkward interruptions. You'll get a full report at the end.</div>
          {errMsg && <div style={{background:C.red+"12",border:`1px solid ${C.red}30`,borderRadius:10,padding:"10px 14px",color:C.red,fontSize:12.5,marginBottom:20}}>{errMsg}</div>}
          {!(window.SpeechRecognition || window.webkitSpeechRecognition) && (
            <div style={{background:C.surf2,border:`1px solid ${C.line}`,borderRadius:10,padding:"10px 14px",color:C.muted,fontSize:12,marginBottom:20}}>Speech recognition requires Chrome or Safari. Text responses work on all browsers.</div>
          )}
          <button onClick={start} style={{display:"inline-flex",alignItems:"center",gap:10,padding:"15px 32px",background:GRAD,color:"#fff",border:"none",borderRadius:14,fontWeight:800,fontSize:16,cursor:"pointer",fontFamily:"inherit",boxShadow:"0 8px 24px -8px rgba(192,21,62,.5)"}}>
            <Icon name="mic" size={20} color="#fff"/> Start talking
          </button>
        </div>
      )}

      {/* Phase: thinking / speaking / listening */}
      {(phase === "thinking" || phase === "speaking" || phase === "listening") && (
        <div>
          {/* Status bar */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{
                width:10,height:10,borderRadius:"50%",flexShrink:0,
                background: phase === "listening" ? C.red : phase === "speaking" ? C.green : C.muted,
                boxShadow: phase === "listening" ? `0 0 0 4px ${C.red}30` : phase === "speaking" ? `0 0 0 4px ${C.green}30` : "none",
              }}/>
              <span style={{fontWeight:700,fontSize:13,color:C.text}}>
                {phase === "listening" ? "Listening…" : phase === "speaking" ? "Speaking…" : "Thinking…"}
              </span>
            </div>
            <button onClick={stop} style={{padding:"5px 12px",borderRadius:8,border:`1px solid ${C.line}`,background:C.surf2,color:C.muted,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>End & review</button>
          </div>

          {/* Conversation bubbles */}
          <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:16}}>
            {msgs.map((m,i) => (
              <div key={i} style={{display:"flex",flexDirection:"column",alignItems: m.who === "you" ? "flex-end" : "flex-start"}}>
                <div style={{
                  maxWidth:"85%",padding:"10px 13px",borderRadius:13,
                  background: m.who === "ai" ? C.accentSoft : C.surf2,
                  border: `1px solid ${m.who === "ai" ? C.accentLine : C.line}`,
                }}>
                  <div style={{fontWeight:700,fontSize:14,color: m.who === "ai" ? C.accent : C.text,marginBottom: m.hint ? 3 : 0}}>{m.text}</div>
                  {m.hint && <div style={{fontSize:11,color:C.muted,fontStyle:"italic"}}>{m.hint}</div>}
                  {m.correction && <div style={{fontSize:11,color:C.green,marginTop:4,fontWeight:600}}>✓ {m.correction}</div>}
                </div>
                <div style={{fontSize:10,color:C.faint,marginTop:2,paddingLeft:4,paddingRight:4}}>{m.who === "ai" ? "Tutor" : "You"}</div>
              </div>
            ))}
          </div>

          {/* Listening mic */}
          {phase === "listening" && (
            <div style={{textAlign:"center",padding:"16px 0"}}>
              <div style={{width:64,height:64,borderRadius:"50%",background:C.red+"15",border:`2px solid ${C.red}40`,display:"inline-flex",alignItems:"center",justifyContent:"center"}}>
                <Icon name="mic" size={26} color={C.red}/>
              </div>
              <div style={{color:C.muted,fontSize:12,marginTop:8}}>Speak in {tName}…</div>
            </div>
          )}
        </div>
      )}

      {/* Phase: review */}
      {phase === "review" && (
        <div>
          <div style={{fontWeight:800,fontSize:18,color:C.text,marginBottom:4}}>Conversation complete</div>
          <div style={{color:C.muted,fontSize:12,marginBottom:16}}>{msgs.length} messages · {tName}</div>

          {/* Transcript */}
          <div style={{marginBottom:20,display:"flex",flexDirection:"column",gap:8}}>
            {msgs.map((m,i) => (
              <div key={i} style={{display:"flex",flexDirection:"column",alignItems: m.who === "you" ? "flex-end" : "flex-start"}}>
                <div style={{maxWidth:"85%",padding:"9px 12px",borderRadius:12,background: m.who === "ai" ? C.accentSoft : C.surf2,border:`1px solid ${m.who === "ai" ? C.accentLine : C.line}`}}>
                  <div style={{fontWeight:700,fontSize:13,color: m.who === "ai" ? C.accent : C.text}}>{m.text}</div>
                  {m.hint && <div style={{fontSize:11,color:C.muted,fontStyle:"italic",marginTop:2}}>{m.hint}</div>}
                </div>
              </div>
            ))}
          </div>

          {/* Feedback */}
          {summary && (
            <div style={{background:C.surf,border:`1px solid ${C.line}`,borderRadius:14,padding:"16px 16px",marginBottom:16}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
                <div style={{width:44,height:44,borderRadius:12,background:(scoreColor[summary.score] || C.accent)+"18",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:20,color:scoreColor[summary.score] || C.accent,flexShrink:0}}>{summary.score || "B"}</div>
                <div>
                  <div style={{fontWeight:800,fontSize:15,color:C.text}}>Your performance</div>
                  <div style={{fontSize:11,color:C.muted}}>{tName} conversation</div>
                </div>
              </div>
              {summary.strong?.length > 0 && (
                <div style={{marginBottom:12}}>
                  <div style={{fontWeight:700,fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>What went well</div>
                  {summary.strong.map((s,i) => <div key={i} style={{display:"flex",gap:7,alignItems:"flex-start",marginBottom:4}}><span style={{color:C.green,fontSize:14,lineHeight:1.3,flexShrink:0}}>✓</span><span style={{fontSize:13,color:C.text,lineHeight:1.4}}>{s}</span></div>)}
                </div>
              )}
              {summary.fixes?.length > 0 && (
                <div style={{marginBottom:12}}>
                  <div style={{fontWeight:700,fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>Corrections</div>
                  {summary.fixes.map((f,i) => (
                    <div key={i} style={{background:C.surf2,border:`1px solid ${C.line}`,borderRadius:9,padding:"9px 11px",marginBottom:7}}>
                      <div style={{display:"flex",gap:6,alignItems:"baseline",marginBottom:3,flexWrap:"wrap"}}>
                        <span style={{fontSize:12,color:C.red,textDecoration:"line-through"}}>{f.said}</span>
                        <span style={{fontSize:11,color:C.muted}}>→</span>
                        <span style={{fontSize:12,color:C.green,fontWeight:700}}>{f.better}</span>
                      </div>
                      <div style={{fontSize:11,color:C.muted}}>{f.why}</div>
                    </div>
                  ))}
                </div>
              )}
              {summary.next && (
                <div style={{background:C.accentSoft,border:`1px solid ${C.accentLine}`,borderRadius:9,padding:"9px 11px"}}>
                  <div style={{fontWeight:700,fontSize:11,color:C.accent,marginBottom:3,textTransform:"uppercase",letterSpacing:1}}>Practice next</div>
                  <div style={{fontSize:12.5,color:C.text}}>{summary.next}</div>
                </div>
              )}
            </div>
          )}
          {!summary && <div style={{color:C.muted,fontSize:13,textAlign:"center",padding:"10px 0"}}>Generating your feedback…</div>}

          <button onClick={() => { setPhase("idle"); setMsgs([]); setSummary(null); histRef.current = []; }} style={{width:"100%",padding:13,background:GRAD,color:"#fff",border:"none",borderRadius:13,fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"inherit"}}>
            Start another conversation
          </button>
        </div>
      )}
    </div>
  );
}

// ─── TEXT ANALYZER ─────────────────────────────────────────────────────────────
function TextAnalyzer({ tLang, rLangs, nativeLang }) {
  const [text,     setText]     = useState("");
  const [analysis, setAnalysis] = useState(null);
  const [loading,  setLoading]  = useState(false);
  const [err,      setErr]      = useState("");
  const [openWord, setOpenWord] = useState(null);

  const tName   = TARGETS[tLang]?.name || "French";
  const refName = rLangs[0] ? (TARGETS[rLangs[0]]?.name || "English") : "English";

  const analyze = async () => {
    if (!text.trim()) return;
    if (!isLoggedIn()) { window.dispatchEvent(new CustomEvent("show-upgrade")); return; }
    setLoading(true); setErr(""); setAnalysis(null);
    try {
      const prompt = `You are a ${tName} language expert. A learner who speaks ${refName} pasted this text:\n\n"${text.slice(0,600)}"\n\nAnalyze it deeply. Return JSON:\n{"language":"${tName} or note if different","translation":"natural ${refName} translation","summary":"what this is in 1 sentence","difficulty":"A1/A2/B1/B2/C1/C2","words":[{"word":"target word or phrase","meaning":"${refName} meaning","grammar":"part of speech and grammatical form explanation","ref":"how this relates to ${refName} — cognate? false friend? no equivalent?"}],"grammar_points":[{"pattern":"grammar structure used","explanation":"what it is and how it works — 2-3 sentences","example":"new example using the same structure"}],"tip":"one cultural or linguistic insight"}`;
      const res = await askClaude(prompt, 900, tLang, nativeLang);
      setAnalysis(res);
    } catch(e) {
      setErr("Could not analyze. Check your connection and try again.");
    }
    setLoading(false);
  };

  const diffColor = { A1:C.green, A2:C.green, B1:C.accent, B2:C.accent, C1:C.red, C2:C.red };
  const diffLabel = { A1:"Beginner", A2:"Elementary", B1:"Intermediate", B2:"Upper-Intermediate", C1:"Advanced", C2:"Mastery" };

  return (
    <div style={{padding:"16px 16px 24px",overflowY:"auto",flex:1}}>
      <div style={{fontWeight:800,fontSize:18,color:C.text,marginBottom:4}}>Analyze any {tName} text</div>
      <div style={{color:C.muted,fontSize:12.5,lineHeight:1.6,marginBottom:16}}>Paste lyrics, a menu, a message, subtitles — anything in {tName}. Get an instant breakdown of the vocabulary and grammar.</div>

      <textarea
        value={text}
        onChange={e => setText(e.target.value)}
        placeholder={`Paste any ${tName} text here…`}
        rows={5}
        style={{width:"100%",padding:"12px 14px",borderRadius:11,border:`2px solid ${text ? C.accent : C.line}`,fontSize:14,background:C.surf,color:C.text,resize:"none",boxSizing:"border-box",fontFamily:"inherit",lineHeight:1.55,outline:"none",transition:"border .15s"}}
      />
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8,marginBottom:16}}>
        <span style={{fontSize:11,color:C.muted}}>{text.length}/600 characters</span>
        <button onClick={analyze} disabled={!text.trim() || loading} style={{padding:"10px 22px",background:text.trim() && !loading ? GRAD : C.surf2,color:text.trim() && !loading ? "#fff" : C.muted,border:"none",borderRadius:10,fontWeight:700,fontSize:13,cursor:text.trim() && !loading ? "pointer":"default",fontFamily:"inherit",transition:"all .15s"}}>
          {loading ? "Analyzing…" : "Analyze →"}
        </button>
      </div>

      {err && <div style={{background:C.red+"12",border:`1px solid ${C.red}30`,borderRadius:9,padding:"10px 14px",color:C.red,fontSize:12.5,marginBottom:16}}>{err}</div>}

      {analysis && (
        <div>
          {/* Header */}
          <div style={{background:C.surf,border:`1px solid ${C.line}`,borderRadius:13,padding:"13px 15px",marginBottom:14}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8,gap:10}}>
              <div style={{fontWeight:700,fontSize:14,color:C.text,flex:1}}>{analysis.summary}</div>
              {analysis.difficulty && <span style={{background:(diffColor[analysis.difficulty]||C.accent)+"15",color:diffColor[analysis.difficulty]||C.accent,border:`1px solid ${(diffColor[analysis.difficulty]||C.accent)}30`,borderRadius:20,padding:"2px 10px",fontSize:10,fontWeight:700,flexShrink:0}}>{analysis.difficulty} · {diffLabel[analysis.difficulty]||""}</span>}
            </div>
            <div style={{fontStyle:"italic",color:C.muted,fontSize:12.5,lineHeight:1.6,borderTop:`1px solid ${C.line}`,paddingTop:8}}>{analysis.translation}</div>
          </div>

          {/* Key words */}
          {analysis.words?.length > 0 && (
            <div style={{marginBottom:14}}>
              <div style={{fontWeight:700,fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Key words & phrases</div>
              {analysis.words.map((w,i) => (
                <div key={i} style={{background:C.surf,border:`1px solid ${openWord===i ? C.accent : C.line}`,borderRadius:11,marginBottom:8,overflow:"hidden"}}>
                  <div onClick={() => setOpenWord(openWord===i ? null : i)} style={{padding:"10px 13px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                    <div style={{flex:1}}>
                      <span style={{fontWeight:800,color:C.accent,fontSize:15}}>{w.word}</span>
                      <span style={{color:C.muted,fontSize:12,marginLeft:8}}>{w.meaning}</span>
                    </div>
                    <PlayBtn text={w.word} sm/>
                    <span style={{color:openWord===i?C.accent:C.muted,fontSize:16,fontWeight:700,flexShrink:0}}>{openWord===i?"−":"+"}</span>
                  </div>
                  {openWord===i && (
                    <div style={{padding:"0 13px 12px",borderTop:`1px solid ${C.line}`}}>
                      {w.grammar && <div style={{marginTop:8,fontSize:12.5,color:C.text,lineHeight:1.5}}><span style={{fontWeight:700,color:C.muted,fontSize:10,textTransform:"uppercase",letterSpacing:.8}}>Grammar · </span>{w.grammar}</div>}
                      {w.ref && <div style={{marginTop:6,fontSize:12,color:C.muted,lineHeight:1.5}}><span style={{fontWeight:700,fontSize:10,textTransform:"uppercase",letterSpacing:.8}}>vs {refName} · </span>{w.ref}</div>}
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}

          {/* Grammar points */}
          {analysis.grammar_points?.length > 0 && (
            <div style={{marginBottom:14}}>
              <div style={{fontWeight:700,fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Grammar patterns used</div>
              {analysis.grammar_points.map((g,i) => (
                <div key={i} style={{background:C.surf,border:`1px solid ${C.line}`,borderRadius:11,padding:"11px 13px",marginBottom:8}}>
                  <div style={{fontWeight:800,color:C.accent,fontSize:13,fontFamily:"monospace",marginBottom:5}}>{g.pattern}</div>
                  <div style={{fontSize:12.5,color:C.text,lineHeight:1.55,marginBottom:6}}>{g.explanation}</div>
                  {g.example && <div style={{background:C.accentSoft,border:`1px solid ${C.accentLine}`,borderRadius:7,padding:"7px 10px",fontSize:12,color:C.accent,fontWeight:600}}>e.g. {g.example} <PlayBtn text={g.example} sm/></div>}
                </div>
              ))}
            </div>
          )}

          {/* Tip */}
          {analysis.tip && (
            <div style={{background:C.surf2,border:`1px solid ${C.line}`,borderLeft:`3px solid ${C.faint}`,borderRadius:9,padding:"10px 13px"}}>
              <div style={{fontWeight:700,fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>Cultural tip</div>
              <div style={{fontSize:12.5,color:C.text,lineHeight:1.55}}>{analysis.tip}</div>
            </div>
          )}

          <button onClick={() => { setAnalysis(null); setText(""); }} style={{width:"100%",marginTop:14,padding:12,background:C.surf2,border:`1px solid ${C.line}`,borderRadius:11,fontWeight:600,fontSize:13,color:C.text,cursor:"pointer",fontFamily:"inherit"}}>
            Analyze another text
          </button>
        </div>
      )}
    </div>
  );
}

// ─── SHARE CARD MODAL ──────────────────────────────────────────────────────────
function ShareCardModal({ word, meaning, example, lang, onClose }) {
  const canvasRef = useRef(null);
  const tName = TARGETS[lang]?.name || "French";
  const flag  = TARGETS[lang]?.flag  || "";

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const W = 1080, H = 1080;
    canvas.width = W; canvas.height = H;

    // Background gradient
    const gr = ctx.createLinearGradient(0, 0, W, H);
    gr.addColorStop(0, "#FF5F7E"); gr.addColorStop(1, "#C0153E");
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);

    // Noise texture overlay
    for (let i = 0; i < 4000; i++) {
      ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.025})`;
      ctx.fillRect(Math.random() * W, Math.random() * H, 1, 1);
    }

    // Top badge
    ctx.fillStyle = "rgba(255,255,255,0.15)";
    ctx.beginPath(); ctx.roundRect(60, 60, 240, 56, 28); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "bold 26px 'Space Grotesk', system-ui, sans-serif";
    ctx.fillText("Tongue · Speak Every Tongue", 80, 97);

    // Flag
    ctx.font = "90px serif"; ctx.fillText(flag, 60, 260);

    // Language label
    ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = "600 32px 'Space Grotesk', system-ui, sans-serif";
    ctx.fillText(tName.toUpperCase(), 60, 310);

    // Word
    const wordText = (word || "").slice(0, 40);
    ctx.fillStyle = "#fff"; ctx.font = "800 88px 'Space Grotesk', system-ui, sans-serif";
    const words = wordText.split(" ");
    let line = "", y = 440;
    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > 960 && line) {
        ctx.fillText(line, 60, y); line = w; y += 100;
      } else line = test;
    }
    if (line) ctx.fillText(line, 60, y);

    // Meaning
    ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.font = "600 44px 'Space Grotesk', system-ui, sans-serif";
    y += 70; ctx.fillText((meaning || "").slice(0, 50), 60, y);

    // Example sentence
    if (example) {
      ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.font = "400 32px 'Space Grotesk', system-ui, sans-serif";
      y += 70;
      const ex = example.slice(0, 60);
      const exWords = ex.split(" ");
      let exLine = ""; let ey = y;
      for (const w of exWords) {
        const test = exLine ? exLine + " " + w : w;
        if (ctx.measureText(test).width > 960 && exLine) {
          ctx.fillText(exLine, 60, ey); exLine = w; ey += 46;
        } else exLine = test;
      }
      if (exLine) ctx.fillText(exLine, 60, ey);
    }

    // Divider
    ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(60, 920); ctx.lineTo(W-60, 920); ctx.stroke();

    // URL
    ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.font = "500 28px 'Space Grotesk', system-ui, sans-serif";
    ctx.fillText("tonge-app.fly.dev · free to use", 60, 970);
  }, [word, meaning, example, lang]);

  const download = () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const a = document.createElement("a");
    a.download = `tongue-${(word||"word").replace(/\s+/g,"-").slice(0,20)}.png`;
    a.href = canvas.toDataURL("image/png");
    a.click();
  };

  const share = async () => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    if (navigator.share && navigator.canShare) {
      canvas.toBlob(async (blob) => {
        if (!blob) { download(); return; }
        const file = new File([blob], "tongue-word.png", { type:"image/png" });
        if (navigator.canShare({ files:[file] })) {
          try { await navigator.share({ files:[file], title:"I learned a new word!", text:`${word} — ${meaning}` }); return; }
          catch(e) {}
        }
        download();
      }, "image/png");
    } else download();
  };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:999,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20}} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{background:C.surf,borderRadius:20,padding:"16px 16px 20px",width:"100%",maxWidth:380,maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div style={{fontWeight:800,fontSize:16,color:C.text}}>Share your progress</div>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:22,color:C.muted,lineHeight:1}}>×</button>
        </div>
        <canvas ref={canvasRef} style={{width:"100%",borderRadius:12,display:"block",marginBottom:14}}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <button onClick={share} style={{padding:"12px 0",background:GRAD,color:"#fff",border:"none",borderRadius:11,fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>
            <Icon name="share-2" size={15} color="#fff"/> Share
          </button>
          <button onClick={download} style={{padding:"12px 0",background:C.surf2,border:`1px solid ${C.line}`,borderRadius:11,fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",color:C.text,display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>
            <Icon name="download" size={15}/> Download
          </button>
        </div>
      </div>
    </div>
  );
}
