            <Icon name={dark?"sun":"moon"} size={14}/> {dark ? "Light" : "Dark"}
          </button>
          <button onClick={onOpenSettings} style={{width:38,display:"flex",alignItems:"center",justifyContent:"center",padding:"8px",borderRadius:9,border:`1px solid ${C.line}`,background:C.surf2,color:C.text,cursor:"pointer"}}>
            <Icon name="settings" size={14}/>
          </button>
        </div>
      </div>
    </aside>
  );
}

function App() {
  const mobile = useMobile();
  const isDesktop = useDesktop();
  // ── new IA navigation ──────────────────────────────────────────────────────
  const [view, setView]             = useState("explore");
  const [stack, setStack]           = useState([]);
  const [dark, setDark]             = useState(() => {
    try {
      const saved = localStorage.getItem("_dark") === "1";
      // Apply immediately so first render reads correct CSS vars
      if (saved) document.documentElement.classList.add("dark-theme");
      return saved;
    } catch(e) { return false; }
  });
  const [themeIdx, setThemeIdx]     = useState(0);
  const [factIdx, setFactIdx]       = useState(0);
  // ── auth / plan ────────────────────────────────────────────────────────────
  const [tLang, setTLang]           = useState(() => { try { return localStorage.getItem("target_lang") || "fr"; } catch(e) { return "fr"; } });
  const [rLangs, setRLangs]         = useState(["en"]);
  const [nativeLang, setNativeLang] = useState(() => _nativeLang);
  const [overlay, setOverlay]       = useState(null); // "lang"|"settings"|"upgrade"|null
  const [loggedIn, setLoggedIn]     = useState(isLoggedIn());
  // If the session lapsed but we remembered the code, silently sign back in
  // instead of making the user look it up again.
  const [authChecking, setAuthChecking] = useState(() => {
    try { return !isLoggedIn() && !!localStorage.getItem("tongue_code"); } catch(e) { return false; }
  });
  const [renewedBanner, setRenewedBanner] = useState(false);
  const [showOnboarding, setShowOnboarding] = useState(() => {
    try { return localStorage.getItem("_new_login") === "1"; } catch(e) { return false; }
  });
  const [isFree, setIsFree]         = useState(getUserPlan() === "free");
  const [expiryWarning, setExpiryWarning] = useState(() => {
    if (!_authExpiry) return null;
    const days = Math.floor((new Date(_authExpiry) - new Date()) / 86400000);
    return (days >= 0 && days <= 3) ? days : null;
  });
  const [streak, setStreak] = useState(() => _streak.get().count);
  const [userLevel, setUserLevel] = useState(() => { try { return localStorage.getItem("user_level") || ""; } catch(e) { return ""; } });

  // ── event listeners (unchanged) ──────────────────────────────────────────
  useEffect(() => {
    const handler = () => { setLoggedIn(false); setRenewedBanner(true); };
    window.addEventListener("session-renewed", handler);
    return () => window.removeEventListener("session-renewed", handler);
  }, []);

  useEffect(() => {
    const handler = (e) => setStreak(e.detail?.count ?? _streak.get().count);
    window.addEventListener("streak-updated", handler);
    return () => window.removeEventListener("streak-updated", handler);
  }, []);

  useEffect(() => {
    const handler = () => setOverlay("upgrade");
    window.addEventListener("show-upgrade", handler);
    return () => window.removeEventListener("show-upgrade", handler);
  }, []);

  // Silent auto-login: session lapsed but code remembered → sign back in
  useEffect(() => {
    if (!authChecking) return;
    let cancelled = false;
    (async () => {
      let savedCode = "";
      try { savedCode = localStorage.getItem("tongue_code") || ""; } catch(e) {}
      if (!savedCode) { if (!cancelled) setAuthChecking(false); return; }
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: savedCode.trim().toUpperCase() }),
        });
        const data = await res.json();
        if (res.ok && data.token) {
          saveSession(data.token, data.expiresAt, data.email, data.plan);
          if (!cancelled) setLoggedIn(true);
        } else {
          // Code no longer valid (renewed/revoked) — drop it and show login.
          try { localStorage.removeItem("tongue_code"); } catch(e) {}
        }
      } catch(e) { /* offline — fall through to the login screen */ }
      if (!cancelled) setAuthChecking(false);
    })();
    return () => { cancelled = true; };
  }, [authChecking]);

  // Validate token on startup
  useEffect(() => {
    if (!isLoggedIn()) return;
    fetch("/api/auth/validate", { headers: { "Authorization": "Bearer " + getToken() } })
      .then(r => r.ok ? r.json() : null)
      .then(d => {
        if (!d || !d.valid) return;
        if (d.plan && d.plan !== getUserPlan()) {
          try { localStorage.setItem("auth_plan", d.plan); _userPlan = d.plan; } catch(_) {}
          setIsFree(d.plan === "free");
        }
        // Restore the learner's stored profile so level + language follow the account.
        if (d.userLevel) {
          setUserLevel(d.userLevel);
          try { localStorage.setItem("user_level", d.userLevel); } catch(_) {}
        }
        if (d.targetLang && TARGETS[d.targetLang] && d.targetLang !== tLang) {
          setTLang(d.targetLang);
          try { localStorage.setItem("target_lang", d.targetLang); } catch(_) {}
        }
        if (d.needsRelogin) window.dispatchEvent(new CustomEvent("show-upgrade", { detail: { upgraded: true } }));
      })
      .catch(() => {});
  }, []);

  // The bottom nav dock only renders on the mobile home screen; flag it on <body>
  // so the support button lifts above it there and stays low everywhere else.
  useEffect(() => {
    const hasDock = view === "explore" && !isDesktop;
    document.body.classList.toggle("has-bottom-dock", hasDock);
    return () => document.body.classList.remove("has-bottom-dock");
  }, [view, isDesktop]);

  useEffect(() => {
    loadVoices();
    const s = synth();
    if (s && s.addEventListener) {
      s.addEventListener("voiceschanged", loadVoices);
      return () => { try { s.removeEventListener("voiceschanged", loadVoices); } catch(e){} };
    }
    const interval = setInterval(loadVoices, 250);
    setTimeout(() => clearInterval(interval), 3000);
    return () => clearInterval(interval);
  }, []);

  useEffect(() => {
    _nativeLang = nativeLang;
    try { localStorage.setItem("native_lang", nativeLang); } catch(e) {}
  }, [nativeLang]);

  useEffect(() => {
    try { localStorage.setItem("target_lang", tLang); } catch(e) {}
    activeLang  = TARGETS[tLang]?.tts || "fr-FR";
    activeVoice = "";
  }, [tLang]);

  // Persist dark preference (class is applied synchronously in toggleDark below)
  useEffect(() => {
    try { localStorage.setItem("_dark", dark ? "1" : "0"); } catch(e) {}
  }, [dark]);

  // ── navigation helpers ────────────────────────────────────────────────────
  const nav = (v) => {
    const ns = makeNavState(v, view, stack);
    setView(ns.view);
    setStack(ns.stack);
  };
  const goBack = () => {
    const bs = makeBackState(stack);
    setView(bs.view);
    setStack(bs.stack);
  };

  // ── language data ─────────────────────────────────────────────────────────
  const L = LANGS_DATA[tLang] || LANGS_DATA.fr;

  if (!loggedIn && authChecking) {
    return (
      <div style={{fontFamily:"system-ui,-apple-system,sans-serif",background:"#f1f5f9",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}}>
        <img src="/icon.svg" alt="Tongue" style={{width:64,height:64}}/>
        <div style={{width:26,height:26,border:"3px solid #e2e8f0",borderTopColor:"#C0153E",borderRadius:"50%",animation:"spin .7s linear infinite"}}/>
        <div style={{color:"#64748b",fontSize:13,fontWeight:600}}>Signing you in…</div>
      </div>
    );
  }
  if (!loggedIn) return <AccessCodeLogin onLogin={() => setLoggedIn(true)} renewedBanner={renewedBanner} />;

  if (showOnboarding) {
    return (
      <NewOnboarding
        onSetLang={(code) => { setTLang(code); try { localStorage.setItem("target_lang", code); } catch(e){} }}
        onDone={() => {
          try { localStorage.removeItem("_new_login"); localStorage.setItem("_seen_onboard","1"); } catch(e){}
          setShowOnboarding(false);
        }}
      />
    );
  }

  const toggleDark = () => {
    // Apply class synchronously so the next render reads updated CSS vars
    const next = !dark;
    if (next) document.documentElement.classList.add("dark-theme");
    else document.documentElement.classList.remove("dark-theme");
    setDark(next);
  };
  const setNativeLangAndPersist = (code) => {
    setNativeLang(code); _nativeLang = code;
    try { localStorage.setItem("native_lang", code); } catch(e) {}
  };

  // Shorthand for wrapping old components with a back-btn header
  const wrap = (title, subtitle, content, noPad) => (
    <WrappedScreen title={title} subtitle={subtitle} goBack={goBack} noPad={noPad}>
      {content}
    </WrappedScreen>
  );

  const appBody = (
    <div style={{fontFamily:"'Space Grotesk',system-ui,sans-serif",background:C.bg,color:C.text,maxWidth:520,margin:"0 auto",display:"flex",flexDirection:"column",height:"100dvh",overflow:"hidden"}} className={"app-shell" + (isDesktop ? " app-shell-in-stage" : "")}>

      {/* ── EXPIRY BANNER ── */}
      {expiryWarning !== null && (
        <div style={{background:"#fef9c3",padding:"7px 14px",fontSize:12,color:"#92400e",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexShrink:0}}>
          <span>{expiryWarning === 0 ? t("expires_today") : expiryWarning === 1 ? t("expires_tomorrow") : t("expires_days", {n:expiryWarning})}</span>
          <button onClick={() => setExpiryWarning(null)} style={{background:"none",border:"none",cursor:"pointer",color:"#92400e",fontWeight:900,fontSize:18,flexShrink:0,lineHeight:1}}>×</button>
        </div>
      )}

      {/* ── FREE TIER BANNER ── */}
      {isFree && (
        <div style={{background:GRAD,padding:"6px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,flexShrink:0}}>
          <span style={{color:"#fff",fontSize:11.5,fontWeight:600}}>Free plan · limited coach sessions</span>
          <a href="/subscribe" style={{display:"inline-block",padding:"4px 11px",background:"#fff",color:"#C0153E",borderRadius:7,fontSize:11,fontWeight:800,textDecoration:"none",flexShrink:0}}>Upgrade</a>
        </div>
      )}

      {/* ── MAIN SCREEN AREA ── */}
      <div key={view} className="scr-anim" style={{flex:1,minHeight:0,display:"flex",flexDirection:"column",overflow:"hidden"}}>

        {/* ── EXPLORE (home) ── */}
        {view === "explore" && (
          <ExploreHome
            L={L} nav={nav} dark={dark} factIdx={factIdx} streak={streak}
            isDesktop={isDesktop} userLevel={userLevel}
            onNextFact={() => setFactIdx(i => i+1)}
            onOpenSettings={() => setOverlay("settings")}
            onOpenLang={() => setOverlay("lang")}
            onToggleDark={toggleDark}
          />
        )}

        {/* ── AI COACH ── */}
        {view === "coach" && wrap("AI Coach", "Ask anything, practise out loud, get corrected on the spot", <AICoach tLang={tLang} rLangs={rLangs} nativeLang={nativeLang}/>, true)}

        {/* ── GRAMMAR (new index) ── */}
        {view === "grammar" && <GrammarScreen L={L} nav={nav} goBack={goBack}/>}

        {/* ── GRAMMAR FULL (old component, all langs) ── */}
        {view === "grammar-full" && wrap("Grammar", "Every conjugation and rule, laid out in full tables", <Grammar tLang={tLang} rLangs={rLangs}/>)}

        {/* ── CONCEPT DEEP DIVE ── */}
        {view === "concept" && <ConceptScreen L={L} nav={nav} goBack={goBack}/>}

        {/* ── VOCAB THEMES (new IA entry) ── */}
        {view === "vocabThemes" && <VocabThemesScreen L={L} nav={nav} goBack={goBack} onThemePick={setThemeIdx}/>}

        {/* ── VOCAB WORDS (new IA detail) ── */}
        {view === "vocabWords" && <VocabWordsScreen L={L} themeIdx={themeIdx} nav={nav} goBack={goBack}/>}

        {/* ── VOCAB FULL (old component, all langs) ── */}
        {view === "vocab-full" && wrap("Vocabulary", "Every word by theme — with audio and example sentences", <Vocab tLang={tLang} rLangs={rLangs}/>)}

        {/* ── PHRASES (new IA French-rich screen) ── */}
        {view === "phrases" && <PhrasesScreen L={L} nav={nav} goBack={goBack}/>}

        {/* ── DIALOGUES (old component, all langs) ── */}
        {view === "dialogues" && wrap("Phrases & Dialogues", "Full conversations you'll actually have — read, listen, role-play", <Dialogues tLang={tLang}/>)}

        {/* ── SOUNDS ── */}
        {view === "sounds" && <SoundsScreen L={L} goBack={goBack}/>}

        {/* ── CULTURE ── */}
        {view === "culture" && <CultureScreen L={L} goBack={goBack}/>}

        {/* ── FLASHCARDS ── */}
        {view === "cards" && wrap("Flashcards", "Reviews surface right before you'd forget — nothing wasted",
          <Flashcards tLang={tLang} onStreakUpdate={() => setStreak(_streak.get().count)}/>, true)}

        {/* ── DRILLS ── */}
        {view === "drills" && wrap("Drills", "Fast reps that turn the rules into reflexes", <Drills tLang={tLang}/>)}

        {/* ── STRUCTURES ── */}
        {view === "structures" && wrap("Sentence Patterns", "The skeletons of real sentences — swap in any words", <Structures tLang={tLang} rLangs={rLangs}/>)}

        {/* ── WORD SPACE ── */}
        {view === "wordspace" && wrap("Word Space", "Type any word to see it translated, broken down, and voiced", <WordSpace tLang={tLang} rLangs={rLangs}/>, true)}

        {/* ── ROADMAP ── */}
        {view === "roadmap" && wrap("Progress & Roadmap", "Where you are now — and exactly what to learn next", <Roadmap tLang={tLang}/>)}

        {/* ── VOICE TUTOR ── */}
        {view === "voice-tutor" && wrap("Talk to Tutor", "A real spoken conversation — it replies and fixes your mistakes", <VoiceTutor tLang={tLang} rLangs={rLangs} nativeLang={nativeLang}/>, true)}

        {/* ── TEXT ANALYZER ── */}
        {view === "analyzer" && wrap("Analyze Any Text", "Paste lyrics, a menu, a message — get it decoded word by word", <TextAnalyzer tLang={tLang} rLangs={rLangs} nativeLang={nativeLang}/>, true)}

        {/* ── TODAY'S PRACTICE ── */}
        {view === "today" && wrap("Today's Practice", "Your quick daily rep — a little every day beats cramming",
          <div>
            <TodaysPractice tLang={tLang} onGoToTab={(i) => {
              // Map old tab indices to new views
              const tabMap = {1:"coach",2:"grammar-full",3:"structures",4:"vocab-full",5:"drills",6:"dialogues",7:"roadmap",8:"wordspace",9:"cards"};
              if (tabMap[i]) nav(tabMap[i]);
            }}/>
            <CheatSheet tLang={tLang} rLangs={rLangs}/>
          </div>
        )}

        {/* ── REVIEW ── */}
        {view === "review" && <ReviewScreen nav={nav} goBack={goBack} tLang={tLang}/>}

      </div>

      {/* ── OVERLAYS ── */}
      {overlay === "lang" && (
        <LangSwitchOverlay
          current={tLang}
          onPick={(code) => {
            setTLang(code); setView("explore"); setStack([]);
            try { localStorage.setItem("target_lang", code); } catch(_) {}
            // Persist to the account so the choice follows the user across devices
            if (isLoggedIn()) {
              fetch("/api/auth/preferences", {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getToken() },
                body: JSON.stringify({ language: code }),
              }).catch(() => {});
            }
          }}
          onClose={() => setOverlay(null)}
        />
      )}
      {overlay === "settings" && (
        <SettingsOverlay
          onClose={() => setOverlay(null)}
          onLogout={() => {
            try { logout(); } catch(e) {}
            try { localStorage.removeItem("tongue_code"); } catch(e) {}
            setAuthChecking(false); setLoggedIn(false); setOverlay(null);
          }}
          nativeLang={nativeLang}
          onSetNativeLang={setNativeLangAndPersist}
          isFree={isFree}
          onOpenVoice={() => setOverlay("voice")}
          dark={dark}
          onToggleDark={toggleDark}
        />
      )}
      {overlay === "voice" && <VoicePanel tLang={tLang} onClose={() => setOverlay(null)}/>}
      {overlay === "upgrade" && <UpgradeOverlay onClose={() => setOverlay(null)}/>}

      <SupportChat />
    </div>
  );

  if (isDesktop) {
    return (
      <div className="desktop-stage">
        <DesktopNav
          L={L} view={view} nav={nav} dark={dark}
          onToggleDark={toggleDark}
          onOpenLang={() => setOverlay("lang")}
          onOpenSettings={() => setOverlay("settings")}
          isFree={isFree}
        />
        {appBody}
      </div>
    );
  }
  return appBody;
}

// ─── SUPPORT CHAT ─────────────────────────────────────────────────────────────
function SupportChat() {
  const [open, setOpen]       = useState(false);
  const [msgs, setMsgs]       = useState([
    { role:"bot", text: t("support_greeting") }
  ]);
  const [input, setInput]     = useState("");
  const [loading, setLoading] = useState(false);
  const bottomRef             = React.useRef(null);

  useEffect(() => {
    if (open && bottomRef.current) bottomRef.current.scrollIntoView({ behavior:"smooth" });
  }, [msgs, open]);

  // Haptic feedback on supported devices
  const haptic = () => {
    try { if (window.Capacitor?.Plugins?.Haptics) window.Capacitor.Plugins.Haptics.impact({ style:"light" }); } catch(_){}
    try { if (navigator.vibrate) navigator.vibrate(8); } catch(_){}
  };

  const send = async () => {
    const q = input.trim();
    if (!q || loading) return;
    haptic();
    setInput("");
    setMsgs(prev => [...prev, { role:"user", text:q }]);
    setLoading(true);
    try {
      const res  = await fetch("/api/support", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ question:q }),
      });
      const data = await res.json();
      setMsgs(prev => [...prev, { role:"bot", text: data.answer || data.error || "Sorry, I couldn't get an answer right now." }]);
    } catch(_) {
      setMsgs(prev => [...prev, { role:"bot", text:"Connection issue. Please try again." }]);
    }
    setLoading(false);
  };

  return (
    <>
      {/* Floating button */}
      <button
        className="support-fab"
        onClick={() => { haptic(); setOpen(true); }}
        aria-label="Help"
        title="Help & Support"
      ></button>

      {/* Bottom sheet */}
      <div className={`sheet-backdrop${open ? " open" : ""}`} onClick={() => setOpen(false)}>
        <div className="sheet" onClick={e => e.stopPropagation()} style={{ display:"flex", flexDirection:"column", height:"70vh" }}>
          <div className="sheet-handle"/>
          {/* Header */}
          <div style={{ padding:"14px 18px 10px", borderBottom:"1px solid #f1f5f9", display:"flex", justifyContent:"space-between", alignItems:"center", flexShrink:0 }}>
            <div>
              <div style={{ fontWeight:900, fontSize:15, color:"#0f172a" }}>{t("support_title")}</div>
              <div style={{ fontSize:11, color:"#64748b", marginTop:2 }}>{t("support_subtitle")}</div>
            </div>
            <button onClick={() => setOpen(false)} style={{ background:"#f1f5f9", border:"none", borderRadius:8, width:30, height:30, fontSize:16, color:"#64748b", display:"flex", alignItems:"center", justifyContent:"center" }}>×</button>
          </div>

          {/* Messages */}
          <div style={{ flex:1, overflowY:"auto", padding:"14px 16px", display:"flex", flexDirection:"column", gap:10 }}>
            {msgs.map((m, i) => (
              <div key={i} style={{ display:"flex", justifyContent: m.role==="user" ? "flex-end" : "flex-start" }}>
                <div style={{
                  maxWidth:"82%", padding:"10px 13px", borderRadius: m.role==="user" ? "16px 16px 4px 16px" : "16px 16px 16px 4px",
                  background: m.role==="user" ? "#C0153E" : "#f1f5f9",
                  color: m.role==="user" ? "#fff" : "#0f172a",
                  fontSize:13, lineHeight:1.55,
                }}>
                  {m.text}
                </div>
              </div>
            ))}
            {loading && (
              <div style={{ display:"flex", justifyContent:"flex-start" }}>
                <div style={{ background:"#f1f5f9", borderRadius:"16px 16px 16px 4px", padding:"10px 16px", fontSize:18, color:"#94a3b8" }}>•••</div>
              </div>
            )}
            <div ref={bottomRef}/>
          </div>

          {/* Input */}
          <div style={{ padding:"10px 14px", borderTop:"1px solid #f1f5f9", display:"flex", gap:8, flexShrink:0, paddingBottom:"max(10px,env(safe-area-inset-bottom))" }}>
            <input
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key==="Enter" && send()}
              placeholder={t("support_placeholder")}
              style={{ flex:1, padding:"10px 14px", borderRadius:22, border:"1.5px solid #e2e8f0", fontSize:15, outline:"none", background:"#f8fafc" }}
            />
            <button
              onClick={send}
              disabled={!input.trim() || loading}
              style={{ background:"#C0153E", color:"#fff", border:"none", borderRadius:"50%", width:42, height:42, fontSize:18, flexShrink:0, opacity: (!input.trim()||loading) ? 0.4 : 1, display:"flex", alignItems:"center", justifyContent:"center" }}
            >↑</button>
          </div>
        </div>
      </div>
    </>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>
</body>
</html>
