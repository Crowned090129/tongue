name: Tongue regression checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: tongue
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: tongue_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tongue -d tongue_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://tongue:local-test-only@127.0.0.1:5432/tongue_ci_test
      JWT_SECRET: local-test-only
      ADMIN_PASSWORD: local-admin-only
      CONTENT_AUTOGEN: 'off'
      CONTENT_SEED_UPGRADE: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: npm run validate:seed
