# XcodeGen spec for the Tongue native iOS app.
# Generate the Xcode project with:  xcodegen generate
# (install with: brew install xcodegen)
#
# Produces Tongue.xcodeproj with a single app target.

name: Tongue

options:
  bundleIdPrefix: app.tongue
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    # Set your Apple Developer team here (or override in Xcode's Signing & Capabilities).
    # DEVELOPMENT_TEAM: XXXXXXXXXX
    CODE_SIGN_STYLE: Automatic

targets:
  Tongue:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tongue
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tongue.language
        PRODUCT_NAME: Tongue
        INFOPLIST_FILE: Tongue/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tongue/Resources/Tongue.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
    info:
      path: Tongue/Resources/Info.plist
    # APNs push requires the "Push Notifications" capability, which is expressed
    # by the aps-environment key in Tongue.entitlements (see that file).

schemes:
  Tongue:
    build:
      targets:
        Tongue: all
    run:
      config: Debug
    archive:
      config: Release
